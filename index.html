<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>EVORΛ ATHLETES — Application 2025</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #b22222;
      --red2: #d42828;
      --gold: #c0a060;
      --black: #080808;
      --deep: #0d0d0d;
      --surf: #111111;
      --brd: #1e1e1e;
      --fd: 'Bebas Neue', sans-serif;
      --fu: 'Barlow Condensed', sans-serif;
      --fb: 'Barlow', sans-serif;
      --nav-h: 60px;
    }

    html, body {
      background: var(--black);
      color: #e8e8e8;
      font-family: var(--fb);
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
    }

    ::selection { background: var(--red); color: #fff; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--red); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* NAV */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(8,8,8,0.97);
      border-bottom: 1px solid var(--brd);
      backdrop-filter: blur(8px);
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-link {
      color: #444;
      font-size: 11px;
      font-family: var(--fu);
      letter-spacing: 0.2em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color .2s;
    }
    .nav-link:hover { color: white; }

    /* PAGE WRAPPER — pushes content below fixed nav */
    .page { padding-top: var(--nav-h); width: 100%; overflow-x: hidden; }

    /* SECTIONS */
    .section { width: 100%; padding: 80px 20px; }
    .section-inner { max-width: 1080px; margin: 0 auto; }

    /* HERO */
    .hero {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      padding: 60px 20px;
      background: radial-gradient(ellipse at 10% 60%, #1c0404 0%, var(--black) 55%);
      position: relative;
      overflow: hidden;
    }
    .hero-inner { max-width: 900px; animation: fadeUp 1s ease both; }

    .hero-title {
      font-family: var(--fd);
      font-size: clamp(52px, 12vw, 130px);
      line-height: 0.88;
      color: white;
    }

    .hero-sub {
      margin-top: 32px;
      border-left: 2px solid var(--red);
      padding-left: 18px;
      max-width: 480px;
    }

    .hero-stats {
      margin-top: 56px;
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      border-top: 1px solid #161616;
      padding-top: 24px;
    }

    /* GRIDS */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }

    /* FORM */
    .form-page { padding-top: var(--nav-h); width: 100%; }
    .form-inner { max-width: 700px; margin: 0 auto; padding: 32px 20px 80px; }

    .steps-bar { display: flex; gap: 3px; margin-bottom: 36px; }
    .step-item { flex: 1; }
    .step-line { height: 2px; margin-bottom: 5px; transition: background .3s; }
    .step-label { font-family: var(--fu); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.3; }

    input, textarea, select {
      background: #0d0d0d;
      border: 1px solid #222;
      color: white;
      padding: 13px 15px;
      font-size: 14px;
      font-family: var(--fb);
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--red); }
    input::placeholder, textarea::placeholder { color: #3a3a3a; }
    select { appearance: none; cursor: pointer; }
    select option { background: #111; }
    textarea { resize: vertical; }
    button { cursor: pointer; font-family: var(--fu); }

    /* CARDS */
    .card {
      background: var(--surf);
      border: 1px solid var(--brd);
      padding: 24px;
      transition: border-color .3s;
    }
    .card:hover { border-color: var(--red); }

    /* UPLOAD AREA */
    .upload-area {
      border: 1px dashed #252525;
      padding: 28px 20px;
      text-align: center;
      background: #090909;
      cursor: pointer;
      transition: border-color .2s;
    }
    .upload-area:hover { border-color: var(--red); }

    /* ADMIN */
    .admin-wrap { display: flex; height: calc(100vh - var(--nav-h) - 48px); overflow: hidden; }
    .admin-list { width: 320px; border-right: 1px solid var(--brd); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .admin-detail { flex: 1; overflow-y: auto; padding: 24px; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 16px; }
      .grid-2x2 { grid-template-columns: 1fr 1fr; }
      .nav-links .nav-link { display: none; }
      .nav-links .nav-link.admin-btn { display: flex; }
      .hero { padding: 40px 20px; }
      .section { padding: 60px 20px; }
      .admin-list { width: 100%; }
      .admin-detail { display: none; }
      .admin-detail.active { display: block; width: 100%; }
    }

    @media (max-width: 480px) {
      .grid-2x2 { grid-template-columns: 1fr; }
      .hero-stats { gap: 20px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── SCORING ──────────────────────────────────────────────────────────────
    const scoreCandidate = (data) => {
      let score = 0;
      const reasons = [];
      const followers = parseInt(data.followers) || 0;
      const views = parseInt(data.views) || 0;
      const interactions = parseInt(data.interactions) || 0;
      const newFollowers = parseInt(data.newFollowers) || 0;

      if (followers >= 100000) { score += 20; reasons.push("100K+ follower"); }
      else if (followers >= 50000) { score += 17; reasons.push("50K+ follower"); }
      else if (followers >= 30000) { score += 14; reasons.push("30K+ follower"); }
      else if (followers >= 10000) { score += 10; reasons.push("10K+ follower"); }
      else if (followers >= 5000)  { score += 6;  reasons.push("5K+ follower"); }
      else if (followers >= 1000)  { score += 3;  reasons.push("1K+ follower"); }

      const reachRate = followers > 0 ? views / followers : 0;
      if (followers < 10000) {
        if (reachRate >= 1.5) { score += 15; reasons.push("Reach virale"); }
        else if (reachRate >= 1) { score += 12; reasons.push("Reach ottima"); }
        else if (reachRate >= 0.5) { score += 8; reasons.push("Reach buona"); }
        else if (reachRate >= 0.2) score += 4;
      } else if (followers < 50000) {
        if (reachRate >= 1.2) { score += 15; reasons.push("Reach virale"); }
        else if (reachRate >= 0.8) { score += 12; reasons.push("Reach ottima"); }
        else if (reachRate >= 0.4) { score += 8; reasons.push("Reach buona"); }
        else if (reachRate >= 0.2) score += 4;
      } else {
        if (reachRate >= 0.8) { score += 15; reasons.push("Reach eccellente"); }
        else if (reachRate >= 0.5) { score += 12; reasons.push("Reach ottima"); }
        else if (reachRate >= 0.3) { score += 8; reasons.push("Reach buona"); }
        else if (reachRate >= 0.1) score += 4;
      }

      const erReach = views > 0 ? (interactions / views) * 100 : 0;
      if (erReach >= 5) { score += 25; reasons.push("ER eccezionale"); }
      else if (erReach >= 3) { score += 20; reasons.push("ER ottimo"); }
      else if (erReach >= 2) { score += 15; reasons.push("ER buono"); }
      else if (erReach >= 1) { score += 10; reasons.push("ER nella media"); }
      else if (erReach >= 0.5) score += 5;

      const growthRate = followers > 0 ? (newFollowers / followers) * 100 : 0;
      if (followers < 10000) {
        if (growthRate >= 2) { score += 15; reasons.push("Crescita forte"); }
        else if (growthRate >= 1) { score += 10; reasons.push("Crescita buona"); }
        else if (growthRate >= 0.5) score += 6;
      } else if (followers < 50000) {
        if (growthRate >= 1) { score += 15; reasons.push("Crescita forte"); }
        else if (growthRate >= 0.5) { score += 10; reasons.push("Crescita buona"); }
        else if (growthRate >= 0.2) score += 6;
      } else {
        if (growthRate >= 0.5) { score += 15; reasons.push("Crescita forte"); }
        else if (growthRate >= 0.2) { score += 10; reasons.push("Crescita buona"); }
        else if (growthRate >= 0.1) score += 6;
      }

      const keyFields = [data.motivation, data.contentIntegration, data.brandMeaning, data.qualityVsSell];
      let qs = 0;
      keyFields.forEach(f => {
        const len = (f || "").length;
        if (len > 300) qs += 5;
        else if (len > 150) qs += 3;
        else if (len > 50) qs += 1;
      });
      const kws = ["identità","rappresentare","costruire","disciplina","autenticità","valori","reale","genuino","evoluz"];
      const allText = keyFields.join(" ").toLowerCase();
      let kw = 0;
      kws.forEach(k => { if (allText.includes(k)) kw++; });
      qs = Math.min(qs + Math.min(kw, 5), 25);
      if (qs >= 20) reasons.push("Risposte eccellenti");
      else if (qs >= 12) reasons.push("Risposte solide");
      score += qs;

      if (data.hasBrandCollabs === "yes") { score += 5; reasons.push("Exp. brand collabs"); }

      const finalScore = Math.min(score, 100);
      let tier, tierColor, tierLabel;
      if (finalScore >= 75)      { tier="ELITE";   tierColor="#b22222"; tierLabel="Priorità Assoluta"; }
      else if (finalScore >= 55) { tier="PRO";     tierColor="#c0a060"; tierLabel="Alta Priorità"; }
      else if (finalScore >= 35) { tier="RISING";  tierColor="#6a9a7a"; tierLabel="Da Monitorare"; }
      else                       { tier="PENDING"; tierColor="#555";    tierLabel="In Attesa"; }

      return { score: finalScore, tier, tierColor, tierLabel, reasons, erReach: erReach.toFixed(2), reachRate: (reachRate*100).toFixed(1), growthRate: growthRate.toFixed(2) };
    };

    const getApps = () => { try { return JSON.parse(localStorage.getItem("evora_athletes")||"[]"); } catch { return []; } };
    const saveApps = (a) => localStorage.setItem("evora_athletes", JSON.stringify(a));

    // ─── SHARED ───────────────────────────────────────────────────────────────
    function Logo({ size=24 }) {
      return (
        <div style={{display:"flex",alignItems:"baseline",gap:7,flexShrink:0}}>
          <span style={{fontFamily:"var(--fd)",fontSize:size,letterSpacing:"0.12em",color:"white",lineHeight:1}}>EVORΛ</span>
          <span style={{fontFamily:"var(--fu)",fontSize:size*.44,letterSpacing:"0.35em",color:"var(--red)",textTransform:"uppercase"}}>ATHLETES</span>
        </div>
      );
    }

    function Tag({ children, color="var(--red)" }) {
      return (
        <span style={{background:`${color}20`,border:`1px solid ${color}50`,color,padding:"3px 10px",fontSize:10,fontFamily:"var(--fu)",letterSpacing:"0.2em",textTransform:"uppercase",display:"inline-block",flexShrink:0}}>
          {children}
        </span>
      );
    }

    function PrimaryBtn({ children, onClick, style={} }) {
      return (
        <button onClick={onClick}
          style={{background:"var(--red)",border:"none",color:"white",padding:"14px 32px",fontSize:12,letterSpacing:"0.3em",textTransform:"uppercase",fontWeight:700,transition:"background .2s",...style}}
          onMouseEnter={e=>e.currentTarget.style.background="var(--red2)"}
          onMouseLeave={e=>e.currentTarget.style.background="var(--red)"}>
          {children}
        </button>
      );
    }

    function GhostBtn({ children, onClick, style={} }) {
      return (
        <button onClick={onClick}
          style={{background:"transparent",border:"1px solid #2a2a2a",color:"#555",padding:"14px 32px",fontSize:12,letterSpacing:"0.3em",textTransform:"uppercase",fontWeight:700,transition:"all .2s",...style}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="#444";e.currentTarget.style.color="#999";}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor="#2a2a2a";e.currentTarget.style.color="#555";}}>
          {children}
        </button>
      );
    }

    function Field({ label, required, hint, children }) {
      return (
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          <label style={{fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.22em",color:"#555",textTransform:"uppercase"}}>
            {label}{required && <span style={{color:"var(--red)"}}> *</span>}
          </label>
          {children}
          {hint && <span style={{fontFamily:"var(--fu)",fontSize:10,color:"#333",letterSpacing:"0.1em"}}>{hint}</span>}
        </div>
      );
    }

    function Choice({ label, value, selected, onClick }) {
      return (
        <button onClick={()=>onClick(value)}
          style={{padding:"10px 16px",fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",background:selected?"var(--red)":"#0d0d0d",border:`1px solid ${selected?"var(--red)":"#222"}`,color:selected?"white":"#555",transition:"all .2s",flexShrink:0}}>
          {label}
        </button>
      );
    }

    // ─── LANDING ──────────────────────────────────────────────────────────────
    function Landing({ onApply, onAdmin }) {
      return (
        <div className="page">
          {/* NAV */}
          <nav className="nav">
            <Logo size={20}/>
            <div className="nav-links">
              <a href="#filosofia" className="nav-link">Filosofia</a>
              <a href="#livelli" className="nav-link">Livelli</a>
              <a href="#requisiti" className="nav-link">Requisiti</a>
              <a href="#apply" className="nav-link">Apply</a>
              <button onClick={onAdmin} className="nav-link admin-btn"
                style={{background:"transparent",border:"1px solid #1e1e1e",color:"#333",padding:"5px 14px",fontSize:10,fontFamily:"var(--fu)",letterSpacing:"0.2em",textTransform:"uppercase",cursor:"pointer"}}>
                ADMIN
              </button>
            </div>
          </nav>

          {/* HERO */}
          <section className="hero">
            <div className="hero-inner">
              <div style={{fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.5em",color:"var(--red)",textTransform:"uppercase",marginBottom:28}}>
                ▸ Application · 2025 · Programma Selettivo
              </div>
              <h1 className="hero-title">
                EVORΛ<br/>
                <span style={{color:"var(--red)"}}>NON È</span><br/>
                PER TUTTI.
              </h1>
              <div className="hero-sub">
                <p style={{fontFamily:"var(--fu)",fontSize:16,lineHeight:1.85,color:"#666"}}>
                  Cerchiamo persone che vogliono <strong style={{color:"#aaa"}}>rappresentare un'identità</strong>, non promuovere un prodotto.<br/>
                  Se entri, entri per costruire qualcosa.
                </p>
              </div>
              <div style={{marginTop:40,display:"flex",gap:14,flexWrap:"wrap",alignItems:"center"}}>
                <PrimaryBtn onClick={onApply} style={{padding:"16px 40px",fontSize:13,letterSpacing:"0.35em"}}>CANDIDATI ORA</PrimaryBtn>
                <span style={{fontFamily:"var(--fu)",fontSize:10,color:"#2a2a2a",letterSpacing:"0.22em"}}>SELEZIONE CONTINUA · POSTI LIMITATI</span>
              </div>
              <div className="hero-stats">
                {[["<5%","Tasso di accettazione"],["3","Livelli di partnership"],["0 DM","Solo candidature formali"]].map(([n,l])=>(
                  <div key={n}>
                    <div style={{fontFamily:"var(--fd)",fontSize:38,color:"var(--red)",lineHeight:1}}>{n}</div>
                    <div style={{fontFamily:"var(--fu)",fontSize:10,color:"#333",letterSpacing:"0.15em",textTransform:"uppercase",marginTop:3}}>{l}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* FILOSOFIA */}
          <section id="filosofia" className="section">
            <div className="section-inner">
              <div className="grid-2">
                <div>
                  <Tag>Filosofia del Programma</Tag>
                  <h2 style={{fontFamily:"var(--fd)",fontSize:"clamp(36px,5vw,64px)",lineHeight:.94,color:"white",margin:"16px 0 0"}}>
                    NON VENDIAMO.<br/><span style={{color:"#222"}}>RAPPRESENTIAMO.</span>
                  </h2>
                  <div style={{width:40,height:2,background:"var(--red)",margin:"14px 0"}}/>
                  <p style={{fontFamily:"var(--fb)",fontSize:15,lineHeight:1.9,color:"#555",marginBottom:12}}>
                    EVORΛ è nata dalla disciplina, non dal marketing. Il nostro programma non è un canale pubblicitario — è una rete di persone che condividono una visione.
                  </p>
                  <p style={{fontFamily:"var(--fb)",fontSize:15,lineHeight:1.9,color:"#555"}}>
                    Cerchiamo atleti e creator che amplificano un messaggio genuino: evoluzione continua, performance reale, mentalità costruita ogni giorno.
                  </p>
                </div>
                <div className="grid-2x2">
                  {[["DISCIPLINA","Non si tratta di quanto sei grande oggi, ma di quanto lavori ogni giorno."],
                    ["AUTENTICITÀ","Il pubblico sente quando parli di un prodotto che non usi davvero."],
                    ["CRESCITA","Cresciamo insieme. Il tuo successo potenzia il brand, non il contrario."],
                    ["STANDARD","Lavoriamo con chi tiene alta la qualità. Sempre."]
                  ].map(([t,d])=>(
                    <div key={t} className="card">
                      <div style={{fontFamily:"var(--fd)",fontSize:15,color:"var(--red)",marginBottom:8,letterSpacing:"0.08em"}}>{t}</div>
                      <div style={{fontFamily:"var(--fb)",fontSize:13,color:"#4a4a4a",lineHeight:1.75}}>{d}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* LIVELLI */}
          <section id="livelli" className="section" style={{background:"var(--deep)"}}>
            <div className="section-inner">
              <div style={{textAlign:"center",marginBottom:52}}>
                <Tag>Struttura del Programma</Tag>
                <h2 style={{fontFamily:"var(--fd)",fontSize:"clamp(34px,5vw,56px)",color:"white",marginTop:16}}>TRE LIVELLI. UN SISTEMA.</h2>
              </div>
              <div className="grid-3">
                {[
                  {tier:"AFFILIATO",n:"01",color:"#444",desc:"Primo ingresso nel network EVORΛ. Codici sconto personalizzati e commissioni sulle vendite.",perks:["Codice creator dedicato","Commissione 10%","Kit digitale EVORΛ","Accesso contenuti B2B","Newsletter interna"]},
                  {tier:"AMBASSADOR",n:"02",color:"var(--gold)",desc:"Profili selezionati con audience consolidata e alta coerenza con i valori EVORΛ.",perks:["Tutto da Affiliato +","Prodotti mensili","Commissione 15%","Co-creazione contenuti","Menzione canali ufficiali","Early access drop"]},
                  {tier:"ELITE",n:"03",color:"var(--red)",desc:"Il livello più alto. Facce del brand EVORΛ. Collaborazione strategica e contratti formali.",perks:["Tutto da Ambassador +","Contratto formale","Campagne dedicate","Produzione video EVORΛ","Revenue sharing","Advisory role"]}
                ].map((l,i)=>(
                  <div key={l.tier} style={{background:i===1?"#0e0e0e":"var(--surf)",border:`1px solid ${i===1?l.color+"40":"var(--brd)"}`,padding:28,position:"relative",overflow:"hidden"}}>
                    {i===1&&<div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(to right,transparent,var(--gold),transparent)`}}/>}
                    <div style={{fontFamily:"var(--fd)",fontSize:60,color:l.color+"12",position:"absolute",right:8,top:-2,lineHeight:1,pointerEvents:"none"}}>{l.n}</div>
                    <Tag color={l.color}>{l.tier}</Tag>
                    <p style={{fontFamily:"var(--fb)",fontSize:13,color:"#4a4a4a",lineHeight:1.8,margin:"14px 0 18px"}}>{l.desc}</p>
                    <div style={{borderTop:"1px solid var(--brd)",paddingTop:14}}>
                      {l.perks.map(p=>(
                        <div key={p} style={{display:"flex",alignItems:"center",gap:9,marginBottom:7}}>
                          <div style={{width:3,height:3,background:l.color,flexShrink:0,borderRadius:"50%"}}/>
                          <span style={{fontFamily:"var(--fu)",fontSize:12,color:"#666"}}>{p}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* REQUISITI */}
          <section id="requisiti" className="section">
            <div className="section-inner">
              <div className="grid-2">
                <div>
                  <Tag>Criteri di Selezione</Tag>
                  <h2 style={{fontFamily:"var(--fd)",fontSize:"clamp(34px,4vw,52px)",lineHeight:.94,color:"white",margin:"16px 0 0"}}>COSA<br/>VALUTIAMO.</h2>
                  <div style={{width:40,height:2,background:"var(--red)",margin:"14px 0"}}/>
                  <p style={{fontFamily:"var(--fb)",fontSize:14,color:"#4a4a4a",lineHeight:1.9}}>
                    Ogni candidatura viene analizzata manualmente. Non esistono criteri automatici che garantiscono l'accesso.
                  </p>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:2}}>
                  {[["Audience reale","Non contano i follower comprati. Contiamo chi ti ascolta davvero."],
                    ["Coerenza verticale","Il tuo contenuto deve essere radicato in fitness, performance, lifestyle."],
                    ["Qualità produzione","Non serve uno studio. Serve uno standard."],
                    ["Identità personale","Chi sei fuori dal telefono è più importante di quante stories fai."],
                    ["Mentalità costruttiva","Cerchiamo chi pensa in termini di brand building, non di guadagno immediato."]
                  ].map(([t,d])=>(
                    <div key={t} style={{padding:"16px 20px",border:"1px solid var(--brd)",display:"flex",gap:14,transition:"all .3s"}}
                      onMouseEnter={e=>{e.currentTarget.style.borderColor="#2a2a2a";e.currentTarget.style.background="#0a0a0a";}}
                      onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--brd)";e.currentTarget.style.background="transparent";}}>
                      <div style={{width:2,background:"var(--red)",flexShrink:0,alignSelf:"stretch"}}/>
                      <div>

    // ─── ADMIN ────────────────────────────────────────────────────────────────
    function AdminPanel({ onBack }) {
      const [auth,setAuth]=useState(false);
      const [pw,setPw]=useState("");
      const [apps,setApps]=useState([]);
      const [sel,setSel]=useState(null);
      const [filter,setFilter]=useState("ALL");
      const [search,setSearch]=useState("");
      const [note,setNote]=useState("");
      const [code,setCode]=useState("");
      const [showDetail,setShowDetail]=useState(false);
      const PASS="evora2025";

      useEffect(()=>{if(auth)setApps(getApps());},[auth]);

      const upd=(id,patch)=>{
        const u=apps.map(a=>a.id===id?{...a,...patch}:a);
        setApps(u);saveApps(u);
        if(sel?.id===id)setSel(p=>({...p,...patch}));
      };
      const del=(id)=>{
        if(!window.confirm("Eliminare?"))return;
        const u=apps.filter(a=>a.id!==id);
        setApps(u);saveApps(u);setSel(null);setShowDetail(false);
      };

      const selectApp = (a) => { setSel(a); setNote(a.notes||""); setCode(a.creatorCode||""); setShowDetail(true); };

      const list=apps.filter(a=>{
        const mt=filter==="ALL"?true:filter==="NEW"?a.status==="new":a.tier===filter;
        const ms=!search||(a.fullName||"").toLowerCase().includes(search.toLowerCase())||(a.instagram||"").toLowerCase().includes(search.toLowerCase());
        return mt&&ms;
      });

      const st={total:apps.length,nw:apps.filter(a=>a.status==="new").length,el:apps.filter(a=>a.tier==="ELITE").length,pr:apps.filter(a=>a.tier==="PRO").length,ri:apps.filter(a=>a.tier==="RISING").length,ap:apps.filter(a=>a.status==="approved").length};

      if(!auth) return (
        <div style={{minHeight:"100vh",background:"var(--black)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{width:"100%",maxWidth:340,animation:"fadeUp .6s ease both"}}>
            <Logo size={20}/>
            <h2 style={{fontFamily:"var(--fd)",fontSize:36,color:"white",margin:"24px 0 6px"}}>AREA RISERVATA</h2>
            <p style={{fontFamily:"var(--fb)",fontSize:13,color:"#3a3a3a",marginBottom:24}}>Accesso esclusivo team EVORΛ</p>
            <input type="password" placeholder="Password admin" style={{marginBottom:10}} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&pw===PASS&&setAuth(true)}/>
            <PrimaryBtn onClick={()=>pw===PASS?setAuth(true):alert("Password errata")} style={{width:"100%",padding:"13px"}}>ACCEDI</PrimaryBtn>
            <GhostBtn onClick={onBack} style={{width:"100%",marginTop:8,padding:"13px"}}>← TORNA AL SITO</GhostBtn>
            <div style={{fontFamily:"var(--fu)",fontSize:10,color:"#1e1e1e",letterSpacing:"0.15em",textAlign:"center",marginTop:12}}>DEMO: evora2025</div>
          </div>
        </div>
      );

      return (
        <div style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {/* Nav */}
          <div style={{height:60,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",borderBottom:"1px solid var(--brd)",background:"var(--deep)",flexShrink:0}}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <Logo size={16}/>
              <Tag color="var(--red)">ADMIN</Tag>
            </div>
            <GhostBtn onClick={onBack} style={{padding:"6px 14px",fontSize:10}}>← SITO</GhostBtn>
          </div>

          {/* Stats */}
          <div style={{display:"flex",background:"var(--surf)",borderBottom:"1px solid var(--brd)",flexShrink:0,overflowX:"auto"}}>
            {[["TOT",st.total,"white"],["NUOVE",st.nw,"var(--red)"],["ELITE",st.el,"var(--red)"],["PRO",st.pr,"var(--gold)"],["RISING",st.ri,"#6a9a7a"],["OK",st.ap,"#6a9a7a"]].map(([l,v,c])=>(
              <div key={l} style={{padding:"12px 20px",borderRight:"1px solid var(--brd)",textAlign:"center",minWidth:70,flexShrink:0}}>
                <div style={{fontFamily:"var(--fd)",fontSize:22,color:c,lineHeight:1}}>{v}</div>
                <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.15em",marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>

          {/* Content */}
          <div style={{display:"flex",flex:1,overflow:"hidden"}}>
            {/* List — hidden on mobile when detail is open */}
            <div style={{width:"min(320px, 100%)",borderRight:"1px solid var(--brd)",display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0,display:showDetail?"none":"flex"}} className="admin-list-wrap">
              <div style={{padding:"12px 14px",borderBottom:"1px solid var(--brd)"}}>
                <input placeholder="Cerca nome, @handle..." style={{marginBottom:8,fontSize:12}} value={search} onChange={e=>setSearch(e.target.value)}/>
                <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                  {["ALL","NEW","ELITE","PRO","RISING","PENDING"].map(f=>(
                    <button key={f} onClick={()=>setFilter(f)}
                      style={{padding:"4px 8px",fontFamily:"var(--fu)",fontSize:8,letterSpacing:"0.08em",textTransform:"uppercase",cursor:"pointer",background:filter===f?"var(--red)":"#0d0d0d",border:`1px solid ${filter===f?"var(--red)":"#1a1a1a"}`,color:filter===f?"white":"#3a3a3a",transition:"all .2s"}}>{f}</button>
                  ))}
                </div>
              </div>
              <div style={{overflow:"auto",flex:1}}>
                {list.length===0&&<div style={{padding:24,textAlign:"center",fontFamily:"var(--fu)",fontSize:10,color:"#1e1e1e",letterSpacing:"0.2em"}}>NESSUNA CANDIDATURA</div>}
                {list.map(a=>(
                  <div key={a.id} onClick={()=>selectApp(a)}
                    style={{padding:"12px 16px",borderBottom:"1px solid var(--brd)",cursor:"pointer",background:sel?.id===a.id?"#0e0e0e":"transparent",borderLeft:`2px solid ${sel?.id===a.id?"var(--red)":"transparent"}`,transition:"all .15s"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                      <div>
                        <div style={{fontFamily:"var(--fu)",fontSize:13,color:"white"}}>{a.fullName||"—"}</div>
                        <div style={{fontFamily:"var(--fb)",fontSize:11,color:"#3a3a3a",marginTop:1}}>{a.instagram}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                        <Tag color={a.tierColor}>{a.tier}</Tag>
                        {a.status==="new"&&<Tag color="var(--red)">NEW</Tag>}
                        {a.status==="approved"&&<Tag color="#6a9a7a">✓</Tag>}
                        {a.status==="rejected"&&<Tag color="#5a2a2a">✗</Tag>}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <span style={{fontFamily:"var(--fu)",fontSize:10,color:"#3a3a3a"}}>👥 {parseInt(a.followers||0).toLocaleString()}</span>
                      <span style={{fontFamily:"var(--fu)",fontSize:10,color:"#3a3a3a"}}>ER {a.erReach}%</span>
                      <span style={{fontFamily:"var(--fd)",fontSize:18,color:a.tierColor,marginLeft:"auto"}}>{a.score}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Detail */}
            {sel && showDetail && (
              <div style={{flex:1,overflow:"auto",padding:20}}>
                {/* Back button on mobile */}
                <button onClick={()=>setShowDetail(false)}
                  style={{background:"transparent",border:"none",color:"#555",fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.2em",marginBottom:20,display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                  ← LISTA
                </button>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:12}}>
                  <div>
                    <h2 style={{fontFamily:"var(--fd)",fontSize:"clamp(28px,5vw,40px)",color:"white",lineHeight:1}}>{sel.fullName}</h2>
                    <div style={{fontFamily:"var(--fb)",fontSize:13,color:"#4a4a4a",marginTop:3}}>{sel.email} · {sel.city} · {sel.age} anni</div>
                    <div style={{display:"flex",gap:7,marginTop:10,flexWrap:"wrap"}}>
                      <Tag color={sel.tierColor}>{sel.tier}</Tag>
                      <Tag color="#2a2a2a">{sel.tierLabel}</Tag>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontFamily:"var(--fd)",fontSize:60,color:sel.tierColor,lineHeight:1}}>{sel.score}</div>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a"}}>/ 100</div>
                  </div>
                </div>

                {/* Score breakdown */}
                <div style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:16,marginBottom:16}}>
                  <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.28em",marginBottom:8}}>ANALISI</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                    {sel.reasons?.map(r=><Tag key={r} color="#2a2a2a">{r}</Tag>)}
                  </div>
                  <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
                    {[["ER",`${sel.erReach}%`,"var(--red)"],["REACH",`${sel.reachRate}%`,"var(--gold)"],["GROWTH",`${sel.growthRate}%`,"#6a9a7a"]].map(([l,v,c])=>(
                      <div key={l}>
                        <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a"}}>{l}</div>
                        <div style={{fontFamily:"var(--fd)",fontSize:20,color:c}}>{v}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Screenshot */}
                {sel.screenshotData && (
                  <div style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:14,marginBottom:16}}>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.28em",marginBottom:10}}>SCREENSHOT INSIGHTS</div>
                    <img src={sel.screenshotData} alt="Insights" style={{width:"100%",maxHeight:300,objectFit:"contain"}}/>
                  </div>
                )}

                {/* Dati griglia */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:2,marginBottom:16}}>
                  {[["Instagram",sel.instagram],["TikTok",sel.tiktok||"—"],["Follower",parseInt(sel.followers||0).toLocaleString()],["Visualizzazioni",parseInt(sel.views||0).toLocaleString()],["Interazioni",parseInt(sel.interactions||0).toLocaleString()],["+Follower",`+${sel.newFollowers||0}`]].map(([k,v])=>(
                    <div key={k} style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:"10px 12px"}}>
                      <div style={{fontFamily:"var(--fu)",fontSize:8,color:"#2a2a2a",letterSpacing:"0.18em",marginBottom:3}}>{k}</div>
                      <div style={{fontFamily:"var(--fu)",fontSize:12,color:"white"}}>{v}</div>
                    </div>
                  ))}
                </div>

                {/* Risposte */}
                {[["3 PAROLE",sel.threeWords],["TIPO CONTENUTI",sel.contentType],["COSA TRASMETTE",sel.whatToTransmit],["PERCHÉ EVORΛ",sel.motivation],["COSA GLI PIACE",sel.brandLike],["COME INTEGREREBBE",sel.contentIntegration],["IMMAGINE ATLETA",sel.athleteImage],["QUALITÀ VS VENDERE",sel.qualityVsSell],["COSTRUIRE SENZA GUADAGNO",sel.buildWithoutEarnings],["REAZIONE BAD CONTENT",sel.badContentReaction],["RAPPRESENTARE UN BRAND",sel.brandMeaning],["CONTENUTI/MESE",sel.contentPerMonth],["ROUTINE",sel.hasRoutine],["LINEE GUIDA",sel.followsGuidelines],["PRODOTTI ACQUISTATI",sel.boughtProducts],["MIGLIORAMENTI",sel.improvements],["NOTA EXTRA",sel.extra],["DETTAGLI COLLABS",sel.brandCollabDetails]].filter(([,v])=>v).map(([k,v])=>(
                  <div key={k} style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:14,marginBottom:6}}>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.25em",marginBottom:6}}>{k}</div>
                    <p style={{fontFamily:"var(--fb)",fontSize:13,color:"#777",lineHeight:1.8}}>{v}</p>
                  </div>
                ))}

                {/* Admin tools */}
                <div style={{borderTop:"1px solid var(--brd)",paddingTop:20,marginTop:16,display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                  <div>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.25em",marginBottom:7}}>CODICE CREATOR</div>
                    <div style={{display:"flex",gap:6}}>
                      <input value={code} onChange={e=>setCode(e.target.value)} placeholder="MARIO10" style={{fontSize:12}}/>
                      <button onClick={()=>upd(sel.id,{creatorCode:code})} style={{background:"#111",border:"1px solid #2a2a2a",color:"#555",padding:"10px 12px",fontFamily:"var(--fu)",fontSize:9,cursor:"pointer",whiteSpace:"nowrap"}}>SALVA</button>
                    </div>
                    {sel.creatorCode&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"#6a9a7a",marginTop:5}}>✓ {sel.creatorCode}</div>}
                  </div>
                  <div>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.25em",marginBottom:7}}>STATO</div>
                    <div style={{display:"flex",gap:3}}>
                      {[["new","NEW","#2a2a2a"],["review","REV","var(--gold)"],["approved","OK","#1a4a1a"],["rejected","NO","#4a1a1a"]].map(([s,l,c])=>(
                        <button key={s} onClick={()=>upd(sel.id,{status:s})} style={{flex:1,padding:"9px 4px",fontFamily:"var(--fu)",fontSize:8,letterSpacing:"0.06em",textTransform:"uppercase",cursor:"pointer",background:sel.status===s?c:"#0d0d0d",border:`1px solid ${sel.status===s?c:"#1a1a1a"}`,color:sel.status===s?"white":"#3a3a3a",transition:"all .2s"}}>{l}</button>
                      ))}
                    </div>
                  </div>
                </div>

                <div style={{marginTop:14}}>
                  <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.25em",marginBottom:7}}>NOTE INTERNE</div>
                  <textarea value={note} onChange={e=>setNote(e.target.value)} rows={4} placeholder="Note riservate al team..." style={{fontSize:13}}/>
                  <div style={{display:"flex",justifyContent:"space-between",marginTop:9,gap:8}}>
                    <PrimaryBtn onClick={()=>upd(sel.id,{notes:note})} style={{flex:1,padding:"11px",fontSize:11}}>SALVA NOTE</PrimaryBtn>
                    <button onClick={()=>del(sel.id)} style={{background:"transparent",border:"1px solid #3a1010",color:"#5a2020",padding:"11px 18px",fontFamily:"var(--fu)",fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",cursor:"pointer"}}>ELIMINA</button>
                  </div>
                </div>
              </div>
            )}

            {/* Empty state — only on desktop */}
            {!showDetail && (
              <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10}}>
                <div style={{fontFamily:"var(--fd)",fontSize:40,color:"#141414"}}>EVORΛ</div>
                <div style={{fontFamily:"var(--fu)",fontSize:10,color:"#1e1e1e",letterSpacing:"0.3em"}}>SELEZIONA UNA CANDIDATURA</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── APP ──────────────────────────────────────────────────────────────────
    function App() {
      const [view,setView]=useState("landing");
      return (
        <>
          {view==="landing" && <Landing onApply={()=>setView("apply")} onAdmin={()=>setView("admin")}/>}
          {view==="apply"   && <ApplicationForm onBack={()=>setView("landing")}/>}
          {view==="admin"   && <AdminPanel onBack={()=>setView("landing")}/>}
        </>
      );
    }

    ReactDOM.render(<App/>, document.getElementById("root"));
  </script>
</body>
</html>
