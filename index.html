<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0E">
<meta name="description" content="EVORΛ COLLECTIVE — il Partner Program EVORΛ dedicato a creator, coach e personalità del mondo fitness.">
<title>EVORΛ COLLECTIVE — Partner Program</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Questrial&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --red:#B22222; --red-hi:#cc2a2a; --red-dim:#7d1818;
  --bg:#0E0E0E; --bg-2:#141414; --surf:#191919; --surf-2:#1F1F1F;
  --brd:#2C2C2C; --brd-hi:#3D3D3D;
  --t1:#EFF0F5; --t2:#C4C5CB; --t3:#8E8F96; --t4:#63646B;
  --ok:#27AE60; --warn:#E67E22; --info:#3A7BD5; --bad:#C0392B;
  --fh:'Archivo',system-ui,sans-serif; --fb:'Questrial',system-ui,sans-serif;
  --max:1080px; --maxpanel:1120px;
}

html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--t2);font-family:var(--fb);font-size:16px;line-height:1.6;overflow-x:hidden;width:100%;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;}
::selection{background:var(--red);color:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--brd-hi);border-radius:4px;}

:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- TIPOGRAFIA ---------- */
.h-xl{font-family:var(--fh);font-weight:800;font-size:clamp(32px,7vw,64px);line-height:1.02;letter-spacing:-0.02em;color:var(--t1);}
.h-lg{font-family:var(--fh);font-weight:800;font-size:clamp(26px,4.4vw,40px);line-height:1.08;letter-spacing:-0.015em;color:var(--t1);}
.h-md{font-family:var(--fh);font-weight:700;font-size:clamp(20px,3vw,26px);line-height:1.15;color:var(--t1);}
.h-sm{font-family:var(--fh);font-weight:700;font-size:16px;line-height:1.25;color:var(--t1);}
.eyebrow{font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--red);}
.label-xs{font-family:var(--fh);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);}
.body{font-family:var(--fb);font-size:16px;line-height:1.75;color:var(--t2);}
.body-sm{font-family:var(--fb);font-size:14px;line-height:1.7;color:var(--t3);}
.rule{width:44px;height:2px;background:var(--red);}

/* ---------- LAYOUT ---------- */
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 20px;}
.wrap-narrow{width:100%;max-width:720px;margin:0 auto;padding:0 20px;}
.wrap-panel{width:100%;max-width:var(--maxpanel);margin:0 auto;padding:0 16px;}
.section{padding:72px 0;}
.section-tight{padding:48px 0;}
.divider{height:1px;background:var(--brd);}

/* ---------- NAV ---------- */
.nav{position:sticky;top:0;z-index:900;background:rgba(14,14,14,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd);}
.nav-link{font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);text-decoration:none;transition:color .18s;background:none;border:none;cursor:pointer;padding:6px 2px;}
.nav-link:hover,.nav-link:focus-visible{color:var(--t1);}

/* Header pubblico desktop: logo centrato sopra, sezioni sotto */
.hd{display:none;}
@media(min-width:861px){
  .hd{display:block;padding:16px 0 0;}
  .hd-logo{display:flex;justify-content:center;margin-bottom:12px;}
  .hd-nav{display:flex;justify-content:center;align-items:center;gap:32px;padding-bottom:12px;}
}

/* Header pubblico mobile: logo centrato + hamburger */
.hm{display:flex;align-items:center;justify-content:center;height:58px;position:relative;}
@media(min-width:861px){.hm{display:none;}}
.hm-burger{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:none;border:none;cursor:pointer;}
.hm-burger span{display:block;width:20px;height:2px;background:var(--t2);transition:transform .25s,opacity .2s;}
.hm-burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hm-burger[aria-expanded="true"] span:nth-child(2){opacity:0;}
.hm-burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.hm-panel{border-top:1px solid var(--brd);background:var(--bg);overflow:hidden;max-height:0;transition:max-height .28s ease;}
.hm-panel.open{max-height:340px;}
.hm-item{display:block;width:100%;text-align:left;padding:16px 20px;border-bottom:1px solid var(--brd);background:none;border-left:none;border-right:none;border-top:none;color:var(--t2);font-family:var(--fh);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.hm-item:active{background:var(--surf);}

/* Compensa l'header fisso quando si salta a una sezione */
section[id]{scroll-margin-top:120px;}
@media(max-width:860px){section[id]{scroll-margin-top:72px;}}

/* ---------- BOTTONI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fh);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:16px 30px;border:1px solid transparent;cursor:pointer;transition:all .18s;text-decoration:none;min-height:48px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--red-hi);}
.btn-ghost{background:transparent;border-color:var(--brd-hi);color:var(--t2);}
.btn-ghost:hover:not(:disabled){border-color:var(--t3);color:var(--t1);}
.btn-sm{padding:9px 16px;font-size:10px;letter-spacing:.14em;min-height:36px;}
.btn-danger{background:transparent;border-color:var(--red-dim);color:#D46A6A;}
.btn-danger:hover{background:rgba(178,34,34,.12);}

/* ---------- CARD ---------- */
.card{background:var(--surf);border:1px solid var(--brd);padding:22px;}
.card-hover{transition:border-color .25s;}
.card-hover:hover{border-color:var(--brd-hi);}
.panel{background:var(--surf);border:1px solid var(--brd);}

/* ---------- FORM ---------- */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.field-label{font-family:var(--fh);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);line-height:1.4;}
.field-req{color:var(--red);}
.field-hint{font-family:var(--fb);font-size:13px;color:var(--t4);line-height:1.5;}
.field-err{font-family:var(--fb);font-size:13px;color:#E06666;}
input,textarea,select{width:100%;background:var(--bg-2);border:1px solid var(--brd);color:var(--t1);padding:14px 15px;font-size:16px;font-family:var(--fb);outline:none;transition:border-color .18s;border-radius:0;}
input:focus,textarea:focus,select:focus{border-color:var(--red);}
input::placeholder,textarea::placeholder{color:var(--t4);}
input[aria-invalid="true"],textarea[aria-invalid="true"],select[aria-invalid="true"]{border-color:#B03A3A;}
textarea{resize:vertical;min-height:110px;line-height:1.65;}
select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px;}
select option{background:var(--surf-2);color:var(--t1);}
.counter{font-family:var(--fh);font-size:11px;letter-spacing:.08em;color:var(--t4);text-align:right;}

.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-family:var(--fh);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;background:var(--bg-2);border:1px solid var(--brd);color:var(--t3);cursor:pointer;transition:all .16s;min-height:44px;}
.chip:hover{border-color:var(--brd-hi);color:var(--t2);}
.chip-on{background:var(--red);border-color:var(--red);color:#fff;}

.check{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:14px;border:1px solid var(--brd);background:var(--bg-2);transition:border-color .18s;}
.check:hover{border-color:var(--brd-hi);}
.check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--red);margin-top:1px;cursor:pointer;}
.check span{font-family:var(--fb);font-size:14px;line-height:1.6;color:var(--t2);}

/* ---------- STEPS ---------- */
.steps{display:flex;gap:4px;margin-bottom:8px;}
.step-seg{flex:1;height:3px;background:var(--brd);transition:background .3s;}
.step-seg.done{background:var(--red);}
.step-meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:26px;}

/* ---------- UPLOAD ---------- */
.drop{border:2px dashed var(--brd-hi);background:var(--bg-2);padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;transition:border-color .2s,background .2s;}
.drop.over{border-color:var(--red);background:rgba(178,34,34,.06);}
.drop.err{border-color:#B03A3A;}
.file-btn{display:block;width:100%;text-align:center;padding:14px;background:var(--surf-2);border:1px solid var(--brd);color:var(--t2);font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .18s;min-height:48px;}
.file-btn:hover{border-color:var(--brd-hi);color:var(--t1);}
.status-box{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--brd);background:var(--bg-2);}
.spinner{width:16px;height:16px;border:2px solid var(--brd-hi);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;margin-top:2px;}

/* ---------- BADGE ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--fh);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border:1px solid;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ---------- ADMIN ---------- */
.admin-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.admin-bar{border-bottom:1px solid var(--brd);background:var(--bg-2);flex-shrink:0;}
.admin-bar-in{display:flex;align-items:center;justify-content:space-between;height:56px;gap:10px;}
.tabs{display:flex;border-bottom:1px solid var(--brd);background:var(--bg-2);overflow-x:auto;}
.tab{padding:13px 18px;font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;color:var(--t4);cursor:pointer;white-space:nowrap;transition:all .18s;}
.tab:hover{color:var(--t2);}
.tab-on{color:var(--t1);border-bottom-color:var(--red);}

.stat{padding:12px 10px;border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);text-align:center;cursor:pointer;transition:background .18s;background:none;}
.stat:hover{background:var(--surf);}
.stat-on{background:var(--surf-2);}
.stat-n{font-family:var(--fh);font-weight:800;font-size:22px;line-height:1;}
.stat-l{font-family:var(--fh);font-weight:500;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t4);margin-top:4px;line-height:1.3;}

.row{border-bottom:1px solid var(--brd);cursor:pointer;transition:background .15s;background:none;width:100%;text-align:left;display:block;border-left:3px solid transparent;}
.row:hover{background:var(--surf);}
.metric-cell{text-align:center;min-width:0;}
.metric-v{font-family:var(--fh);font-weight:700;font-size:14px;line-height:1.1;}
.metric-l{font-family:var(--fh);font-weight:500;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);margin-bottom:3px;}

.detail-block{background:var(--bg-2);border:1px solid var(--brd);padding:16px;margin-bottom:8px;}
.detail-q{font-family:var(--fh);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;}
.detail-a{font-family:var(--fb);font-size:15px;line-height:1.8;color:var(--t2);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;}
.kv{background:var(--surf);border:1px solid var(--brd);padding:11px 14px;min-width:0;}
.kv-k{font-family:var(--fh);font-weight:500;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t4);margin-bottom:4px;}
.kv-v{font-family:var(--fh);font-weight:700;font-size:14px;color:var(--t1);word-break:break-word;}

.rate-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--brd);flex-wrap:wrap;}
.rate-btns{display:flex;gap:4px;}
.rate-b{width:36px;height:36px;background:var(--bg-2);border:1px solid var(--brd);color:var(--t4);font-family:var(--fh);font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;}
.rate-b:hover{border-color:var(--brd-hi);color:var(--t2);}
.rate-on{background:var(--red);border-color:var(--red);color:#fff;}

.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid var(--brd-hi);border-radius:50%;color:var(--t4);font-family:var(--fh);font-size:10px;font-weight:700;cursor:help;flex-shrink:0;}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:2px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.g2-gap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3-gap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:720px){
  .g2,.g3,.g2-gap,.g3-gap{grid-template-columns:1fr;}
  .g3-gap{grid-template-columns:1fr;gap:8px;}
  .section{padding:52px 0;}
}
.g3-keep{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>

/* ============================================================================
   2b. AUTENTICAZIONE STAFF
   Il codice viaggia verso il Worker, che lo confronta con i propri secret e
   restituisce un token Firebase contenente il ruolo. Il ruolo arriva quindi
   firmato dal server: modificarlo dal browser non produce alcun effetto,
   perché le regole Firestore leggono il claim del token, non lo stato React.
   ========================================================================== */
const AUTH = {
  async login(code){
    let res;
    try{
      res = await fetch(AUTH_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ code })
      });
    }catch(e){ throw new Error("Servizio di accesso non raggiungibile."); }

    let data = {};
    try{ data = await res.json(); }catch(e){}

    if(res.status===401) throw new Error("Codice non riconosciuto.");
    if(res.status===429) throw new Error("Troppi tentativi. Riprova tra qualche minuto.");
    if(!res.ok || !data.token) throw new Error(data.error || "Accesso non riuscito.");

    await auth.signInWithCustomToken(data.token);
    const t = await auth.currentUser.getIdTokenResult(true);
    const role = t.claims.role;
    if(role!=="admin" && role!=="manager"){
      await auth.signOut();
      throw new Error("Ruolo non valido.");
    }
    sessionStorage.setItem("evora_login_at", String(Date.now()));
    return role;
  },

  /** Ruolo corrente letto dal token firmato, mai da uno stato locale. */
  async currentRole(){
    const u = auth.currentUser;
    if(!u) return null;
    const started = parseInt(sessionStorage.getItem("evora_login_at")||"0",10);
    if(!started || Date.now()-started > SESSION_HOURS*3600*1000){
      await AUTH.logout();
      return null;
    }
    try{
      const t = await u.getIdTokenResult();
      const r = t.claims.role;
      return (r==="admin"||r==="manager") ? r : null;
    }catch(e){ return null; }
  },

  async logout(){
    sessionStorage.removeItem("evora_login_at");
    try{ await auth.signOut(); }catch(e){}
  }
};

/* ============================================================================
   3. OCR — lettura automatica Insights.
   Formato richiesta identico all'originale: NON modificare senza aggiornare
   il Cloudflare Worker.
   ========================================================================== */
const extractInsights = async (base64Image) => {
  const parts = base64Image.split(",");
  const base64Data = parts[1];
  const mediaType = parts[0].split(":")[1].split(";")[0];

  let res;
  try{
    res = await fetch(OCR_PROXY, {
      method:"POST",
      // La chiave Anthropic resta nei secret del Worker: il browser non la vede mai.
      headers:{
        "Content-Type":"application/json",
        "anthropic-version":"2023-06-01"
      },
      body: JSON.stringify({
        model: OCR_MODEL,
        max_tokens: 200,
        messages:[{
          role:"user",
          content:[
            { type:"image", source:{ type:"base64", media_type:mediaType, data:base64Data } },
            { type:"text", text:"Questo screenshot proviene dalla Dashboard per professionisti di Instagram, sezione Visualizzazioni, periodo 30 giorni. Estrai esattamente questi quattro valori: Visualizzazioni, Follower netti, Interazioni, Account raggiunti. Rispondi SOLO con questo JSON: {\"views\":\"\",\"netFollowers\":\"\",\"interactions\":\"\",\"accountsReached\":\"\"}. Riporta ogni numero esattamente come appare nello screenshot, mantenendo separatori e il segno + o - dei follower netti. Se un valore non è visibile scrivi \"0\". Nessun altro testo." }
          ]
        }]
      })
    });
  }catch(e){ throw new Error("Connessione non riuscita"); }

  if(!res.ok){
    let msg="Servizio non disponibile";
    try{ const e=await res.json(); msg=(e.error&&e.error.message)||msg; }catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  const raw = data.content[0].text.trim();
  const match = raw.match(/\{[\s\S]*\}/);
  if(!match) throw new Error("Immagine non leggibile: controlla che i quattro dati siano visibili.");
  let parsed;
  try{ parsed = JSON.parse(match[0]); }
  catch(e){ throw new Error("Immagine non leggibile: controlla che i quattro dati siano visibili."); }
  return {
    views:           toNum(parsed.views),
    netFollowers:    toNum(parsed.netFollowers),
    interactions:    toNum(parsed.interactions),
    accountsReached: toNum(parsed.accountsReached)
  };
};

   Valuta ESCLUSIVAMENTE i dati numerici Instagram.
   Nessuna analisi delle risposte, nessuna keyword, nessun giudizio automatico.

const SCORING_VERSION = 2;   // incrementare quando cambiano formule o benchmark predefiniti

const DEFAULT_SCORING = {

    {v:"LOW",     l:"Performance numerica bassa", min:0,  c:"#C0392B"}
  ],
  bands: [
    { label:"0–1K",     max:1000,
      er:{avg:3,good:6,excellent:10},    reach:{avg:60,good:120,excellent:250}, growth:{avg:1,good:3,excellent:7} },
    { label:"1K–5K",    max:5000,
      er:{avg:2.5,good:5,excellent:8},   reach:{avg:40,good:80,excellent:160},  growth:{avg:0.5,good:1.5,excellent:4} },
    { label:"5K–20K",   max:20000,
      er:{avg:2,good:4,excellent:7},     reach:{avg:30,good:60,excellent:120},  growth:{avg:0.3,good:1,excellent:3} },
    { label:"20K–100K", max:100000,
      er:{avg:1.5,good:3,excellent:5},   reach:{avg:20,good:40,excellent:80},   growth:{avg:0.15,good:0.5,excellent:1.5} },
    { label:"100K+",    max:Infinity,
      er:{avg:1,good:2,excellent:4},     reach:{avg:15,good:30,excellent:60},   growth:{avg:0.08,good:0.25,excellent:0.8} }
  ]
};

// Normalizza config salvate con lo schema precedente (tiers ELITE/PRO/...).
const normalizeScoring = (cfg) => {
  // Una configurazione salvata con lo schema precedente (formule e benchmark diversi)
  // non viene applicata: si riparte dai valori predefiniti aggiornati.
  // Il documento su Firestore resta invariato finché l'admin non salva di nuovo.
  if(!cfg || cfg.version !== SCORING_VERSION) return JSON.parse(JSON.stringify(DEFAULT_SCORING));
  const out = JSON.parse(JSON.stringify(DEFAULT_SCORING));
  if(cfg.weights) out.weights = { ...out.weights, ...cfg.weights };
  if(Array.isArray(cfg.bands) && cfg.bands.length){
    out.bands = cfg.bands.map((b,i)=>({
      label: b.label || out.bands[i] && out.bands[i].label || ("Fascia "+(i+1)),
      max:   (b.max===null || b.max===undefined) ? Infinity : b.max,
      er:    { ...out.bands[i] ? out.bands[i].er : {},     ...(b.er||{}) },
      reach: { ...out.bands[i] ? out.bands[i].reach : {},  ...(b.reach||{}) },
      growth:{ ...out.bands[i] ? out.bands[i].growth : {}, ...(b.growth||{}) }
    }));
    // Vecchio schema: soglia "poor" invece di "excellent"
    out.bands.forEach(b=>["er","reach","growth"].forEach(m=>{
      if(b[m].excellent===undefined && b[m].good!==undefined) b[m].excellent = b[m].good*2;
      if(b[m].avg===undefined) b[m].avg = (b[m].poor!==undefined ? b[m].poor : 0);
    }));
  }
  if(Array.isArray(cfg.levels) && cfg.levels.length) out.levels = cfg.levels;
  else if(Array.isArray(cfg.tiers) && cfg.tiers.length){
    const byMin = [...cfg.tiers].sort((a,b)=>b.min-a.min);
    out.levels = out.levels.map((lv,i)=> byMin[i] ? { ...lv, min:byMin[i].min } : lv);
  }
  return out;
};

const bandFor = (followers, cfg) =>
  cfg.bands.find(b => followers <= (b.max===null?Infinity:b.max)) || cfg.bands[cfg.bands.length-1];

// 4 livelli: <avg Scarso(0-25) · avg→good Medio(25-50) · good→excellent Buono(50-75) · >excellent Eccellente(75-100)
const normalizeMetric = (value, th) => {
  if(!th || value<=0) return 0;
  const {avg,good,excellent} = th;
  if(value >= excellent) return Math.min(100, 75 + ((value-excellent)/Math.max(excellent,0.01))*25);
  if(value >= good)      return 50 + ((value-good)/Math.max(excellent-good,0.01))*25;
  if(value >= avg)       return 25 + ((value-avg)/Math.max(good-avg,0.01))*25;
  return Math.max(0, (value/Math.max(avg,0.01))*25);
};

const METRIC_GRADES = [
  {min:75, l:"Eccellente", c:"#3A7BD5", bg:"rgba(58,123,213,.12)"},
  {min:50, l:"Buono",      c:"#27AE60", bg:"rgba(39,174,96,.12)"},
  {min:25, l:"Medio",      c:"#E67E22", bg:"rgba(230,126,34,.12)"},
  {min:0,  l:"Scarso",     c:"#C0392B", bg:"rgba(192,57,43,.12)"}
];
const gradeOf = s => METRIC_GRADES.find(g=>s>=g.min) || METRIC_GRADES[3];

/**
 * Calcola il Social Performance Score.
 * Ricalcolato a ogni lettura: modificare i benchmark aggiorna anche i profili storici.
 */
const computeSocial = (data, cfgRaw) => {
  const cfg = cfgRaw || DEFAULT_SCORING;
  const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
  const has = v => !(v===undefined || v===null || v==="");

  const followers    = n(data.followers);
  const views        = n(data.views);
  const interactions = n(data.interactions);
  // Compatibilità con le candidature precedenti:
  // se manca accountsReached si usano le visualizzazioni, se manca netFollowers si usa newFollowers.
  const reached = has(data.accountsReached) ? n(data.accountsReached) : views;
  const net     = has(data.netFollowers)    ? n(data.netFollowers)    : n(data.newFollowers);

  const band   = bandFor(followers, cfg);
  const er     = reached>0   ? (interactions/reached)*100 : 0;   // interazioni / account raggiunti
  const reach  = followers>0 ? (reached/followers)*100    : 0;   // account raggiunti / follower
  const growth = followers>0 ? (net/followers)*100        : 0;   // follower netti / follower

  const erScore     = normalizeMetric(er, band.er);
  const reachScore  = normalizeMetric(reach, band.reach);
  const growthScore = normalizeMetric(Math.max(growth,0), band.growth);

  const w  = cfg.weights;
  const tw = (+w.er||0)+(+w.reach||0)+(+w.growth||0) || 100;
  const socialScore = Math.round((erScore*(+w.er||0) + reachScore*(+w.reach||0) + growthScore*(+w.growth||0)) / tw);

  const level = [...cfg.levels].sort((a,b)=>b.min-a.min).find(l=>socialScore>=l.min) || cfg.levels[cfg.levels.length-1];

  return {
    socialScore,
    erScore:Math.round(erScore), reachScore:Math.round(reachScore), growthScore:Math.round(growthScore),
    er, reach, growth,
    views, reached, net, interactions, followers,
    erGrade:gradeOf(erScore), reachGrade:gradeOf(reachScore), growthGrade:gradeOf(growthScore),
    bandLabel:band.label, band,
    perfLevel:level.v, perfLabel:level.l, perfColor:level.c
  };
};

/**
 * Converte un valore letto dallo screenshot in numero intero.
 * Gestisce: 3.648 · 3,648 · 1.234.567 · +5 · -3 · 1,2K · 3,6 Mln
 */
const toNum = (raw) => {
  if(raw===null || raw===undefined) return 0;
  if(typeof raw==="number") return Number.isFinite(raw) ? Math.round(raw) : 0;
  let s = String(raw).trim().toLowerCase().replace(/\s+/g,"");
  if(!s) return 0;
  const sign = s.charAt(0)==="-" ? -1 : 1;
  s = s.replace(/^[+-]/,"");
  let mult = 1;
  if(/(mln|mio|m)$/.test(s)){ mult = 1e6; s = s.replace(/(mln|mio|m)$/,""); }
  else if(/(mila|k)$/.test(s)){ mult = 1e3; s = s.replace(/(mila|k)$/,""); }
  s = s.replace(/[^0-9.,]/g,"");
  if(!s) return 0;
  let value;
  if(mult>1){
    value = parseFloat(s.replace(",",".")) || 0;
  }else{
    const parts = s.split(/[.,]/);
    if(parts.length===1) value = parseFloat(parts[0]) || 0;
    else if(parts[parts.length-1].length===3) value = parseFloat(parts.join("")) || 0;
    else if(parts.length===2) value = parseFloat(parts[0]+"."+parts[1]) || 0;
    else value = parseFloat(parts.join("")) || 0;
  }
  return Math.round(sign * value * mult);
};

const readFileAsDataURL = file => new Promise((resolve,reject)=>{
  const r = new FileReader();
  r.onload  = e => resolve(e.target.result);
  r.onerror = () => reject(new Error("Impossibile leggere il file."));
  r.readAsDataURL(file);
});

/**
 * Ridimensiona e comprime lo screenshot prima del salvataggio.
 * Senza questo passaggio un'immagine da telefono supera il limite di 1 MiB
 * previsto da Firestore per singolo documento e il salvataggio viene rifiutato.
 */
const compressImage = dataUrl => new Promise((resolve,reject)=>{
  const img = new Image();
  img.onerror = () => reject(new Error("Immagine non valida."));
  img.onload  = () => {
    let w = img.naturalWidth, h = img.naturalHeight;
    if(!w || !h) return reject(new Error("Immagine non valida."));
    const scale = w > IMG_MAX_WIDTH ? IMG_MAX_WIDTH/w : 1;
    w = Math.round(w*scale); h = Math.round(h*scale);
    const draw = (cw,ch,q) => {
      const c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#0E0E0E"; ctx.fillRect(0,0,cw,ch);
      ctx.drawImage(img,0,0,cw,ch);
      return c.toDataURL("image/jpeg", q);
    };
    let q = 0.82, out = draw(w,h,q);
    while(out.length > MAX_STORED_BYTES && q > 0.4){ q -= 0.1; out = draw(w,h,q); }
    while(out.length > MAX_STORED_BYTES && w > 640){
      w = Math.round(w*0.85); h = Math.round(h*0.85); out = draw(w,h,q);
    }
    if(out.length > MAX_STORED_BYTES) return reject(new Error("Immagine troppo grande: riprova con uno screenshot più leggero."));
    resolve(out);
  };
  img.src = dataUrl;
});

function PublicNav(){

    setOpen(false);
    const el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  };

  return (
    <nav className="nav">
      {/* Desktop: logo centrato in alto, sezioni sotto */}
      <div className="hd">
        <div className="wrap">
          <div className="hd-logo"><Logo height={30}/></div>
          <div className="hd-nav">
            {NAV_SECTIONS.map(s=>(
              <button key={s.id} className="nav-link" onClick={()=>goTo(s.id)}>{s.l}</button>
            ))}
          </div>
        </div>
      </div>

      {/* Mobile: logo centrato + hamburger */}
      <div className="wrap">
        <div className="hm">
          <Logo height={24}/>
          <button className="hm-burger" aria-expanded={open} aria-controls="menu-mobile"
            aria-label={open?"Chiudi il menu":"Apri il menu"} onClick={()=>setOpen(o=>!o)}>

        </div>

      <div id="menu-mobile" className={"hm-panel"+(open?" open":"")}>

          <button key={s.id} className="hm-item" onClick={()=>goTo(s.id)}>{s.l}</button>
        ))}
      </div>
    </nav>
  );
}

function ApplicationForm({onBack, testMode=false}){
  const [step,setStep]           = useState(0);
  const [form,setForm]           = useState(EMPTY_FORM);
  const [errors,setErrors]       = useState({});
  const [ocrState,setOcrState]   = useState("idle"); // idle|reading|analyzing|done|failed
  const [ocrMsg,setOcrMsg]       = useState("");
  const [dragOver,setDragOver]   = useState(false);
  const [saving,setSaving]       = useState(false);
  const [done,setDone]           = useState(false);
  const [saveErr,setSaveErr]     = useState("");
  const topRef = useRef(null);

  const set = useCallback((k,v)=>{
    setForm(p=>({...p,[k]:v}));
    setErrors(p=> p[k] ? {...p, [k]:undefined} : p);
  },[]);

  const scrollTop = () => {
    if(topRef.current) topRef.current.scrollIntoView({behavior:"smooth",block:"start"});
    else window.scrollTo({top:0,behavior:"smooth"});
  };

  /* ---------- UPLOAD + LETTURA AUTOMATICA ---------- */
  const processFile = async (file) => {
    if(!file) return;
    if(!ALLOWED_IMAGE.includes(file.type)){
      setOcrState("failed"); setOcrMsg("Formato non supportato. Usa JPG, PNG o WEBP."); return;
    }
    if(file.size > MAX_UPLOAD_BYTES){
      setOcrState("failed"); setOcrMsg("Immagine troppo pesante (massimo 12 MB)."); return;
    }
    setOcrState("reading"); setOcrMsg("");
    let img;
    try{
      const raw = await readFileAsDataURL(file);
      img = await compressImage(raw);            // riduce il peso entro il limite di Firestore
      setForm(p=>({...p, screenshotData:img, screenshotName:file.name}));
      setErrors(p=>({...p, screenshotData:undefined}));
    }catch(err){
      console.error("Preparazione immagine non riuscita:", err);
      setOcrState("failed"); setOcrMsg(err.message || "Immagine non valida."); return;
    }
    setOcrState("analyzing");
    try{
      const d = await extractInsights(img);
      setForm(p=>({...p,
        views:           String(d.views),
        netFollowers:    String(d.netFollowers),
        interactions:    String(d.interactions),
        accountsReached: String(d.accountsReached)
      }));
      setOcrState("done"); setOcrMsg("");
    }catch(err){
      console.warn("Lettura automatica non riuscita:", err);
      setOcrState("failed"); setOcrMsg(err.message || "Lettura non riuscita");
    }
  };

  /* ---------- VALIDAZIONE ---------- */
  const validate = (s) => {
    const e = {};
    const req = (k,msg) => { if(!String(form[k]||"").trim()) e[k]=msg; };

    if(s===0){
      req("fullName","Inserisci nome e cognome");
      if(!String(form.age).trim()) e.age="Inserisci la tua età";
      else if(isNaN(form.age) || +form.age<14 || +form.age>99) e.age="Inserisci un'età valida";
      if(!String(form.email).trim()) e.email="Inserisci la tua email";
      else if(!isEmail(form.email)) e.email="Indirizzo email non valido";
      req("city","Inserisci la città");
      req("country","Inserisci il Paese");
      req("mainActivity","Indica la tua attività principale");
      req("category","Seleziona una categoria");
      if(!form.isAdult) e.isAdult="Devi confermare di essere maggiorenne";
    }
    if(s===1){
      req("instagram","Inserisci il tuo username Instagram");
      if(!String(form.followers).trim()) e.followers="Inserisci il numero di follower";
      else if(isNaN(form.followers) || +form.followers<0) e.followers="Valore non valido";
      if(!form.screenshotData) e.screenshotData="Carica lo screenshot richiesto";
      ["views","interactions","accountsReached"].forEach(k=>{
        if(String(form[k]).trim()==="") e[k]="Dato mancante";
        else if(isNaN(form[k]) || +form[k]<0) e[k]="Valore non valido";
      });
      // I follower netti possono essere negativi
      if(String(form.netFollowers).trim()==="") e.netFollowers="Dato mancante";
      else if(isNaN(form.netFollowers)) e.netFollowers="Valore non valido";
      if(form.tiktokFollowers && (isNaN(form.tiktokFollowers) || +form.tiktokFollowers<0)) e.tiktokFollowers="Valore non valido";
      ["contentUrl1","contentUrl2","contentUrl3"].forEach(k=>{
        if(form[k] && !isUrl(form[k])) e[k]="Inserisci un link valido (https://…)";
      });
    }
    if(s===2){
      req("threeWords","Campo obbligatorio");
      req("contentType","Campo obbligatorio");
      req("whatToTransmit","Campo obbligatorio");
      req("whyFollow","Campo obbligatorio");
      req("hasBrandCollabs","Seleziona un'opzione");
      if(form.hasBrandCollabs==="yes") req("brandCollabDetails","Descrivi le collaborazioni");
    }
    if(s===3){
      req("motivation","Campo obbligatorio");
      req("brandLike","Campo obbligatorio");
      req("contentIntegration","Campo obbligatorio");
      req("athleteImage","Campo obbligatorio");
      req("valueBeyondContent","Campo obbligatorio");
      req("howWouldTell","Campo obbligatorio");
    }
    if(s===4){
      req("scenarioBrandContent","Campo obbligatorio");
      req("buildWithoutEarnings","Seleziona un'opzione");
      req("badContentReaction","Campo obbligatorio");
      req("analysisElements","Campo obbligatorio");
      req("brandMeaning","Campo obbligatorio");
    }
    if(s===5){
      req("contentPerMonth","Seleziona un'opzione");
      req("hasRoutine","Seleziona un'opzione");
      req("followsGuidelines","Seleziona un'opzione");
      req("availEvents","Seleziona un'opzione");
      req("availShooting","Seleziona un'opzione");
      req("availUgc","Seleziona un'opzione");
      req("availRawFiles","Seleziona un'opzione");
    }
    if(s===6){
      if(!form.privacyConsent) e.privacyConsent="Devi accettare il trattamento dei dati per inviare la candidatura";
    }
    return e;
  };

  const next = () => {
    const e = validate(step);
    if(Object.keys(e).length){ setErrors(e); scrollTop(); return; }
    setErrors({}); setStep(s=>s+1); scrollTop();
  };
  const prev = () => { setErrors({}); step>0 ? setStep(s=>s-1) : onBack(); scrollTop(); };

  /* ---------- INVIO ---------- */
  const submit = async () => {
    if(saving) return;                                  // blocca il doppio invio
    const e = validate(6);
    if(Object.keys(e).length){ setErrors(e); scrollTop(); return; }

    setSaving(true); setSaveErr("");

    // 1 · preparazione documento — nessun campo undefined, nessun NaN
    const num = v => { const x = parseInt(v,10); return Number.isFinite(x) ? x : 0; };
    const now = new Date().toISOString();
    const id  = Date.now();

    let scoring = DEFAULT_SCORING;
    try{ scoring = normalizeScoring(await FB.getScoring()); }
    catch(err){ console.warn("Configurazione scoring non raggiungibile, uso i valori predefiniti:", err); }
    const s = computeSocial(form, scoring);

    const doc = {};
    Object.keys(EMPTY_FORM).forEach(k=>{
      const v = form[k];
      doc[k] = (v===undefined || v===null) ? (typeof EMPTY_FORM[k]==="boolean" ? false : "") : v;
    });
    doc.screenshotData  = form.screenshotData || "";
    doc.instagram       = "@"+cleanHandle(form.instagram);
    doc.tiktok          = form.tiktok ? "@"+cleanHandle(form.tiktok) : "";
    doc.age             = num(form.age);
    doc.followers       = num(form.followers);
    doc.tiktokFollowers = num(form.tiktokFollowers);
    doc.views           = num(form.views);
    doc.netFollowers    = num(form.netFollowers);
    doc.interactions    = num(form.interactions);
    doc.accountsReached = num(form.accountsReached);
    Object.assign(doc, {
      schemaVersion: 3,
      date: now, updatedAt: now,
      status: "new", notes: "", creatorCode: "", evaluation: {},
      socialScore: s.socialScore,
      perfLevel:   s.perfLevel,
      bandLabel:   s.bandLabel,
      erRate:      +s.er.toFixed(2),
      reachRate:   +s.reach.toFixed(2),
      growthRate:  +s.growth.toFixed(2)
    });

    // Salvaguardia: il documento Firestore non può superare 1 MiB
    if(doc.screenshotData.length > 900000){
      console.error("Screenshot oltre il limite consentito:", doc.screenshotData.length);
      setSaving(false);
      setSaveErr("Lo screenshot è troppo pesante per essere salvato. Ricaricalo: verrà compresso automaticamente.");
      return;
    }

    // 2 · salvataggio su Firestore — è questo il passaggio che determina l'esito
    try{
      await FB.saveApp({ id, ...doc });
    }catch(err){
      console.error("Salvataggio candidatura non riuscito:", err);
      setSaving(false);
      setSaveErr("Non siamo riusciti a salvare la candidatura"+(err && err.code ? " ("+err.code+")" : "")+". I dati inseriti non sono andati persi: riprova.");
      return;
    }

    // 3 · conferma immediata all'utente
    setSaving(false);
    setDone(true);
    window.scrollTo({top:0});

    // 4 · notifica Telegram separata: un errore qui non influisce sulla candidatura
    notifyTelegram(doc, s).catch(err => console.error("Notifica Telegram non inviata:", err));
  };

  /* ---------- SCHERMATA DI CONFERMA ---------- */
  if(done){
    return (
      <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
        <nav className="nav"><div className="wrap nav-in"><Logo height={24}/></div></nav>
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"48px 20px"}}>
          <div style={{maxWidth:600,textAlign:"center",animation:"fadeUp .6s ease both"}}>
            <div style={{width:64,height:64,border:"2px solid var(--ok)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 26px"}}>
              <span style={{color:"var(--ok)",fontSize:30,lineHeight:1}}>✓</span>
            </div>
            <h1 className="h-lg" style={{marginBottom:18}}>Candidatura ricevuta</h1>
            <p className="body" style={{marginBottom:16}}>
              Grazie per aver presentato la tua candidatura a {BRAND.program}.
            </p>
            <p className="body-sm" style={{marginBottom:32,maxWidth:520,marginLeft:"auto",marginRight:"auto"}}>
              Il nostro team analizzerà il tuo profilo, i dati e le risposte fornite.
              L'invio della candidatura non garantisce l'accesso al programma.
              Se riterremo che esistano le condizioni per costruire una collaborazione,
              ti contatteremo utilizzando l'indirizzo email indicato.
            </p>
            <a className="btn btn-ghost" href={BRAND.siteUrl}>Torna a EVORΛ</a>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- HELPER RIGHE ---------- */
  const err = k => errors[k];
  const inv = k => errors[k] ? "true" : "false";

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <nav className="nav">
        <div className="wrap nav-in">
          <Logo height={24}/>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {testMode && (
              <button className="btn btn-ghost btn-sm" style={{borderColor:"var(--warn)",color:"var(--warn)"}}
                onClick={()=>{ setForm({...TEST_FORM}); setStep(6); }}>Compila test</button>
            )}
            <button className="btn btn-ghost btn-sm" onClick={onBack}>Esci</button>
          </div>
        </div>
      </nav>

      <div className="wrap-narrow" style={{padding:"32px 20px 90px",flex:1}} ref={topRef}>
        <div className="eyebrow" style={{marginBottom:10}}>{BRAND.program}</div>
        <h1 className="h-md" style={{marginBottom:22}}>Candidatura al Partner Program</h1>

        {/* PROGRESS */}
        <div className="steps" role="progressbar" aria-valuenow={step+1} aria-valuemin="1" aria-valuemax={STEPS.length}>
          {STEPS.map((s,i)=><div key={s} className={"step-seg"+(i<=step?" done":"")}/>)}
        </div>
        <div className="step-meta">
          <span className="h-sm">{STEPS[step]}</span>
          <span className="label-xs">Step {step+1} di {STEPS.length}</span>
        </div>

        {/* ============ STEP 1 — PROFILO ============ */}
        {step===0 && (
          <section style={{animation:"fadeUp .3s ease both"}}>
            <Field label="Nome e cognome" required error={err("fullName")} htmlFor="f-name">
              <input id="f-name" value={form.fullName} aria-invalid={inv("fullName")}
                onChange={e=>set("fullName",e.target.value)} placeholder="Mario Rossi" autoComplete="name"/>
            </Field>
            <div className="g2-gap">
              <Field label="Età" required error={err("age")} htmlFor="f-age">
                <input id="f-age" type="number" inputMode="numeric" value={form.age} aria-invalid={inv("age")}
                  onChange={e=>set("age",e.target.value)} placeholder="26"/>
              </Field>
              <Field label="Email" required error={err("email")} hint="La useremo per ricontattarti." htmlFor="f-email">
                <input id="f-email" type="email" value={form.email} aria-invalid={inv("email")}
                  onChange={e=>set("email",e.target.value)} placeholder="nome@email.com" autoComplete="email"/>
              </Field>
            </div>
            <div className="g2-gap">
              <Field label="Città" required error={err("city")} htmlFor="f-city">
                <input id="f-city" value={form.city} aria-invalid={inv("city")}
                  onChange={e=>set("city",e.target.value)} placeholder="Milano"/>
              </Field>
              <Field label="Paese" required error={err("country")} htmlFor="f-country">
                <input id="f-country" value={form.country} aria-invalid={inv("country")}
                  onChange={e=>set("country",e.target.value)} placeholder="Italia"/>
              </Field>
            </div>
            <Field label="Attività principale" required error={err("mainActivity")}
              hint="Che cosa fai principalmente oggi." htmlFor="f-activity">
              <input id="f-activity" value={form.mainActivity} aria-invalid={inv("mainActivity")}
                onChange={e=>set("mainActivity",e.target.value)} placeholder="Es. Personal trainer e creator"/>
            </Field>
            <Field label="Categoria del profilo" required error={err("category")} htmlFor="f-cat">
              <select id="f-cat" value={form.category} aria-invalid={inv("category")} onChange={e=>set("category",e.target.value)}>
                <option value="">Seleziona…</option>
                {CATEGORIES.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}
              </select>
            </Field>
            <div className="field">
              <label className="check">
                <input type="checkbox" checked={form.isAdult} onChange={e=>set("isAdult",e.target.checked)}/>
                <span>Dichiaro di essere maggiorenne.</span>
              </label>
              {err("isAdult") && <span className="field-err" role="alert">{err("isAdult")}</span>}
            </div>
          </section>
        )}

        {/* ============ STEP 2 — SOCIAL ============ */}
        {step===1 && (
          <section style={{animation:"fadeUp .3s ease both"}}>
            <div className="eyebrow" style={{marginBottom:14}}>Instagram</div>
            <div className="g2-gap">
              <Field label="Username Instagram" required error={err("instagram")} htmlFor="f-ig">
                <input id="f-ig" value={form.instagram} aria-invalid={inv("instagram")}
                  onChange={e=>set("instagram",e.target.value)} placeholder="@username"/>
              </Field>
              <Field label="Follower" required error={err("followers")} htmlFor="f-fol">
                <input id="f-fol" type="number" inputMode="numeric" value={form.followers} aria-invalid={inv("followers")}
                  onChange={e=>set("followers",e.target.value)} placeholder="12500"/>
              </Field>
            </div>

            <Field label="Screenshot · Dashboard per professionisti → Visualizzazioni" required error={err("screenshotData")}
              hint="Un solo screenshot, con i quattro dati visibili. Le istruzioni sono qui sotto.">
              <div
                className={"drop"+(dragOver?" over":"")+(err("screenshotData")?" err":"")}
                onDragOver={e=>{e.preventDefault();setDragOver(true);}}
                onDragLeave={()=>setDragOver(false)}
                onDrop={e=>{e.preventDefault();setDragOver(false);processFile(e.dataTransfer.files[0]);}}>
                {form.screenshotData ? (
                  <img src={form.screenshotData} alt="Anteprima screenshot" style={{maxHeight:190,objectFit:"contain"}}/>
                ) : (
                  <>
                    <div className="h-sm">Trascina qui lo screenshot</div>
                    <div className="body-sm">I dati verranno compilati automaticamente</div>
                    <div className="label-xs" style={{color:"var(--t4)"}}>JPG · PNG · WEBP</div>
                  </>
                )}
              </div>
              <label className="file-btn" style={{marginTop:8}}>
                {form.screenshotData ? "Sostituisci immagine" : "Scegli dal dispositivo"}
                <input type="file" accept="image/*" className="sr-only"
                  onChange={e=>{ processFile(e.target.files[0]); e.target.value=""; }}/>
              </label>
            </Field>

            {/* Istruzioni per ottenere la schermata corretta */}
            <div style={{border:"1px solid var(--brd)",background:"var(--bg-2)",padding:"16px",marginTop:-8,marginBottom:22}}>
              <div className="h-sm" style={{marginBottom:10}}>Dove trovi questa schermata?</div>
              <p className="body-sm" style={{marginBottom:8}}>Apri Instagram e vai su:</p>
              <p style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:14,color:"var(--t1)",lineHeight:1.5,marginBottom:12}}>
                Profilo → Dashboard per professionisti → Visualizzazioni
              </p>
              <p className="body-sm" style={{marginBottom:10}}>
                Seleziona il periodo <strong style={{color:"var(--t1)"}}>30 giorni</strong> e fai uno screenshot della schermata
                in cui siano visibili:
              </p>
              <div style={{display:"flex",flexDirection:"column",gap:7}}>
                {["Visualizzazioni","Follower netti","Interazioni","Account raggiunti"].map(x=>(
                  <div key={x} style={{display:"flex",alignItems:"center",gap:10}}>
                    <span className="dot" style={{background:"var(--red)"}}/>
                    <span className="body-sm" style={{color:"var(--t2)"}}>{x}</span>
                  </div>
                ))}
              </div>
            </div>

            {ocrState==="reading"   && <Spinner label="Preparazione immagine in corso…"/>}
            {ocrState==="analyzing" && <Spinner label="Lettura automatica dei dati in corso…"/>}
            {ocrState==="done" && (
              <div className="status-box" style={{borderColor:"rgba(39,174,96,.45)"}}>
                <div className="dot" style={{background:"var(--ok)",marginTop:6}}/>
                <div className="body-sm" style={{color:"var(--t2)"}}>
                  <strong style={{color:"var(--ok)"}}>Dati rilevati.</strong> Controlla i quattro valori qui sotto e correggili se non corrispondono.
                </div>
              </div>
            )}
            {ocrState==="failed" && (
              <div className="status-box" style={{borderColor:"rgba(230,126,34,.45)"}}>
                <div className="dot" style={{background:"var(--warn)",marginTop:6}}/>
                <div className="body-sm" style={{color:"var(--t2)"}}>
                  <strong style={{color:"var(--warn)"}}>{ocrMsg||"Lettura non riuscita."}</strong>{" "}
                  Puoi caricare un'altra immagine oppure inserire i quattro dati manualmente.
                </div>
              </div>
            )}

            <div style={{marginTop:18,padding:"16px",border:"1px solid var(--brd)",background:"var(--bg-2)"}}>
              <div className="label-xs" style={{marginBottom:14}}>Dati degli ultimi 30 giorni</div>
              <div className="g2-gap">
                {[
                  ["views","Visualizzazioni","28400",""],
                  ["netFollowers","Follower netti","260","Può essere negativo"],
                  ["interactions","Interazioni","1240",""],
                  ["accountsReached","Account raggiunti","18400",""]
                ].map(([k,l,ph,hint])=>(
                  <Field key={k} label={l} required error={err(k)} hint={hint||undefined} htmlFor={"f-"+k}>
                    <input id={"f-"+k} type="number" inputMode={k==="netFollowers"?"text":"numeric"}
                      value={form[k]} aria-invalid={inv(k)}
                      onChange={e=>set(k,e.target.value)} placeholder={ph}/>
                  </Field>
                ))}
              </div>
            </div>

            <div className="eyebrow" style={{margin:"30px 0 14px",color:"var(--t3)"}}>TikTok · facoltativo</div>
            <div className="g2-gap">
              <Field label="Username TikTok" htmlFor="f-tt">
                <input id="f-tt" value={form.tiktok} onChange={e=>set("tiktok",e.target.value)} placeholder="@username"/>
              </Field>
              <Field label="Follower TikTok" error={err("tiktokFollowers")} htmlFor="f-ttf">
                <input id="f-ttf" type="number" inputMode="numeric" value={form.tiktokFollowers}
                  aria-invalid={inv("tiktokFollowers")} onChange={e=>set("tiktokFollowers",e.target.value)} placeholder="4800"/>
              </Field>
            </div>

            <div className="eyebrow" style={{margin:"30px 0 14px",color:"var(--t3)"}}>Contenuti rappresentativi · facoltativo</div>
            <p className="body-sm" style={{marginBottom:16}}>
              Condividi fino a tre contenuti che rappresentano meglio il tuo modo di comunicare.
            </p>
            {[1,2,3].map(n=>(
              <Field key={n} label={"Link contenuto "+n} error={err("contentUrl"+n)} htmlFor={"f-url"+n}>
                <input id={"f-url"+n} type="url" value={form["contentUrl"+n]} aria-invalid={inv("contentUrl"+n)}
                  onChange={e=>set("contentUrl"+n,e.target.value)} placeholder="https://www.instagram.com/reel/…"/>
              </Field>
            ))}
          </section>
        )}

        {/* ============ STEP 3 — POSIZIONAMENTO ============ */}
        {step===2 && (
          <section style={{animation:"fadeUp .3s ease both"}}>
            <Field label="Tre parole che ti descrivono come creator" required error={err("threeWords")} htmlFor="f-3w">
              <input id="f-3w" value={form.threeWords} maxLength={LIMITS.short} aria-invalid={inv("threeWords")}
                onChange={e=>set("threeWords",e.target.value)} placeholder="Es. concreto, costante, diretto"/>
            </Field>
            <Field label="Che tipo di contenuti pubblichi principalmente?" required error={err("contentType")} htmlFor="f-ct">
              <CharField id="f-ct" value={form.contentType} onChange={v=>set("contentType",v)} max={LIMITS.medium}
                invalid={!!err("contentType")} placeholder="Formati, temi, frequenza di pubblicazione…"/>
            </Field>
            <Field label="Cosa vuoi trasmettere al tuo pubblico?" required error={err("whatToTransmit")} htmlFor="f-wt">
              <CharField id="f-wt" value={form.whatToTransmit} onChange={v=>set("whatToTransmit",v)} max={LIMITS.medium}
                invalid={!!err("whatToTransmit")} placeholder="Il messaggio centrale del tuo profilo…"/>
            </Field>
            <Field label="Per quale motivo le persone scelgono di seguirti e continuano a farlo?" required
              error={err("whyFollow")} htmlFor="f-wf">
              <CharField id="f-wf" value={form.whyFollow} onChange={v=>set("whyFollow",v)} max={LIMITS.medium}
                invalid={!!err("whyFollow")} placeholder="Cosa ti distingue concretamente…"/>
            </Field>
            <Field label="Hai già collaborato con brand del settore fitness?" required error={err("hasBrandCollabs")}>
              <ChipGroup name="collab" value={form.hasBrandCollabs} onChange={v=>set("hasBrandCollabs",v)}
                options={[{v:"yes",l:"Sì"},{v:"no",l:"No, sarebbe la prima"}]}/>
            </Field>
            {form.hasBrandCollabs==="yes" && (
              <Field label="Con quali brand e in che forma?" required error={err("brandCollabDetails")} htmlFor="f-bcd">
                <CharField id="f-bcd" value={form.brandCollabDetails} onChange={v=>set("brandCollabDetails",v)} max={LIMITS.medium}
                  invalid={!!err("brandCollabDetails")} rows={3} placeholder="Brand, tipo di collaborazione, periodo…"/>
              </Field>
            )}
          </section>
        )}

        {/* ============ STEP 4 — COMPATIBILITÀ ============ */}
        {step===3 && (
          <section style={{animation:"fadeUp .3s ease both"}}>
            <Field label="Perché ritieni che possa esistere una collaborazione credibile tra il tuo percorso ed EVORΛ?"
              required error={err("motivation")} htmlFor="f-mot">
              <CharField id="f-mot" value={form.motivation} onChange={v=>set("motivation",v)} max={LIMITS.long} rows={5}
                invalid={!!err("motivation")} placeholder="Parlaci del punto di contatto tra il tuo percorso e il brand…"/>
            </Field>
            <Field label="Cosa apprezzi di EVORΛ?" required error={err("brandLike")} htmlFor="f-bl">
              <CharField id="f-bl" value={form.brandLike} onChange={v=>set("brandLike",v)} max={LIMITS.medium}
                invalid={!!err("brandLike")} placeholder="Prodotti, comunicazione, posizionamento…"/>
            </Field>
            <Field label="Come integreresti EVORΛ nei tuoi contenuti senza renderli una pubblicità forzata?"
              required error={err("contentIntegration")} htmlFor="f-ci">
              <CharField id="f-ci" value={form.contentIntegration} onChange={v=>set("contentIntegration",v)} max={LIMITS.long} rows={5}
                invalid={!!err("contentIntegration")} placeholder="Descrivi concretamente formati e contesti…"/>
            </Field>
            <Field label="Come racconteresti EVORΛ al tuo pubblico senza realizzare una pubblicità diretta?"
              required error={err("howWouldTell")} htmlFor="f-hwt">
              <CharField id="f-hwt" value={form.howWouldTell} onChange={v=>set("howWouldTell",v)} max={LIMITS.long} rows={4}
                invalid={!!err("howWouldTell")} placeholder="Il tono, l'angolo, la storia che useresti…"/>
            </Field>
            <Field label="Quale valore potresti portare a EVORΛ oltre alla semplice pubblicazione di contenuti?"
              required error={err("valueBeyondContent")} htmlFor="f-vbc">
              <CharField id="f-vbc" value={form.valueBeyondContent} onChange={v=>set("valueBeyondContent",v)} max={LIMITS.long} rows={4}
                invalid={!!err("valueBeyondContent")} placeholder="Competenze, rete, eventi, feedback prodotto…"/>
            </Field>
            <Field label="Quale immagine dovrebbe trasmettere una persona che rappresenta EVORΛ?"
              required error={err("athleteImage")} htmlFor="f-ai">
              <CharField id="f-ai" value={form.athleteImage} onChange={v=>set("athleteImage",v)} max={LIMITS.medium}
                invalid={!!err("athleteImage")} placeholder="Come la immagini…"/>
            </Field>
          </section>
        )}

        {/* ============ STEP 5 — MENTALITÀ ============ */}
        {step===4 && (
          <section style={{animation:"fadeUp .3s ease both"}}>
            <Field label="EVORΛ ti propone un contenuto molto coerente con il brand, ma probabilmente meno performante di una promozione diretta. Come lo gestiresti?"
              required error={err("scenarioBrandContent")} htmlFor="f-scb">
              <CharField id="f-scb" value={form.scenarioBrandContent} onChange={v=>set("scenarioBrandContent",v)} max={LIMITS.long} rows={5}
                invalid={!!err("scenarioBrandContent")} placeholder="Racconta come affronteresti concretamente la situazione…"/>
            </Field>
            <Field label="Saresti disponibile a iniziare con un periodo in cui entrambe le parti valutano la qualità della collaborazione, senza una garanzia di risultati economici immediati?"
              required error={err("buildWithoutEarnings")}>
              <ChipGroup name="trial" value={form.buildWithoutEarnings} onChange={v=>set("buildWithoutEarnings",v)}
                options={[
                  {v:"yes",l:"Sì"},
                  {v:"yes_conditions",l:"Sì, entro condizioni definite"},
                  {v:"depends",l:"Dipende dal progetto"},
                  {v:"paid_only",l:"Preferisco compenso garantito"}
                ]}/>
            </Field>
            <Field label="Come reagisci quando un contenuto non raggiunge i risultati attesi?"
              required error={err("badContentReaction")} htmlFor="f-bcr">
              <CharField id="f-bcr" value={form.badContentReaction} onChange={v=>set("badContentReaction",v)} max={LIMITS.medium}
                invalid={!!err("badContentReaction")} placeholder="Il tuo processo…"/>
            </Field>
            <Field label="Quali elementi analizzeresti prima di decidere cosa cambiare?"
              required error={err("analysisElements")} htmlFor="f-ae">
              <CharField id="f-ae" value={form.analysisElements} onChange={v=>set("analysisElements",v)} max={LIMITS.medium}
                invalid={!!err("analysisElements")} placeholder="Dati, formato, contesto, tempistiche…"/>
            </Field>
            <Field label="Che cosa significa per te rappresentare un brand?"
              required error={err("brandMeaning")} htmlFor="f-bm">
              <CharField id="f-bm" value={form.brandMeaning} onChange={v=>set("brandMeaning",v)} max={LIMITS.long} rows={4}
                invalid={!!err("brandMeaning")} placeholder="Con parole tue…"/>
            </Field>
          </section>
        )}

        {/* ============ STEP 6 — DISPONIBILITÀ ============ */}
        {step===5 && (
          <section style={{animation:"fadeUp .3s ease both"}}>
            <Field label="Quanti contenuti dedicati o integrati a EVORΛ riusciresti realisticamente a produrre ogni mese mantenendo il tuo standard qualitativo?"
              required error={err("contentPerMonth")}>
              <ChipGroup name="cpm" value={form.contentPerMonth} onChange={v=>set("contentPerMonth",v)}
                options={[
                  {v:"lt1",l:"Meno di 1 al mese"},
                  {v:"1-2",l:"1–2 al mese"},
                  {v:"3-4",l:"3–4 al mese"},
                  {v:"5+",l:"5 o più"},
                  {v:"depends",l:"Dipende dal progetto"}
                ]}/>
            </Field>
            <Field label="Hai una costanza di pubblicazione?" required error={err("hasRoutine")}>
              <ChipGroup name="routine" value={form.hasRoutine} onChange={v=>set("hasRoutine",v)}
                options={[{v:"yes",l:"Sì, costante"},{v:"building",l:"La sto costruendo"},{v:"no",l:"No, irregolare"}]}/>
            </Field>
            <Field label="Sei disponibile a seguire linee guida creative concordate?" required error={err("followsGuidelines")}>
              <ChipGroup name="guide" value={form.followsGuidelines} onChange={v=>set("followsGuidelines",v)}
                options={[{v:"yes",l:"Sì"},{v:"mostly",l:"Sì, con margine creativo"},{v:"no",l:"No"}]}/>
            </Field>

            <div className="divider" style={{margin:"26px 0 22px"}}/>

            <Field label="Disponibilità a partecipare a eventi" required error={err("availEvents")}>
              <ChipGroup name="ev" value={form.availEvents} onChange={v=>set("availEvents",v)} options={YESNO}/>
            </Field>
            <Field label="Disponibilità a partecipare a shooting" required error={err("availShooting")}>
              <ChipGroup name="sh" value={form.availShooting} onChange={v=>set("availShooting",v)} options={YESNO}/>
            </Field>
            <Field label="Disponibilità a creare contenuti utilizzabili anche sui canali EVORΛ" required error={err("availUgc")}>
              <ChipGroup name="ugc" value={form.availUgc} onChange={v=>set("availUgc",v)} options={YESNO}/>
            </Field>
            <Field label="Possibilità di fornire i file originali quando concordato" required error={err("availRawFiles")}>
              <ChipGroup name="raw" value={form.availRawFiles} onChange={v=>set("availRawFiles",v)} options={YESNO}/>
            </Field>

            <div className="divider" style={{margin:"26px 0 22px"}}/>
            <div className="label-xs" style={{marginBottom:16}}>Campi facoltativi</div>

            <Field label="Hai già acquistato prodotti EVORΛ?" htmlFor="f-bp">
              <input id="f-bp" value={form.boughtProducts} maxLength={LIMITS.short}
                onChange={e=>set("boughtProducts",e.target.value)} placeholder="Quali…"/>
            </Field>
            <Field label="C'è qualcosa che miglioreresti del brand?" htmlFor="f-imp">
              <CharField id="f-imp" value={form.improvements} onChange={v=>set("improvements",v)} max={LIMITS.medium} rows={3}
                placeholder="Feedback onesto…"/>
            </Field>
            <Field label="Vuoi aggiungere qualcosa?" htmlFor="f-ex">
              <CharField id="f-ex" value={form.extra} onChange={v=>set("extra",v)} max={LIMITS.medium} rows={3}
                placeholder="Nota finale…"/>
            </Field>
          </section>
        )}

        {/* ============ STEP 7 — RIEPILOGO ============ */}
        {step===6 && (
          <section style={{animation:"fadeUp .3s ease both"}}>
            <p className="body-sm" style={{marginBottom:20}}>
              Controlla i dati principali prima di inviare. Puoi tornare indietro per modificarli.
            </p>

            <div className="panel" style={{padding:18,marginBottom:10}}>
              <div className="label-xs" style={{marginBottom:12}}>Profilo</div>
              <div className="g2">
                {[["Nome",form.fullName],["Email",form.email],["Città",form.city+", "+form.country],["Categoria",catLabel(form.category)]].map(([k,v])=>(
                  <div className="kv" key={k}><div className="kv-k">{k}</div><div className="kv-v">{v||"—"}</div></div>
                ))}
              </div>
            </div>

            <div className="panel" style={{padding:18,marginBottom:10}}>
              <div className="label-xs" style={{marginBottom:12}}>Social e Insights</div>
              <div className="g3-keep">
                {[["Instagram","@"+cleanHandle(form.instagram)],["Follower",fmtInt(form.followers)],["TikTok",form.tiktok?("@"+cleanHandle(form.tiktok)):"—"]].map(([k,v])=>(
                  <div className="kv" key={k}><div className="kv-k">{k}</div><div className="kv-v">{v}</div></div>
                ))}
              </div>
              <div className="g2" style={{marginTop:2}}>
                {[["Visualizzazioni",fmtInt(form.views)],["Account raggiunti",fmtInt(form.accountsReached)],["Interazioni",fmtInt(form.interactions)],["Follower netti",(+form.netFollowers>0?"+":"")+fmtInt(form.netFollowers)]].map(([k,v])=>(
                  <div className="kv" key={k}><div className="kv-k">{k}</div><div className="kv-v">{v}</div></div>
                ))}
              </div>
              {form.screenshotData && (
                <div style={{marginTop:12,display:"flex",alignItems:"center",gap:10}}>
                  <div className="dot" style={{background:"var(--ok)"}}/>
                  <span className="body-sm">Screenshot allegato{form.screenshotName ? " · "+form.screenshotName : ""}</span>
                </div>
              )}
            </div>

            <div className="field" style={{marginTop:22}}>
              <label className="check" style={{borderColor: err("privacyConsent") ? "#B03A3A" : "var(--brd)"}}>
                <input type="checkbox" checked={form.privacyConsent} onChange={e=>set("privacyConsent",e.target.checked)}/>
                <span>
                  Acconsento al trattamento dei dati personali forniti ai fini della valutazione della candidatura
                  al programma {BRAND.program}. <span className="field-req">*</span>
                </span>
              </label>
              {err("privacyConsent") && <span className="field-err" role="alert">{err("privacyConsent")}</span>}
            </div>

            {saveErr && (
              <div className="status-box" style={{borderColor:"#B03A3A",marginTop:12}}>
                <div className="dot" style={{background:"var(--bad)",marginTop:6}}/>
                <div className="body-sm" style={{color:"var(--t2)"}}>{saveErr}</div>
              </div>
            )}
          </section>
        )}

        {/* ============ NAVIGAZIONE ============ */}
        <div style={{display:"flex",gap:10,marginTop:34,paddingTop:22,borderTop:"1px solid var(--brd)"}}>
          <button className="btn btn-ghost" style={{flex:1}} onClick={prev} disabled={saving}>
            {step===0 ? "Annulla" : "Indietro"}
          </button>
          {step < STEPS.length-1 ? (
            <button className="btn btn-primary" style={{flex:2}} onClick={next}
              disabled={ocrState==="reading"||ocrState==="analyzing"}>
              {ocrState==="analyzing" ? "Lettura in corso…" : "Avanti"}
            </button>
          ) : (
            <button className="btn btn-primary" style={{flex:2}} onClick={submit} disabled={saving}>
              {saving ? "Invio in corso…" : "Invia la candidatura"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================================

   ========================================================================== */
const exportCSV = (rows, cfg) => {
  const head = [
    "Data","Ultima modifica","Stato","Nome","Età","Email","Città","Paese","Categoria","Attività",
    "Instagram","Follower IG","TikTok","Follower TikTok",
    "Visualizzazioni","Account raggiunti","Interazioni","Follower netti",
    "ER %","Reach %","Growth %","Social Performance Score","Livello performance","Fascia follower",
    "Valutazione interna","Brand Fit","Qualità contenuti","Credibilità","Affidabilità","Potenziale","Valore strategico",
    "Codice creator","Note interne",
    "Contenuto 1","Contenuto 2","Contenuto 3",
    "Tre parole","Tipo contenuti","Cosa trasmette","Perché lo seguono",
    "Collaborazioni","Dettagli collaborazioni",
    "Perché collaborazione credibile","Cosa apprezza","Come integrerebbe","Come racconterebbe",
    "Valore oltre i contenuti","Immagine del rappresentante",
    "Scenario contenuto brand","Periodo di prova","Reazione a contenuto sotto attese","Elementi analizzati","Significato rappresentare",
    "Contenuti/mese","Costanza","Linee guida","Eventi","Shooting","UGC per canali EVORΛ","File originali",
    "Prodotti acquistati","Miglioramenti","Nota finale","Consenso privacy"
  ];
  const line = a => {
    const s = computeSocial(a, cfg);
    const ev = a.evaluation || {};
    const vals = EVAL_CRITERIA.map(c=>ev[c.k]).filter(v=>typeof v==="number" && v>0);
    const avg = vals.length ? (vals.reduce((x,y)=>x+y,0)/vals.length).toFixed(2) : "";
    return [
      fmtDate(a.date), a.updatedAt?fmtDateTime(a.updatedAt):"", statusMeta(a.status).l,
      a.fullName, a.age, a.email, a.city, a.country||"", catLabel(a.category), a.mainActivity||"",
      a.instagram, a.followers, a.tiktok||"", a.tiktokFollowers||"",
      s.views, s.reached, s.interactions, s.net,
      s.er.toFixed(2), s.reach.toFixed(1), s.growth.toFixed(2), s.socialScore, s.perfLabel, s.bandLabel,
      avg, ev.brandFit||"", ev.contentQuality||"", ev.credibility||"", ev.reliability||"", ev.potential||"", ev.strategicValue||"",
      a.creatorCode||"", a.notes||"",
      a.contentUrl1||"", a.contentUrl2||"", a.contentUrl3||"",
      a.threeWords||"", a.contentType||"", a.whatToTransmit||"", a.whyFollow||"",
      a.hasBrandCollabs||"", a.brandCollabDetails||"",
      a.motivation||"", a.brandLike||"", a.contentIntegration||"", a.howWouldTell||"",
      a.valueBeyondContent||"", a.athleteImage||"",
      a.scenarioBrandContent||"", a.buildWithoutEarnings||"", a.badContentReaction||"", a.analysisElements||"", a.brandMeaning||"",
      a.contentPerMonth||"", a.hasRoutine||"", a.followsGuidelines||"",
      a.availEvents||"", a.availShooting||"", a.availUgc||"", a.availRawFiles||"",
      a.boughtProducts||"", a.improvements||"", a.extra||"",
      a.privacyConsent?"Sì":"No"
    ];
  };
  const esc = v => '"'+String(v===undefined||v===null?"":v).replace(/"/g,'""').replace(/\r?\n/g," ")+'"';
  const csv = "\uFEFF" + [head, ...rows.map(line)].map(r=>r.map(esc).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  const a = document.createElement("a");
  a.href=url; a.download="evora_collective_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
  URL.revokeObjectURL(url);
};
