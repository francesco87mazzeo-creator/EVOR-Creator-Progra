<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>EVORΛ ATHLETES v5 — Application 2025</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap');
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --red: #b22222;
      --red2: #d42828;
      --gold: #c0a060;
      --black: #080808;
      --deep: #0d0d0d;
      --surf: #111111;
      --brd: #2a2a2a;
      --fd: 'Bebas Neue', sans-serif;
      --fu: 'Barlow Condensed', sans-serif;
      --fb: 'Barlow', sans-serif;
      /* Text colors — all readable */
      --t1: #ffffff;   /* headings */
      --t2: #cccccc;   /* body text */
      --t3: #999999;   /* labels, hints */
      --t4: #666666;   /* very muted */
      --nav-h: 96px;
    }
    html, body { background:var(--black); color:var(--t2); font-family:var(--fb); overflow-x:hidden; width:100%; }
    ::selection { background:var(--red); color:#fff; }
    ::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-thumb { background:var(--red); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    /* ── NAV ── */
    .nav {
      position: fixed; top:0; left:0; right:0; z-index:1000;
      background: rgba(8,8,8,0.98);
      border-bottom: 1px solid var(--brd);
      backdrop-filter: blur(10px);
    }
    .nav-row1 {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 52px;
    }
    .nav-row2 {
      display: flex; align-items: center; justify-content: center;
      gap: 24px; padding: 6px 20px 10px;
      border-top: 1px solid #1a1a1a;
      flex-wrap: wrap;
    }
    .nav-link {
      color: var(--t3); font-size: 11px; font-family: var(--fu);
      letter-spacing: 0.2em; text-decoration: none; text-transform: uppercase;
      transition: color .2s;
    }
    .nav-link:hover { color: var(--t1); }
    .admin-btn {
      background: var(--red); border: none; color: white;
      padding: 6px 18px; font-size: 10px; font-family: var(--fu);
      letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
      transition: background .2s;
    }
    .admin-btn:hover { background: var(--red2); }

    /* ── PAGE ── */
    .page { padding-top: var(--nav-h); }
    .form-page { padding-top: var(--nav-h); }

    /* ── HERO ── */
    .hero {
      min-height: calc(100vh - var(--nav-h));
      display: flex; align-items: center;
      padding: 48px 20px 60px;
      background: radial-gradient(ellipse at 10% 50%, #200404 0%, var(--black) 60%);
      position: relative; overflow: hidden;
    }
    .hero-inner { width: 100%; max-width: 860px; animation: fadeUp 1s ease both; }
    .hero-tag {
      font-family: var(--fu); font-size: 11px; letter-spacing: 0.5em;
      color: var(--red); text-transform: uppercase; margin-bottom: 24px;
    }
    .hero-title {
      font-family: var(--fd);
      font-size: clamp(64px, 14vw, 140px);
      line-height: 0.88; color: var(--t1);
    }
    .hero-sub {
      margin-top: 28px; border-left: 2px solid var(--red);
      padding-left: 18px; max-width: 480px;
    }
    .hero-sub p {
      font-family: var(--fu); font-size: 16px;
      line-height: 1.85; color: var(--t2);
    }
    .hero-cta { margin-top: 40px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .hero-stats {
      margin-top: 52px; padding-top: 24px;
      border-top: 1px solid #1e1e1e;
      display: flex; gap: 36px; flex-wrap: wrap;
    }

    /* ── SECTIONS ── */
    .section { padding: 80px 20px; width: 100%; }
    .inner { max-width: 1080px; margin: 0 auto; }

    /* ── TYPOGRAPHY ── */
    .sec-tag {
      font-family: var(--fu); font-size: 10px; letter-spacing: 0.4em;
      color: var(--red); text-transform: uppercase;
      background: #b2222220; border: 1px solid #b2222240;
      padding: 3px 12px; display: inline-block;
    }
    .sec-title {
      font-family: var(--fd); line-height: 0.94; color: var(--t1);
      margin-top: 16px;
    }
    .redline { width: 40px; height: 2px; background: var(--red); margin: 14px 0; }
    .body-text { font-family: var(--fb); font-size: 15px; line-height: 1.9; color: var(--t2); }
    .muted { color: var(--t3); }

    /* ── GRIDS ── */
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
    .g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; }
    .g22 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    .g33 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    /* ── CARDS ── */
    .card { background: var(--surf); border: 1px solid var(--brd); padding: 24px; transition: border-color .3s; }
    .card:hover { border-color: var(--red); }
    .card-title { font-family: var(--fd); font-size: 15px; color: var(--red); margin-bottom: 8px; letter-spacing: 0.08em; }
    .card-body { font-family: var(--fb); font-size: 13px; color: var(--t3); line-height: 1.75; }

    /* ── BUTTONS ── */
    .btn-red {
      background: var(--red); border: none; color: white;
      padding: 15px 36px; font-size: 12px; font-family: var(--fu);
      letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700;
      cursor: pointer; transition: background .2s;
    }
    .btn-red:hover { background: var(--red2); }
    .btn-ghost {
      background: transparent; border: 1px solid #333; color: var(--t3);
      padding: 15px 36px; font-size: 12px; font-family: var(--fu);
      letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700;
      cursor: pointer; transition: all .2s;
    }
    .btn-ghost:hover { border-color: #666; color: var(--t1); }

    /* ── FORM ── */
    .form-inner { max-width: 700px; margin: 0 auto; padding: 32px 20px 80px; }
    .field-label {
      font-family: var(--fu); font-size: 11px; letter-spacing: 0.22em;
      color: var(--t3); text-transform: uppercase; margin-bottom: 7px; display: block;
    }
    .field-hint { font-family: var(--fu); font-size: 10px; color: var(--t4); margin-top: 5px; letter-spacing: 0.1em; }
    input, textarea, select {
      background: #0d0d0d; border: 1px solid #333; color: var(--t1);
      padding: 13px 15px; font-size: 14px; font-family: var(--fb);
      outline: none; transition: border-color .2s; width: 100%;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--red); }
    input::placeholder, textarea::placeholder { color: var(--t4); }
    select { appearance: none; cursor: pointer; } select option { background: #111; }
    textarea { resize: vertical; }
    button { cursor: pointer; font-family: var(--fu); }

    .steps-bar { display: flex; gap: 3px; margin-bottom: 32px; }
    .step-item { flex: 1; }
    .step-line { height: 2px; margin-bottom: 5px; transition: background .3s; }
    .step-lbl { font-family: var(--fu); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.3; }

    .upload-area {
      border: 1px dashed #333; padding: 28px 20px; text-align: center;
      background: #090909; cursor: pointer; transition: border-color .2s;
    }
    .upload-area:hover { border-color: var(--red); }

    .choice-btn {
      padding: 10px 16px; font-family: var(--fu); font-size: 11px;
      letter-spacing: 0.12em; text-transform: uppercase;
      border: 1px solid #333; transition: all .2s;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .g2, .g3 { grid-template-columns: 1fr; gap: 16px; }
      .g33 { grid-template-columns: 1fr 1fr; gap: 8px; }
      .section { padding: 56px 16px; }
      .hero { padding: 36px 16px 48px; }
      .form-inner { padding: 24px 16px 60px; }
      .nav-row2 { gap: 16px; }
    }
    @media (max-width: 400px) {
      .g22 { grid-template-columns: 1fr; }
      .g33 { grid-template-columns: 1fr; }
      .nav-link { font-size: 10px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── SCORING ──────────────────────────────────────────────────────────────────
const scoreCandidate = (data) => {
  let score = 0; const reasons = [];
  const followers = parseInt(data.followers)||0;
  const views = parseInt(data.views)||0;
  const interactions = parseInt(data.interactions)||0;
  const newFollowers = parseInt(data.newFollowers)||0;

  if(followers>=100000){score+=20;reasons.push("100K+ follower");}
  else if(followers>=50000){score+=17;reasons.push("50K+ follower");}
  else if(followers>=30000){score+=14;reasons.push("30K+ follower");}
  else if(followers>=10000){score+=10;reasons.push("10K+ follower");}
  else if(followers>=5000){score+=6;reasons.push("5K+ follower");}
  else if(followers>=1000){score+=3;reasons.push("1K+ follower");}

  const rr = followers>0 ? views/followers : 0;
  if(followers<10000){
    if(rr>=1.5){score+=15;reasons.push("Reach virale");}
    else if(rr>=1){score+=12;reasons.push("Reach ottima");}
    else if(rr>=0.5){score+=8;reasons.push("Reach buona");}
    else if(rr>=0.2) score+=4;
  } else if(followers<50000){
    if(rr>=1.2){score+=15;reasons.push("Reach virale");}
    else if(rr>=0.8){score+=12;reasons.push("Reach ottima");}
    else if(rr>=0.4){score+=8;reasons.push("Reach buona");}
    else if(rr>=0.2) score+=4;
  } else {
    if(rr>=0.8){score+=15;reasons.push("Reach eccellente");}
    else if(rr>=0.5){score+=12;reasons.push("Reach ottima");}
    else if(rr>=0.3){score+=8;reasons.push("Reach buona");}
    else if(rr>=0.1) score+=4;
  }

  const er = views>0 ? (interactions/views)*100 : 0;
  if(er>=5){score+=25;reasons.push("ER eccezionale");}
  else if(er>=3){score+=20;reasons.push("ER ottimo");}
  else if(er>=2){score+=15;reasons.push("ER buono");}
  else if(er>=1){score+=10;reasons.push("ER nella media");}
  else if(er>=0.5) score+=5;

  const gr = followers>0 ? (newFollowers/followers)*100 : 0;
  if(followers<10000){
    if(gr>=2){score+=15;reasons.push("Crescita forte");}
    else if(gr>=1){score+=10;reasons.push("Crescita buona");}
    else if(gr>=0.5) score+=6;
  } else if(followers<50000){
    if(gr>=1){score+=15;reasons.push("Crescita forte");}
    else if(gr>=0.5){score+=10;reasons.push("Crescita buona");}
    else if(gr>=0.2) score+=6;
  } else {
    if(gr>=0.5){score+=15;reasons.push("Crescita forte");}
    else if(gr>=0.2){score+=10;reasons.push("Crescita buona");}
    else if(gr>=0.1) score+=6;
  }

  const kf = [data.motivation, data.contentIntegration, data.brandMeaning, data.qualityVsSell];
  let qs = 0;
  kf.forEach(f => { const l=(f||"").length; if(l>300)qs+=5; else if(l>150)qs+=3; else if(l>50)qs+=1; });
  const kws = ["identità","rappresentare","costruire","disciplina","autenticità","valori","reale","genuino","evoluz"];
  const at = kf.join(" ").toLowerCase(); let kw=0;
  kws.forEach(k => { if(at.includes(k)) kw++; });
  qs = Math.min(qs+Math.min(kw,5), 25);
  if(qs>=20) reasons.push("Risposte eccellenti");
  else if(qs>=12) reasons.push("Risposte solide");
  score += qs;
  if(data.hasBrandCollabs==="yes"){score+=5;reasons.push("Exp. brand collabs");}

  const fs = Math.min(score,100);
  let tier, tierColor, tierLabel;
  if(fs>=75){tier="ELITE";tierColor="#b22222";tierLabel="Priorità Assoluta";}
  else if(fs>=55){tier="PRO";tierColor="#c0a060";tierLabel="Alta Priorità";}
  else if(fs>=35){tier="RISING";tierColor="#6a9a7a";tierLabel="Da Monitorare";}
  else{tier="PENDING";tierColor="#666";tierLabel="In Attesa";}
  return{score:fs,tier,tierColor,tierLabel,reasons,erReach:er.toFixed(2),reachRate:(rr*100).toFixed(1),growthRate:gr.toFixed(2)};
};

const getApps = () => { try{ return JSON.parse(localStorage.getItem("evora_athletes")||"[]"); }catch{ return[]; } };
const saveApps = a => localStorage.setItem("evora_athletes", JSON.stringify(a));

// ── SHARED COMPONENTS ────────────────────────────────────────────────────────
function Logo({size=24}){
  return(
    <div style={{display:"flex",alignItems:"baseline",gap:7,flexShrink:0}}>
      <span style={{fontFamily:"var(--fd)",fontSize:size,letterSpacing:"0.12em",color:"#fff",lineHeight:1}}>EVORΛ</span>
      <span style={{fontFamily:"var(--fu)",fontSize:size*.44,letterSpacing:"0.35em",color:"var(--red)",textTransform:"uppercase"}}>ATHLETES</span>
    </div>
  );
}

function Tag({children, color="var(--red)"}){
  return <span style={{background:`${color}25`,border:`1px solid ${color}55`,color,padding:"3px 10px",fontSize:10,fontFamily:"var(--fu)",letterSpacing:"0.2em",textTransform:"uppercase",display:"inline-block"}}>{children}</span>;
}

function Nav({onAdmin, links=true, onBack}){
  return(
    <nav className="nav">
      <div className="nav-row1">
        <Logo size={20}/>
        {!links && onBack && (
          <button onClick={onBack} style={{background:"transparent",border:"1px solid #333",color:"#aaa",padding:"6px 16px",fontSize:10,fontFamily:"var(--fu)",letterSpacing:"0.2em",textTransform:"uppercase",cursor:"pointer"}}>← INDIETRO</button>
        )}
      </div>
      <div className="nav-row2">
        {links && <>
          <a href="#filosofia" className="nav-link">Filosofia</a>
          <a href="#livelli" className="nav-link">Livelli</a>
          <a href="#requisiti" className="nav-link">Requisiti</a>
          <a href="#apply" className="nav-link">Apply</a>
        </>}
        <button className="admin-btn" onClick={onAdmin}>ADMIN</button>
      </div>
    </nav>
  );
}

function Field({label, required, hint, children}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:7}}>
      <label className="field-label">{label}{required&&<span style={{color:"var(--red)"}}> *</span>}</label>
      {children}
      {hint && <span className="field-hint">{hint}</span>}
    </div>
  );
}

function Choice({label, value, selected, onClick}){
  return(
    <button className="choice-btn" onClick={()=>onClick(value)}
      style={{background:selected?"var(--red)":"#0d0d0d",borderColor:selected?"var(--red)":"#333",color:selected?"#fff":"#bbb"}}>
      {label}
    </button>
  );
}

// ── LANDING ──────────────────────────────────────────────────────────────────
function Landing({onApply, onAdmin}){
  return(
    <div className="page">
      <Nav onAdmin={onAdmin} links={true}/>

      {/* HERO */}
      <section className="hero">
        <div className="hero-inner">
          <div className="hero-tag">▸ Application · 2025 · Programma Selettivo</div>
          <h1 className="hero-title">
            EVORΛ<br/>
            <span style={{color:"var(--red)"}}>NON È</span><br/>
            PER TUTTI.
          </h1>
          <div className="hero-sub">
            <p>Cerchiamo persone che vogliono <strong style={{color:"#fff"}}>rappresentare un'identità</strong>, non promuovere un prodotto.<br/>Se entri, entri per costruire qualcosa.</p>
          </div>
          <div className="hero-cta">
            <button className="btn-red" onClick={onApply} style={{padding:"17px 44px",fontSize:13,letterSpacing:"0.35em"}}>CANDIDATI ORA</button>
            <span style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t4)",letterSpacing:"0.22em"}}>SELEZIONE CONTINUA · POSTI LIMITATI</span>
          </div>
          <div className="hero-stats">
            {[["<5%","Tasso di accettazione"],["3","Livelli di partnership"],["0 DM","Solo candidature formali"]].map(([n,l])=>(
              <div key={n}>
                <div style={{fontFamily:"var(--fd)",fontSize:38,color:"var(--red)",lineHeight:1}}>{n}</div>
                <div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--t3)",letterSpacing:"0.15em",textTransform:"uppercase",marginTop:4}}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* FILOSOFIA */}
      <section id="filosofia" className="section">
        <div className="inner">
          <div className="g2">
            <div>
              <span className="sec-tag">Filosofia del Programma</span>
              <h2 className="sec-title" style={{fontSize:"clamp(34px,5vw,60px)"}}>NON VENDIAMO.<br/><span style={{color:"#333"}}>RAPPRESENTIAMO.</span></h2>
              <div className="redline"/>
              <p className="body-text" style={{marginBottom:12}}>EVORΛ è nata dalla disciplina, non dal marketing. Il nostro programma non è un canale pubblicitario — è una rete di persone che condividono una visione.</p>
              <p className="body-text">Cerchiamo atleti e creator che amplificano un messaggio genuino: evoluzione continua, performance reale, mentalità costruita ogni giorno.</p>
            </div>
            <div className="g22">
              {[["DISCIPLINA","Non si tratta di quanto sei grande oggi, ma di quanto lavori ogni giorno."],["AUTENTICITÀ","Il pubblico sente quando parli di un prodotto che non usi davvero."],["CRESCITA","Cresciamo insieme. Il tuo successo potenzia il brand."],["STANDARD","Lavoriamo con chi tiene alta la qualità. Sempre."]].map(([t,d])=>(
                <div key={t} className="card">
                  <div className="card-title">{t}</div>
                  <div className="card-body">{d}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* LIVELLI */}
      <section id="livelli" className="section" style={{background:"var(--deep)"}}>
        <div className="inner">
          <div style={{textAlign:"center",marginBottom:48}}>
            <span className="sec-tag">Struttura del Programma</span>
            <h2 className="sec-title" style={{fontSize:"clamp(30px,5vw,52px)"}}>TRE LIVELLI. UN SISTEMA.</h2>
          </div>
          <div className="g3">
            {[
              {tier:"AFFILIATO",n:"01",color:"#888",desc:"Primo ingresso nel network EVORΛ. Codici sconto personalizzati e commissioni sulle vendite.",perks:["Codice creator dedicato","Commissione 10%","Kit digitale EVORΛ","Accesso contenuti B2B","Newsletter interna"]},
              {tier:"AMBASSADOR",n:"02",color:"var(--gold)",desc:"Profili selezionati con audience consolidata e alta coerenza con i valori EVORΛ.",perks:["Tutto da Affiliato +","Prodotti mensili","Commissione 15%","Co-creazione contenuti","Early access drop"]},
              {tier:"ELITE",n:"03",color:"var(--red)",desc:"Il livello più alto. Facce del brand EVORΛ. Collaborazione strategica e contratti formali.",perks:["Tutto da Ambassador +","Contratto formale","Campagne dedicate","Revenue sharing","Advisory role"]}
            ].map((l,i)=>(
              <div key={l.tier} style={{background:i===1?"#0e0e0e":"var(--surf)",border:`1px solid ${i===1?l.color+"55":"var(--brd)"}`,padding:28,position:"relative",overflow:"hidden"}}>
                {i===1&&<div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(to right,transparent,var(--gold),transparent)`}}/>}
                <div style={{fontFamily:"var(--fd)",fontSize:56,color:l.color+"15",position:"absolute",right:8,top:-2,lineHeight:1,pointerEvents:"none"}}>{l.n}</div>
                <Tag color={l.color}>{l.tier}</Tag>
                <p style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",lineHeight:1.8,margin:"14px 0 18px"}}>{l.desc}</p>
                <div style={{borderTop:"1px solid var(--brd)",paddingTop:14}}>
                  {l.perks.map(p=>(
                    <div key={p} style={{display:"flex",alignItems:"center",gap:9,marginBottom:7}}>
                      <div style={{width:3,height:3,background:l.color,flexShrink:0,borderRadius:"50%"}}/>
                      <span style={{fontFamily:"var(--fu)",fontSize:12,color:"var(--t2)"}}>{p}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* REQUISITI */}
      <section id="requisiti" className="section">
        <div className="inner">
          <div className="g2">
            <div>
              <span className="sec-tag">Criteri di Selezione</span>
              <h2 className="sec-title" style={{fontSize:"clamp(30px,4vw,50px)"}}>COSA<br/>VALUTIAMO.</h2>
              <div className="redline"/>
              <p className="body-text">Ogni candidatura viene analizzata manualmente. Non esistono criteri automatici che garantiscono l'accesso. Conta la combinazione di numeri, identità e potenziale reale.</p>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              {[["Audience reale","Non contano i follower comprati. Contiamo chi ti ascolta davvero — reach, engagement, qualità dei commenti."],["Coerenza verticale","Il tuo contenuto deve essere radicato in fitness, performance, lifestyle di qualità."],["Qualità produzione","Non serve uno studio. Serve uno standard. Luce, montaggio, identità visiva."],["Identità personale","Chi sei fuori dal telefono è più importante di quante stories fai."],["Mentalità costruttiva","Cerchiamo chi pensa in termini di brand building, non di guadagno immediato."]].map(([t,d])=>(
                <div key={t} style={{padding:"16px 20px",border:"1px solid var(--brd)",display:"flex",gap:14,transition:"all .3s"}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor="#444";e.currentTarget.style.background="#0c0c0c";}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--brd)";e.currentTarget.style.background="transparent";}}>
                  <div style={{width:2,background:"var(--red)",flexShrink:0,alignSelf:"stretch"}}/>

          <div key={l} style={{padding:"12px 20px",borderRight:"1px solid var(--brd)",textAlign:"center",minWidth:70,flexShrink:0}}>
            <div style={{fontFamily:"var(--fd)",fontSize:22,color:c,lineHeight:1}}>{v}</div>
            <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.15em",marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {!showDetail && (
          <div style={{width:"100%",maxWidth:360,borderRight:"1px solid var(--brd)",display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0}}>
            <div style={{padding:"12px 14px",borderBottom:"1px solid var(--brd)"}}>
              <input placeholder="Cerca nome, @handle..." style={{marginBottom:8,fontSize:12}} value={search} onChange={e=>setSearch(e.target.value)}/>
              <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                {["ALL","NEW","ELITE","PRO","RISING","PENDING"].map(f=>(
                  <button key={f} onClick={()=>setFilter(f)} style={{padding:"4px 8px",fontFamily:"var(--fu)",fontSize:8,letterSpacing:"0.08em",textTransform:"uppercase",cursor:"pointer",background:filter===f?"var(--red)":"#0d0d0d",border:`1px solid ${filter===f?"var(--red)":"#2a2a2a"}`,color:filter===f?"#fff":"var(--t3)",transition:"all .2s"}}>{f}</button>
                ))}
              </div>
            </div>
            <div style={{overflow:"auto",flex:1}}>
              {list.length===0 && <div style={{padding:24,textAlign:"center",fontFamily:"var(--fu)",fontSize:10,color:"var(--t4)",letterSpacing:"0.2em"}}>NESSUNA CANDIDATURA</div>}
              {list.map(a=>(
                <div key={a.id} onClick={()=>selectApp(a)} style={{padding:"12px 16px",borderBottom:"1px solid var(--brd)",cursor:"pointer",background:sel?.id===a.id?"#0e0e0e":"transparent",borderLeft:`2px solid ${sel?.id===a.id?"var(--red)":"transparent"}`,transition:"all .15s"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                    <div><div style={{fontFamily:"var(--fu)",fontSize:13,color:"#fff"}}>{a.fullName||"—"}</div><div style={{fontFamily:"var(--fb)",fontSize:11,color:"var(--t3)",marginTop:1}}>{a.instagram}</div></div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                      <Tag color={a.tierColor}>{a.tier}</Tag>
                      {a.status==="new"&&<Tag color="var(--red)">NEW</Tag>}
                      {a.status==="approved"&&<Tag color="#6a9a7a">✓</Tag>}
                      {a.status==="rejected"&&<Tag color="#7a3030">✗</Tag>}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:12,alignItems:"center"}}>
                    <span style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t3)"}}>👥 {parseInt(a.followers||0).toLocaleString()}</span>
                    <span style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t3)"}}>ER {a.erReach}%</span>
                    <span style={{fontFamily:"var(--fd)",fontSize:18,color:a.tierColor,marginLeft:"auto"}}>{a.score}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
        {showDetail && sel && (
          <div style={{flex:1,overflow:"auto",padding:20}}>
            <button onClick={()=>setShowDetail(false)} style={{background:"transparent",border:"none",color:"var(--t3)",fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.2em",marginBottom:20,display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>← LISTA</button>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:12}}>
              <div>
                <h2 style={{fontFamily:"var(--fd)",fontSize:"clamp(26px,5vw,38px)",color:"#fff",lineHeight:1}}>{sel.fullName}</h2>
                <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t2)",marginTop:3}}>{sel.email} · {sel.city} · {sel.age} anni</div>
                <div style={{display:"flex",gap:7,marginTop:10,flexWrap:"wrap"}}><Tag color={sel.tierColor}>{sel.tier}</Tag><Tag color="#555">{sel.tierLabel}</Tag></div>
              </div>
              <div style={{textAlign:"right"}}><div style={{fontFamily:"var(--fd)",fontSize:56,color:sel.tierColor,lineHeight:1}}>{sel.score}</div><div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)"}}>/ 100</div></div>
            </div>
            <div style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:16,marginBottom:16}}>
              <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.28em",marginBottom:8}}>ANALISI</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{sel.reasons?.map(r=><Tag key={r} color="#555">{r}</Tag>)}</div>
              <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
                {[["ER",`${sel.erReach}%`,"var(--red)"],["REACH",`${sel.reachRate}%`,"var(--gold)"],["GROWTH",`${sel.growthRate}%`,"#6a9a7a"]].map(([l,v,c])=>(
                  <div key={l}><div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)"}}>{l}</div><div style={{fontFamily:"var(--fd)",fontSize:20,color:c}}>{v}</div></div>
                ))}
              </div>
            </div>
            {sel.screenshotData && <div style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:14,marginBottom:16}}><div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.28em",marginBottom:10}}>SCREENSHOT INSIGHTS</div><img src={sel.screenshotData} alt="Insights" style={{width:"100%",maxHeight:300,objectFit:"contain"}}/></div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:2,marginBottom:16}}>
              {[["Instagram",sel.instagram],["TikTok",sel.tiktok||"—"],["Follower",parseInt(sel.followers||0).toLocaleString()],["Visualizzazioni",parseInt(sel.views||0).toLocaleString()],["Interazioni",parseInt(sel.interactions||0).toLocaleString()],["+Follower",`+${sel.newFollowers||0}`]].map(([k,v])=>(
                <div key={k} style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:"10px 12px"}}><div style={{fontFamily:"var(--fu)",fontSize:8,color:"var(--t3)",letterSpacing:"0.18em",marginBottom:3}}>{k}</div><div style={{fontFamily:"var(--fu)",fontSize:12,color:"#fff"}}>{v}</div></div>
              ))}
            </div>
            {[["3 PAROLE",sel.threeWords],["TIPO CONTENUTI",sel.contentType],["COSA TRASMETTE",sel.whatToTransmit],["PERCHÉ EVORΛ",sel.motivation],["COSA GLI PIACE",sel.brandLike],["COME INTEGREREBBE",sel.contentIntegration],["IMMAGINE ATLETA",sel.athleteImage],["QUALITÀ VS VENDERE",sel.qualityVsSell],["SENZA GUADAGNO IMMEDIATO",sel.buildWithoutEarnings],["REAZIONE BAD CONTENT",sel.badContentReaction],["RAPPRESENTARE UN BRAND",sel.brandMeaning],["CONTENUTI/MESE",sel.contentPerMonth],["ROUTINE",sel.hasRoutine],["LINEE GUIDA",sel.followsGuidelines],["PRODOTTI ACQUISTATI",sel.boughtProducts],["MIGLIORAMENTI",sel.improvements],["NOTA EXTRA",sel.extra],["DETTAGLI COLLABS",sel.brandCollabDetails]].filter(([,v])=>v).map(([k,v])=>(
              <div key={k} style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:14,marginBottom:6}}><div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.25em",marginBottom:6}}>{k}</div><p style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t2)",lineHeight:1.8}}>{v}</p></div>
            ))}
            <div style={{borderTop:"1px solid var(--brd)",paddingTop:20,marginTop:16,display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              <div>
                <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.25em",marginBottom:7}}>CODICE CREATOR</div>
                <div style={{display:"flex",gap:6}}><input value={code} onChange={e=>setCode(e.target.value)} placeholder="MARIO10" style={{fontSize:12}}/><button onClick={()=>upd(sel.id,{creatorCode:code})} style={{background:"#111",border:"1px solid #333",color:"var(--t2)",padding:"10px 12px",fontFamily:"var(--fu)",fontSize:9,cursor:"pointer",whiteSpace:"nowrap"}}>SALVA</button></div>
                {sel.creatorCode && <div style={{fontFamily:"var(--fu)",fontSize:11,color:"#6a9a7a",marginTop:5}}>✓ {sel.creatorCode}</div>}
              </div>
              <div>
                <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.25em",marginBottom:7}}>STATO</div>
                <div style={{display:"flex",gap:3}}>
                  {[["new","NEW","#333"],["review","REV","var(--gold)"],["approved","OK","#1a4a1a"],["rejected","NO","#4a1a1a"]].map(([s,l,c])=>(
                    <button key={s} onClick={()=>upd(sel.id,{status:s})} style={{flex:1,padding:"9px 4px",fontFamily:"var(--fu)",fontSize:8,letterSpacing:"0.06em",textTransform:"uppercase",cursor:"pointer",background:sel.status===s?c:"#0d0d0d",border:`1px solid ${sel.status===s?c:"#2a2a2a"}`,color:sel.status===s?"#fff":"var(--t3)",transition:"all .2s"}}>{l}</button>
                  ))}
                </div>
              </div>
            </div>
            <div style={{marginTop:14}}>
              <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.25em",marginBottom:7}}>NOTE INTERNE</div>
              <textarea value={note} onChange={e=>setNote(e.target.value)} rows={4} placeholder="Note riservate al team..." style={{fontSize:13}}/>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:9,gap:8}}>
                <button className="btn-red" onClick={()=>upd(sel.id,{notes:note})} style={{flex:1,padding:"11px",fontSize:11}}>SALVA NOTE</button>
                <button onClick={()=>del(sel.id)} style={{background:"transparent",border:"1px solid #5a1010",color:"#cc4444",padding:"11px 18px",fontFamily:"var(--fu)",fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",cursor:"pointer"}}>ELIMINA</button>
              </div>
            </div>
          </div>
        )}
        {!showDetail && (
          <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10}}>
            <div style={{fontFamily:"var(--fd)",fontSize:40,color:"#1a1a1a"}}>EVORΛ</div>
            <div style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t4)",letterSpacing:"0.3em"}}>SELEZIONA UNA CANDIDATURA</div>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [view,setView]=useState("landing");
  return(
    <>
      {view==="landing" && <Landing onApply={()=>setView("apply")} onAdmin={()=>setView("admin")}/>}
      {view==="apply"   && <ApplicationForm onBack={()=>setView("landing")} onAdmin={()=>setView("admin")}/>}
      {view==="admin"   && <AdminPanel onBack={()=>setView("landing")}/>}
    </>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
