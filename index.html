  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── DATA & SCORING ENGINE ───────────────────────────────────────────────────
    const scoreCandidate = (data) => {
      let score = 0;
      const reasons = [];

      const followers = parseInt(data.followers) || 0;
      if (followers >= 100000) { score += 30; reasons.push("100K+ follower"); }
      else if (followers >= 30000) { score += 22; reasons.push("30K+ follower"); }
      else if (followers >= 10000) { score += 14; reasons.push("10K+ follower"); }
      else if (followers >= 3000) { score += 6; reasons.push("3K+ follower"); }
      else { reasons.push("Micro audience"); }

      const er = parseFloat(data.engagementRate) || 0;
      if (er >= 6) { score += 25; reasons.push("ER eccellente"); }
      else if (er >= 4) { score += 18; reasons.push("ER solido"); }
      else if (er >= 2) { score += 10; reasons.push("ER nella media"); }
      else { reasons.push("ER basso"); }

      if (data.niche === "fitness" || data.niche === "bodybuilding") { score += 20; reasons.push("Nicchia core"); }
      else if (data.niche === "lifestyle" || data.niche === "nutrition") { score += 12; reasons.push("Nicchia affine"); }
      else { score += 4; }

      if (data.hasCollaborations === "yes") { score += 10; reasons.push("Exp. collaborazioni"); }
      if (data.contentFrequency === "daily") { score += 8; reasons.push("Content daily"); }
      else if (data.contentFrequency === "3-5week") { score += 5; }

      const motivation = (data.motivation || "").length;
      if (motivation > 300) { score += 7; reasons.push("Motivazione elaborata"); }
      else if (motivation > 150) { score += 3; }

      if (data.platforms && data.platforms.length >= 3) { score += 5; reasons.push("Multi-platform"); }

      let tier, tierColor, tierLabel;
      if (score >= 75) { tier = "ELITE"; tierColor = "#b22222"; tierLabel = "Priorità Assoluta"; }
      else if (score >= 55) { tier = "PRO"; tierColor = "#c0a060"; tierLabel = "Alta Priorità"; }
      else if (score >= 35) { tier = "RISING"; tierColor = "#6a9a7a"; tierLabel = "Da Monitorare"; }
      else { tier = "PENDING"; tierColor = "#555"; tierLabel = "In Attesa"; }

      return { score, tier, tierColor, tierLabel, reasons };
    };

    // ─── STORAGE ─────────────────────────────────────────────────────────────────
    const getApps = () => {
      try { return JSON.parse(localStorage.getItem("evora_apps") || "[]"); } catch { return []; }
    };
    const saveApps = (apps) => localStorage.setItem("evora_apps", JSON.stringify(apps));

            <div style={{ padding: "0 40px", maxWidth: 900, animation: "fadeUp 1s ease both" }}>
