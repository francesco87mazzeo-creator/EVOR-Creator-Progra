// ── OCR ───────────────────────────────────────────────────────────────────────
const extractInsights = async (base64Image, apiKey) => {
  if (!apiKey) throw new Error("API key non configurata — vai in Impostazioni");
  const parts = base64Image.split(",");
  const base64Data = parts[1];
  const mediaType = parts[0].split(":")[1].split(";")[0];

  const PROXY = "https://throbbing-feather-957f.francesco87-mazzeo.workers.dev";

  let res;
  try {
    res = await fetch(PROXY, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 200,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
            { type: "text", text: "Guarda questo screenshot Instagram Insights. Estrai i numeri. Rispondi SOLO con questo JSON: {\"views\":NUMERO,\"interactions\":NUMERO,\"newFollowers\":NUMERO}. Usa 0 se non visibile. SOLO JSON nient'altro." }
          ]
        }]
      })
    });
  } catch(e) { throw new Error("Errore di rete: " + e.message); }

  if (!res.ok) {
    let msg = "Errore API";
    try { const e = await res.json(); msg = e.error?.message || msg; } catch(e) {}
    throw new Error(msg);
  }
  const data = await res.json();
  const raw = data.content[0].text.trim();
  const match = raw.match(/\{[^}]+\}/);
  if (!match) throw new Error("Risposta non valida");
  return JSON.parse(match[0]);
};

// ── DEFAULT SCORING CONFIG (modificabile dall'admin) ─────────────────────────
const DEFAULT_SCORING = {
  // Pesi metriche (devono sommare 100)
  weights: { er: 40, reach: 35, growth: 25 },

  // Tier label
  tiers: [
    { name:"ELITE",   min:75, color:"#B22222", label:"Priorità Assoluta" },
    { name:"PRO",     min:55, color:"#c0a060", label:"Alta Priorità" },
    { name:"RISING",  min:35, color:"#6a9a7a", label:"Da Monitorare" },
    { name:"PENDING", min:0,  color:"#666666", label:"In Attesa" }
  ],

  // Benchmark per fascia follower
  // Ogni fascia ha: label, maxFollowers, er{poor,avg,good,great}, reach{...}, growth{...}
  bands: [
    {
      label:"0–1K", max:1000,
      er:    { poor:3,   avg:6,   good:10  },
      reach: { poor:50,  avg:100, good:200 },
      growth:{ poor:1,   avg:3,   good:8   }
    },

      reach: { poor:30,  avg:60,  good:120 },
      growth:{ poor:0.5, avg:1.5, good:4   }
    },

      reach: { poor:20,  avg:40,  good:80  },

    },

// Carica config da Firebase (con fallback a default)
let _scoringConfig = null;
const getScoringConfig = async () => {
  if (_scoringConfig) return _scoringConfig;
  try {
    const doc = await db.collection("settings").doc("scoring").get();
    _scoringConfig = doc.exists ? doc.data() : DEFAULT_SCORING;
  } catch(e) {
    _scoringConfig = DEFAULT_SCORING;
  }
  return _scoringConfig;
};
const invalidateScoringCache = () => { _scoringConfig = null; };

// Normalizza una metrica rispetto ai benchmark della fascia (0-100)
const normalizeMetric = (value, band, metric) => {
  const b = band[metric];
  if (value <= 0) return 0;
  if (value >= b.good)  return 100;
  if (value >= b.avg)   return 50 + ((value - b.avg) / (b.good - b.avg)) * 50;
  if (value >= b.poor)  return 20 + ((value - b.poor) / (b.avg - b.poor)) * 30;
  return Math.max(0, (value / b.poor) * 20);
};

// Scoring sincrono (usa config passata come parametro)
const scoreCandidate = (data, config = DEFAULT_SCORING) => {
  const followers    = parseInt(data.followers)    || 0;
  const views        = parseInt(data.views)        || 0;
  const interactions = parseInt(data.interactions) || 0;
  const newFollowers = parseInt(data.newFollowers) || 0;

  // 1. Trova la fascia follower
  const band = config.bands.find(b => followers <= b.max) || config.bands[config.bands.length - 1];

  // 2. Calcola le metriche
  const er     = views > 0        ? (interactions / views)       * 100 : 0;
  const reach  = followers > 0    ? (views / followers)          * 100 : 0;
  const growth = followers > 0    ? (newFollowers / followers)   * 100 : 0;

  // 3. Normalizza 0-100 per fascia
  const erScore     = normalizeMetric(er,     band, "er");
  const reachScore  = normalizeMetric(reach,  band, "reach");
  const growthScore = normalizeMetric(growth, band, "growth");

  // 4. Score numerico pesato (metriche)
  const w = config.weights;
  const numericScore = (erScore * w.er + reachScore * w.reach + growthScore * w.growth) / 100;

  // 5. Score qualitativo risposte (max 30 punti — peso separato)
  const kf = [data.motivation, data.contentIntegration, data.brandMeaning, data.qualityVsSell];
  let qs = 0;
  kf.forEach(f => { const l=(f||"").length; if(l>300)qs+=6; else if(l>150)qs+=4; else if(l>50)qs+=1; });
  ["identità","rappresentare","costruire","disciplina","autenticità","valori","reale","genuino","evoluz","brand"].forEach(k => { if(kf.join(" ").toLowerCase().includes(k)) qs++; });
  const qualScore = Math.min(qs, 30);

  // 6. Score finale: 70% metriche + 30% qualità risposte
  const finalScore = Math.min(Math.round(numericScore * 0.7 + qualScore), 100);

  // 7. Label metriche
  const getLabel = (score) => score >= 75 ? "Eccellente" : score >= 50 ? "Buono" : score >= 20 ? "Nella media" : "Scarso";

  // 8. Reasons
  const reasons = [
    `Fascia: ${band.label}`,
    `ER ${er.toFixed(1)}% — ${getLabel(erScore)}`,
    `Reach ${reach.toFixed(0)}% — ${getLabel(reachScore)}`,
    `Growth ${growth.toFixed(2)}% — ${getLabel(growthScore)}`,
  ];
  if (data.hasBrandCollabs === "yes") reasons.push("Exp. brand collabs");
  if (qualScore >= 22) reasons.push("Risposte eccellenti");
  else if (qualScore >= 14) reasons.push("Risposte solide");

  // 9. Tier
  const tierDef = [...config.tiers].sort((a,b) => b.min - a.min).find(t => finalScore >= t.min) || config.tiers[config.tiers.length - 1];

  return {
    score: finalScore,
    tier: tierDef.name,
    tierColor: tierDef.color,
    tierLabel: tierDef.label,
    reasons,
    erScore: Math.round(erScore),
    reachScore: Math.round(reachScore),
    growthScore: Math.round(growthScore),
    qualScore,
    bandLabel: band.label,
    erReach: er.toFixed(2),
    reachRate: reach.toFixed(1),
    growthRate: growth.toFixed(2)
  };
};

          <div className="g3">
            {[{tier:"AFFILIATO",n:"01",color:"#888",desc:"Primo ingresso nel network EVORΛ. Codici sconto personalizzati e commissioni sulle vendite.",perks:["Codice creator dedicato","Commissione 10%","Kit digitale EVORΛ","Accesso contenuti B2B","Newsletter interna"]},{tier:"AMBASSADOR",n:"02",color:"var(--gold)",desc:"Profili selezionati con audience consolidata e alta coerenza con i valori EVORΛ.",perks:["Tutto da Affiliato +","Prodotti mensili","Commissione 15%","Co-creazione contenuti","Early access drop"]},{tier:"ELITE",n:"03",color:"var(--red)",desc:"Il livello più alto. Facce del brand EVORΛ. Collaborazione strategica e contratti formali.",perks:["Tutto da Ambassador +","Contratto formale","Campagne dedicate","Revenue sharing","Advisory role"]}].map((l,i)=>(
              <div key={l.tier} style={{background:i===1?"#0e0e0e":"var(--surf)",border:`1px solid ${i===1?l.color+"55":"var(--brd)"}`,padding:28,position:"relative",overflow:"hidden"}}>
                {i===1&&<div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(to right,transparent,var(--gold),transparent)`}}/>}
                <div style={{fontFamily:"var(--fd)",fontSize:56,color:l.color+"15",position:"absolute",right:8,top:-2,lineHeight:1,pointerEvents:"none"}}>{l.n}</div>

                <p style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",lineHeight:1.8,margin:"14px 0 18px"}}>{l.desc}</p>
                <div style={{borderTop:"1px solid var(--brd)",paddingTop:14}}>
                  {l.perks.map(p=><div key={p} style={{display:"flex",alignItems:"center",gap:9,marginBottom:7}}><div style={{width:3,height:3,background:l.color,flexShrink:0,borderRadius:"50%"}}/><span style={{fontFamily:"var(--fu)",fontSize:12,color:"var(--t2)"}}>{p}</span></div>)}

      <section id="requisiti" className="section">
        <div className="inner"><div className="g2">
          <div>
            <span className="sec-tag">Criteri di Selezione</span>
            <h2 className="sec-title" style={{fontSize:"clamp(30px,4vw,50px)"}}>COSA<br/>VALUTIAMO.</h2>
            <div className="redline"/>
            <p className="body-text">Ogni candidatura viene analizzata manualmente. Non esistono criteri automatici che garantiscono l'accesso.</p>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:2}}>
            {[["Audience reale","Non contano i follower comprati. Contiamo chi ti ascolta davvero."],["Coerenza verticale","Il tuo contenuto deve essere radicato in fitness, performance, lifestyle."],["Qualità produzione","Non serve uno studio. Serve uno standard."],["Identità personale","Chi sei fuori dal telefono è più importante di quante stories fai."],["Mentalità costruttiva","Cerchiamo chi pensa in termini di brand building, non di guadagno immediato."]].map(([t,d])=>(
              <div key={t} style={{padding:"16px 20px",border:"1px solid var(--brd)",display:"flex",gap:14,transition:"all .3s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor="#444";e.currentTarget.style.background="#0c0c0c";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--brd)";e.currentTarget.style.background="transparent";}}>
                <div style={{width:2,background:"var(--red)",flexShrink:0,alignSelf:"stretch"}}/>

// ── FORM ──────────────────────────────────────────────────────────────────────
const STEPS=["CHI SEI","SOCIAL & NUMERI","POSIZIONAMENTO","FIT CON EVORΛ","MENTALITÀ","IMPEGNO & EXTRA"];
const emptyForm={fullName:"",age:"",city:"",email:"",instagram:"",followers:"",tiktokFollowers:"",screenshotData:null,screenshotName:"",views:"",interactions:"",newFollowers:"",tiktok:"",hasBrandCollabs:"",brandCollabDetails:"",threeWords:"",contentType:"",whatToTransmit:"",motivation:"",brandLike:"",contentIntegration:"",athleteImage:"",qualityVsSell:"",buildWithoutEarnings:"",badContentReaction:"",brandMeaning:"",contentPerMonth:"",hasRoutine:"",followsGuidelines:"",boughtProducts:"",improvements:"",extra:""};

function ApplicationForm({onBack,onAdmin}){
  const [step,setStep]=useState(0);
  const [form,setForm]=useState(emptyForm);
  const [done,setDone]=useState(false);
  const [ocrStatus,setOcrStatus]=useState("idle");
  const [ocrError,setOcrError]=useState("");
  const [saving,setSaving]=useState(false);
  const u=(k,v)=>setForm(p=>({...p,[k]:v}));

  const handleFile=async(e)=>{
    const f=e.target.files?.[0]||e.dataTransfer?.files?.[0];
    if(!f||!f.type.startsWith("image/"))return;
    const r=new FileReader();
    r.onload=async(ev)=>{
      const img=ev.target.result;
      u("screenshotData",img); u("screenshotName",f.name);
      setOcrStatus("analyzing"); setOcrError("");
      try{
        const settings=await FB.getSettings();
        const d=await extractInsights(img, settings.apiKey);
        if(d.views)u("views",String(d.views));
        if(d.interactions)u("interactions",String(d.interactions));
        if(d.newFollowers)u("newFollowers",String(d.newFollowers));
        setOcrStatus("done");
      }catch(err){
        setOcrStatus("error");
        setOcrError(err.message||"Errore sconosciuto");
      }
    };
    r.readAsDataURL(f);
  };

  const submit=async()=>{
    setSaving(true);
    try{
      const sc=scoreCandidate(form);
      const app={...form,...sc,date:new Date().toISOString(),status:"new",notes:"",creatorCode:""};
      const id=Date.now();
      await FB.saveApp({id,...app});
      setDone(true);
    }catch(err){
      alert("Errore nel salvataggio — riprova");
    }finally{
      setSaving(false);
    }
  };

  if(done)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--black)",textAlign:"center",padding:24}}>
      <div style={{animation:"fadeUp .8s ease both",maxWidth:460}}>
        <div style={{fontFamily:"var(--fd)",fontSize:80,color:"var(--red)",lineHeight:1,marginBottom:10}}>✓</div>
        <h2 style={{fontFamily:"var(--fd)",fontSize:44,color:"#fff",marginBottom:16}}>CANDIDATURA RICEVUTA.</h2>
        <p style={{fontFamily:"var(--fb)",fontSize:15,color:"var(--t2)",lineHeight:1.9,marginBottom:36}}>Il team EVORΛ analizzerà il tuo profilo.<br/>Se sei in linea con gli standard, ti contatteremo entro <strong style={{color:"#fff"}}>7 giorni lavorativi</strong>.<br/><br/><span style={{fontSize:13,color:"var(--t3)"}}>Non mandare DM — rispettiamo chi rispetta il processo.</span></p>
        <button className="btn-ghost" onClick={onBack}>← TORNA AL SITO</button>
      </div>
    </div>
  );

  const sc=form.followers&&form.views?scoreCandidate(form):null;

  return(
    <div className="form-page">
      <Nav onAdmin={onAdmin} links={false} onBack={onBack}/>
      <div className="form-inner">
        <h1 style={{fontFamily:"var(--fd)",fontSize:"clamp(26px,5vw,44px)",color:"#fff",lineHeight:1,marginBottom:8}}>ATHLETES APPLICATION <span style={{color:"var(--red)"}}>2025</span></h1>
        <p style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",lineHeight:1.8,marginBottom:28}}>Compila ogni campo con precisione. Risposte superficiali portano automaticamente alla non selezione.</p>
        <div className="steps-bar">
          {STEPS.map((s,i)=><div key={s} className="step-item"><div className="step-line" style={{background:i<=step?"var(--red)":"#222"}}/><div className="step-lbl" style={{color:i===step?"#fff":"#444"}}>{s}</div></div>)}
        </div>

        {step===0&&<div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff"}}>CHI SEI</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <Field label="Nome e cognome" required><input value={form.fullName} onChange={e=>u("fullName",e.target.value)} placeholder="Mario Rossi"/></Field>
            <Field label="Età" required><input type="number" value={form.age} onChange={e=>u("age",e.target.value)} placeholder="24"/></Field>
          </div>
          <Field label="Città / Paese" required><input value={form.city} onChange={e=>u("city",e.target.value)} placeholder="Milano, Italia"/></Field>
          <Field label="Email" required><input type="email" value={form.email} onChange={e=>u("email",e.target.value)} placeholder="nome@email.com"/></Field>
        </div>}

        {step===1&&<div style={{display:"flex",flexDirection:"column",gap:24,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff"}}>SOCIAL & NUMERI</h3>

          {/* ── INSTAGRAM ── */}
          <div>
            <div style={{fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.4em",color:"var(--red)",textTransform:"uppercase",marginBottom:14,paddingBottom:10,borderBottom:"1px solid #1e1e1e"}}>
              ▸ INSTAGRAM
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                <Field label="Handle (@username)" required><input value={form.instagram} onChange={e=>u("instagram",e.target.value)} placeholder="@username"/></Field>
                <Field label="Follower" required><input type="number" value={form.followers} onChange={e=>u("followers",e.target.value)} placeholder="es. 25000"/></Field>
              </div>

              <Field label="Screenshot Insights — ultimi 30 giorni" required hint="Trascina l'immagine oppure clicca il pulsante — i dati vengono letti automaticamente">
                <div
                  onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor="var(--red)";}}
                  onDragLeave={e=>{e.currentTarget.style.borderColor="#333";}}
                  onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor="#333";handleFile(e);}}
                  style={{border:"2px dashed #333",padding:"24px 20px",textAlign:"center",background:"#090909",transition:"border-color .2s",minHeight:120,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8}}>
                  {form.screenshotData?(
                    <>
                      <img src={form.screenshotData} alt="Insights" style={{maxHeight:160,maxWidth:"100%",objectFit:"contain"}}/>
                      {ocrStatus==="analyzing"&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--gold)"}}>⏳ Lettura automatica in corso...</div>}
                      {ocrStatus==="done"&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"#6a9a7a"}}>✓ Dati estratti automaticamente</div>}
                      {ocrStatus==="error"&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--red)"}}>⚠ {ocrError}</div>}
                      {ocrStatus==="idle"&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--t3)"}}>✓ {form.screenshotName}</div>}
                    </>
                  ):(
                    <>
                      <div style={{fontSize:36}}>📊</div>
                      <div style={{fontFamily:"var(--fu)",fontSize:12,color:"var(--t2)",letterSpacing:"0.15em"}}>TRASCINA LO SCREENSHOT QUI</div>
                      <div style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t3)"}}>I numeri verranno letti automaticamente dall'AI</div>
                      <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)"}}>JPG · PNG · Max 10MB</div>
                    </>
                  )}
                </div>
                <label style={{display:"block",marginTop:8,padding:"11px 24px",background:"#111",border:"1px solid #333",color:"var(--t2)",fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.2em",textTransform:"uppercase",cursor:"pointer",textAlign:"center",transition:"all .2s"}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor="#555";e.currentTarget.style.color="#fff";}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor="#333";e.currentTarget.style.color="var(--t2)";}}>
                  {form.screenshotData?"📁 CAMBIA IMMAGINE":"📁 SCEGLI DAL DISPOSITIVO"}
                  <input type="file" accept="image/*" style={{display:"none"}} onChange={handleFile}/>
                </label>
              </Field>

              {ocrStatus==="analyzing"&&<div className="ocr-box"><div className="spinner"/><div><div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--gold)",letterSpacing:"0.15em"}}>ANALISI IN CORSO</div><div style={{fontFamily:"var(--fb)",fontSize:12,color:"var(--t3)",marginTop:2}}>Lettura automatica dello screenshot...</div></div></div>}

              {ocrStatus==="done"&&(
                <div className="ocr-box" style={{borderColor:"#6a9a7a50"}}>
                  <div style={{fontSize:18}}>✅</div>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:"var(--fu)",fontSize:11,color:"#6a9a7a",letterSpacing:"0.15em",marginBottom:10}}>DATI ESTRATTI AUTOMATICAMENTE</div>
                    <div style={{display:"flex",gap:24,flexWrap:"wrap"}}>
                      {[["Visualizzazioni",form.views],["Interazioni",form.interactions],["Nuovi follower",form.newFollowers]].filter(([,v])=>v).map(([l,v])=>(
                        <div key={l}>
                          <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.15em",marginBottom:2}}>{l}</div>
                          <div style={{fontFamily:"var(--fd)",fontSize:24,color:"var(--t1)"}}>{parseInt(v).toLocaleString()}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* ── TIKTOK ── */}
          <div>
            <div style={{fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.4em",color:"var(--t3)",textTransform:"uppercase",marginBottom:14,paddingBottom:10,borderBottom:"1px solid #1e1e1e"}}>
              ▸ TIKTOK <span style={{fontSize:9,color:"var(--t4)",letterSpacing:"0.2em"}}>(OPZIONALE)</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              <Field label="Handle (@username)"><input value={form.tiktok} onChange={e=>u("tiktok",e.target.value)} placeholder="@username"/></Field>
              <Field label="Follower"><input type="number" value={form.tiktokFollowers} onChange={e=>u("tiktokFollowers",e.target.value)} placeholder="es. 10000"/></Field>
            </div>
          </div>

        </div>}

        {step===2&&<div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff"}}>POSIZIONAMENTO</h3>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t2)",lineHeight:1.8,padding:"12px 16px",border:"1px solid #2a2a2a"}}>Questa sezione serve a capire chi sei come creator, al di là dei numeri.</div>
          <Field label="Come ti descriveresti in 3 parole come creator?" required><input value={form.threeWords} onChange={e=>u("threeWords",e.target.value)} placeholder="es. Autentico, Diretto, Consistente"/></Field>
          <Field label="Che tipo di contenuti pubblichi principalmente?" required><textarea value={form.contentType} onChange={e=>u("contentType",e.target.value)} rows={4} placeholder="Formato, temi, approccio, frequenza..."/></Field>
          <Field label="Cosa vuoi trasmettere alle persone che ti seguono?" required><textarea value={form.whatToTransmit} onChange={e=>u("whatToTransmit",e.target.value)} rows={4} placeholder="Qual è il messaggio centrale che porti avanti?"/></Field>
          <Field label="Hai già collaborato con brand fitness?" required>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{[["yes","Sì, ho esperienza"],["no","No, prima volta"]].map(([v,l])=><Choice key={v} label={l} value={v} selected={form.hasBrandCollabs===v} onClick={v=>u("hasBrandCollabs",v)}/>)}</div>
          </Field>
          {form.hasBrandCollabs==="yes"&&<Field label="Quali brand? Hai collaborazioni in corso?"><textarea value={form.brandCollabDetails} onChange={e=>u("brandCollabDetails",e.target.value)} rows={3} placeholder="Elenca i brand e descrivi il tipo di collaborazione..."/></Field>}
        </div>}

        {step===3&&<div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff"}}>FIT CON EVORΛ</h3>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t2)",lineHeight:1.8,padding:"12px 16px",borderLeft:"3px solid var(--red)",background:"#100303"}}>La sezione più importante. Qui capiamo se hai davvero capito cosa è EVORΛ.</div>
          <Field label="Perché vuoi entrare in EVORΛ?" required hint="Sii specifico. Risposte generiche vengono scartate."><textarea value={form.motivation} onChange={e=>u("motivation",e.target.value)} rows={5} placeholder="Non dirci cosa vuoi ottenere. Dicci perché EVORΛ e non un altro brand..."/></Field>
          <div style={{fontFamily:"var(--fu)",fontSize:10,color:form.motivation.length>200?"#6a9a7a":form.motivation.length>100?"var(--gold)":"var(--t4)",marginTop:-12}}>{form.motivation.length} car. {form.motivation.length<150?"— scrivi almeno 150":form.motivation.length<300?"— buono":"— ottimo"}</div>
          <Field label="Cosa ti piace del brand EVORΛ?" required><textarea value={form.brandLike} onChange={e=>u("brandLike",e.target.value)} rows={4} placeholder="Cosa ti ha colpito?"/></Field>
          <Field label="Come integreresti EVORΛ nei tuoi contenuti senza renderlo una pubblicità?" required><textarea value={form.contentIntegration} onChange={e=>u("contentIntegration",e.target.value)} rows={5} placeholder="Spiega concretamente come mostreresti EVORΛ nel tuo contesto..."/></Field>
          <Field label="Che tipo di immagine deve trasmettere un atleta EVORΛ?" required><textarea value={form.athleteImage} onChange={e=>u("athleteImage",e.target.value)} rows={4} placeholder="Come vedi l'atleta EVORΛ ideale?"/></Field>
        </div>}

        {step===4&&<div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff"}}>MENTALITÀ</h3>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t2)",lineHeight:1.8,padding:"12px 16px",borderLeft:"3px solid var(--red)",background:"#100303"}}>Questa sezione filtra il 90% delle candidature. Non esistono risposte giuste o sbagliate.</div>
          <Field label="Preferisci creare contenuti di qualità o puntare subito a vendere? Perché?" required><textarea value={form.qualityVsSell} onChange={e=>u("qualityVsSell",e.target.value)} rows={5} placeholder="Sii onesto/a..."/></Field>
          <Field label="Sei disposto/a a lavorare senza aspettarti risultati economici immediati?" required>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{[["yes","Sì"],["no","No"],["depends","Dipende"]].map(([v,l])=><Choice key={v} label={l} value={v} selected={form.buildWithoutEarnings===v} onClick={v=>u("buildWithoutEarnings",v)}/>)}</div>
          </Field>
          <Field label="Come reagisci se un contenuto non performa?" required><textarea value={form.badContentReaction} onChange={e=>u("badContentReaction",e.target.value)} rows={4} placeholder="Descrivi il tuo processo mentale..."/></Field>
          <Field label="Cosa significa per te rappresentare un brand?" required><textarea value={form.brandMeaning} onChange={e=>u("brandMeaning",e.target.value)} rows={5} placeholder="Cosa cambia nel tuo modo di creare contenuti quando sei ambassador?"/></Field>
        </div>}

        {step===5&&<div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff"}}>IMPEGNO & EXTRA</h3>
          <Field label="Quanti contenuti al mese per EVORΛ?" required>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{[["1-2","1-2/mese"],["3-5","3-5/mese"],["6-10","6-10/mese"],["10+","10+/mese"]].map(([v,l])=><Choice key={v} label={l} value={v} selected={form.contentPerMonth===v} onClick={v=>u("contentPerMonth",v)}/>)}</div>
          </Field>
          <Field label="Hai una routine di pubblicazione costante?" required>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{[["yes","Sì, sono consistente"],["no","No, sono irregolare"],["building","La sto costruendo"]].map(([v,l])=><Choice key={v} label={l} value={v} selected={form.hasRoutine===v} onClick={v=>u("hasRoutine",v)}/>)}</div>
          </Field>
          <Field label="Sei disponibile a seguire linee guida creative?" required>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{[["yes","Sì"],["mostly","Con flessibilità"],["no","No"]].map(([v,l])=><Choice key={v} label={l} value={v} selected={form.followsGuidelines===v} onClick={v=>u("followsGuidelines",v)}/>)}</div>
          </Field>
          <div style={{borderTop:"1px solid var(--brd)",paddingTop:20}}>
            <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.3em",marginBottom:16}}>CAMPI OPZIONALI</div>
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              <Field label="Hai mai acquistato prodotti EVORΛ?"><input value={form.boughtProducts} onChange={e=>u("boughtProducts",e.target.value)} placeholder="es. Pre-workout, abbigliamento..."/></Field>
              <Field label="C'è qualcosa che miglioreresti del brand?"><textarea value={form.improvements} onChange={e=>u("improvements",e.target.value)} rows={3} placeholder="Feedback onesto..."/></Field>
              <Field label="Vuoi aggiungere qualcosa per distinguerti?"><textarea value={form.extra} onChange={e=>u("extra",e.target.value)} rows={4} placeholder="Ultima opportunità..."/></Field>
            </div>
          </div>
        </div>}

        <div style={{display:"flex",gap:12,marginTop:40,paddingTop:24,borderTop:"1px solid var(--brd)"}}>
          <button className="btn-ghost" onClick={()=>step>0?setStep(step-1):onBack()} style={{flex:1,padding:"13px 16px",fontSize:11}}>{step===0?"ANNULLA":"← INDIETRO"}</button>
          <button className="btn-red" onClick={()=>step<5?setStep(step+1):submit()} style={{flex:2,padding:"13px 16px",fontSize:11}} disabled={ocrStatus==="analyzing"||saving}>
            {saving?"⏳ SALVATAGGIO...":ocrStatus==="analyzing"?"⏳ ANALISI...":step<5?"CONTINUA →":"INVIA CANDIDATURA"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── CANDIDATURE PANEL ─────────────────────────────────────────────────────────
function CandidaturePanel({role}){
  const [apps,setApps]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [filter,setFilter]=useState("ALL");
  const [search,setSearch]=useState("");
  const [note,setNote]=useState("");
  const [code,setCode]=useState("");
  const [showDetail,setShowDetail]=useState(false);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    FB.getApps().then(a=>{setApps(a);setLoading(false);}).catch(()=>setLoading(false));
  },[]);

  const upd=async(id,patch)=>{
    setSaving(true);
    try{
      await FB.updateApp(id,patch);
      const updated=apps.map(a=>a.id==id?{...a,...patch}:a);
      setApps(updated);
      if(sel?.id==id)setSel(p=>({...p,...patch}));
    }finally{setSaving(false);}
  };

  const del=async(id)=>{
    if(role!=="admin")return;
    if(!window.confirm("Eliminare questa candidatura?"))return;
    await FB.deleteApp(id);
    setApps(apps.filter(a=>a.id!=id));
    setSel(null); setShowDetail(false);
  };

  const selectApp=a=>{setSel(a);setNote(a.notes||"");setCode(a.creatorCode||"");setShowDetail(true);};

  const list=apps.filter(a=>{
    const mt=filter==="ALL"?true:filter==="NEW"?a.status==="new":a.tier===filter;
    const ms=!search||(a.fullName||"").toLowerCase().includes(search.toLowerCase())||(a.instagram||"").toLowerCase().includes(search.toLowerCase());
    return mt&&ms;
  });

  const st={total:apps.length,nw:apps.filter(a=>a.status==="new").length,el:apps.filter(a=>a.tier==="ELITE").length,pr:apps.filter(a=>a.tier==="PRO").length,ri:apps.filter(a=>a.tier==="RISING").length,ap:apps.filter(a=>a.status==="approved").length};

  if(loading)return(
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div className="spinner" style={{width:32,height:32,borderWidth:3}}/>
      <div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--t4)",letterSpacing:"0.2em"}}>CARICAMENTO CANDIDATURE...</div>
    </div>
  );

  return(
    <div style={{display:"flex",flex:1,overflow:"hidden",flexDirection:"column"}}>
      <div style={{display:"flex",background:"var(--surf)",borderBottom:"1px solid var(--brd)",flexShrink:0,overflowX:"auto"}}>
        {[["TOT",st.total,"#fff"],["NUOVE",st.nw,"var(--red)"],["ELITE",st.el,"var(--red)"],["PRO",st.pr,"var(--gold)"],["RISING",st.ri,"#6a9a7a"],["OK",st.ap,"#6a9a7a"]].map(([l,v,c])=>(
          <div key={l} style={{padding:"12px 20px",borderRight:"1px solid var(--brd)",textAlign:"center",minWidth:70,flexShrink:0}}>
            <div style={{fontFamily:"var(--fd)",fontSize:22,color:c,lineHeight:1}}>{v}</div>
            <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t3)",letterSpacing:"0.15em",marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {!showDetail&&(
          <div style={{width:"100%",maxWidth:360,borderRight:"1px solid var(--brd)",display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0}}>
            <div style={{padding:"12px 14px",borderBottom:"1px solid var(--brd)"}}>
              <input placeholder="Cerca nome, @handle..." style={{marginBottom:8,fontSize:12}} value={search} onChange={e=>setSearch(e.target.value)}/>
              <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                {["ALL","NEW","ELITE","PRO","RISING","PENDING"].map(f=>(
                  <button key={f} onClick={()=>setFilter(f)} style={{padding:"4px 8px",fontFamily:"var(--fu)",fontSize:8,letterSpacing:"0.08em",textTransform:"uppercase",cursor:"pointer",background:filter===f?"var(--red)":"#0d0d0d",border:`1px solid ${filter===f?"var(--red)":"#2a2a2a"}`,color:filter===f?"#fff":"var(--t3)",transition:"all .2s"}}>{f}</button>
                ))}
              </div>
            </div>
            <div style={{overflow:"auto",flex:1}}>

// ── SCORING PANEL ─────────────────────────────────────────────────────────────
function ScoringPanel(){
  const [cfg, setCfg] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saved, setSaved] = useState(false);

  useEffect(()=>{
    db.collection("settings").doc("scoring").get().then(doc=>{
      setCfg(doc.exists ? doc.data() : JSON.parse(JSON.stringify(DEFAULT_SCORING)));
      setLoading(false);
    }).catch(()=>{ setCfg(JSON.parse(JSON.stringify(DEFAULT_SCORING))); setLoading(false); });
  },[]);

  const save = async () => {
    await db.collection("settings").doc("scoring").set(cfg);
    invalidateScoringCache();
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  const resetDefault = () => { setCfg(JSON.parse(JSON.stringify(DEFAULT_SCORING))); };

  const updateWeight = (key, val) => {
    setCfg(p=>({...p, weights:{...p.weights, [key]: parseFloat(val)||0}}));
  };

  const updateBand = (bi, metric, level, val) => {
    const bands = JSON.parse(JSON.stringify(cfg.bands));
    bands[bi][metric][level] = parseFloat(val)||0;
    setCfg(p=>({...p, bands}));
  };

  const updateTier = (ti, field, val) => {
    const tiers = JSON.parse(JSON.stringify(cfg.tiers));
    tiers[ti][field] = field==="min" ? parseInt(val)||0 : val;
    setCfg(p=>({...p, tiers}));
  };

  if(loading) return <div style={{padding:32,textAlign:"center",fontFamily:"var(--fu)",fontSize:11,color:"var(--t4)"}}>CARICAMENTO...</div>;

  const iStyle = {background:"#141414",border:"1px solid #3a3a3a",color:"var(--t1)",padding:"8px 10px",fontSize:13,fontFamily:"var(--fb)",outline:"none",width:"100%"};
  const totalW = (cfg.weights.er||0)+(cfg.weights.reach||0)+(cfg.weights.growth||0);

  return(
    <div style={{overflow:"auto",flex:1}}>
      <div style={{maxWidth:900,margin:"0 auto",padding:"32px 20px 80px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28,flexWrap:"wrap",gap:12}}>
          <h2 style={{fontFamily:"var(--fd)",fontSize:32,color:"var(--t1)",fontWeight:900}}>SCORING ENGINE</h2>
          <div style={{display:"flex",gap:8}}>
            <button onClick={resetDefault} className="btn-ghost" style={{padding:"9px 20px",fontSize:11}}>RESET DEFAULT</button>
            <button onClick={save} className="btn-red" style={{padding:"9px 24px",fontSize:11}}>
              {saved?"✓ SALVATO":"SALVA CONFIGURAZIONE"}
            </button>
          </div>
        </div>

        {/* PESI METRICHE */}
        <div style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:24,marginBottom:16}}>
          <div style={{fontFamily:"var(--fd)",fontSize:18,color:"var(--t1)",marginBottom:4,fontWeight:700}}>⚖️ Pesi delle Metriche</div>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",marginBottom:20,lineHeight:1.7}}>La somma deve essere 100. Attualmente: <strong style={{color:totalW===100?"#6a9a7a":"var(--red)"}}>{totalW}</strong></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16}}>
            {[["er","Engagement Rate","40% consigliato"],["reach","Reach Rate","35% consigliato"],["growth","Growth Rate","25% consigliato"]].map(([k,l,hint])=>(
              <div key={k}>
                <label style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t3)",letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:6,display:"block",fontWeight:600}}>{l}</label>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <input type="number" min="0" max="100" style={iStyle} value={cfg.weights[k]} onChange={e=>updateWeight(k,e.target.value)}/>
                  <span style={{fontFamily:"var(--fd)",fontSize:22,color:"var(--red)",fontWeight:700}}>%</span>
                </div>
                <div style={{fontFamily:"var(--fb)",fontSize:11,color:"var(--t4)",marginTop:4}}>{hint}</div>
              </div>
            ))}
          </div>
        </div>

        {/* TIER SOGLIE */}
        <div style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:24,marginBottom:16}}>
          <div style={{fontFamily:"var(--fd)",fontSize:18,color:"var(--t1)",marginBottom:4,fontWeight:700}}>🏆 Soglie Tier</div>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",marginBottom:20}}>Punteggio minimo per accedere a ogni tier.</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
            {cfg.tiers.map((t,i)=>(
              <div key={t.name} style={{background:"#141414",border:`1px solid ${t.color}40`,padding:16}}>
                <div style={{fontFamily:"var(--fu)",fontSize:11,color:t.color,letterSpacing:"0.2em",fontWeight:700,marginBottom:10}}>{t.name}</div>
                <label style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.15em",display:"block",marginBottom:4}}>PUNTEGGIO MIN</label>
                <input type="number" min="0" max="100" style={iStyle} value={t.min} onChange={e=>updateTier(i,"min",e.target.value)}/>
                <label style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.15em",display:"block",margin:"10px 0 4px"}}>LABEL</label>
                <input type="text" style={iStyle} value={t.label} onChange={e=>updateTier(i,"label",e.target.value)}/>
              </div>
            ))}
          </div>
        </div>

        {/* BENCHMARK PER FASCIA */}
        <div style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:24}}>
          <div style={{fontFamily:"var(--fd)",fontSize:18,color:"var(--t1)",marginBottom:4,fontWeight:700}}>📊 Benchmark per Fascia Follower</div>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",marginBottom:8,lineHeight:1.7}}>
            Per ogni fascia definisci le soglie <strong style={{color:"var(--t2)"}}>Scarso / Medio / Buono</strong> per ER%, Reach% e Growth%.
            Il sistema interpola automaticamente i valori intermedi.
          </div>
          <div style={{fontFamily:"var(--fb)",fontSize:12,color:"var(--t4)",marginBottom:20,padding:"10px 14px",background:"#141414",border:"1px solid #333"}}>
            💡 ER = interazioni/visualizzazioni×100 · Reach = visualizzazioni/follower×100 · Growth = nuovi follower/follower×100
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:2}}>
            {/* Header */}
            <div style={{display:"grid",gridTemplateColumns:"120px repeat(3,1fr) repeat(3,1fr) repeat(3,1fr)",gap:4,padding:"8px 12px"}}>
              <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.15em"}}>FASCIA</div>
              {["ER — Scarso","ER — Medio","ER — Buono","Reach — Scarso","Reach — Medio","Reach — Buono","Growth — Scarso","Growth — Medio","Growth — Buono"].map(h=>(
                <div key={h} style={{fontFamily:"var(--fu)",fontSize:8,color:"var(--t4)",letterSpacing:"0.1em",textAlign:"center"}}>{h}</div>
              ))}
            </div>

            {cfg.bands.map((band,bi)=>(
              <div key={bi} style={{display:"grid",gridTemplateColumns:"120px repeat(3,1fr) repeat(3,1fr) repeat(3,1fr)",gap:4,padding:"10px 12px",background:"#141414",border:"1px solid #2a2a2a"}}>
                <div style={{fontFamily:"var(--fu)",fontSize:12,color:"var(--t1)",fontWeight:700,display:"flex",alignItems:"center"}}>{band.label}</div>
                {/* ER */}
                {["poor","avg","good"].map(l=>(
                  <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
                    <input type="number" step="0.1" min="0" style={{...iStyle,fontSize:12,padding:"6px 8px"}} value={band.er[l]} onChange={e=>updateBand(bi,"er",l,e.target.value)}/>
                    <span style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t4)"}}>%</span>
                  </div>
                ))}
                {/* Reach */}
                {["poor","avg","good"].map(l=>(
                  <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
                    <input type="number" step="1" min="0" style={{...iStyle,fontSize:12,padding:"6px 8px"}} value={band.reach[l]} onChange={e=>updateBand(bi,"reach",l,e.target.value)}/>
                    <span style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t4)"}}>%</span>
                  </div>
                ))}
                {/* Growth */}
                {["poor","avg","good"].map(l=>(
                  <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
                    <input type="number" step="0.1" min="0" style={{...iStyle,fontSize:12,padding:"6px 8px"}} value={band.growth[l]} onChange={e=>updateBand(bi,"growth",l,e.target.value)}/>
                    <span style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t4)"}}>%</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>

        <div style={{marginTop:20,display:"flex",justifyContent:"flex-end",gap:8}}>
          <button onClick={resetDefault} className="btn-ghost" style={{padding:"12px 24px",fontSize:11}}>RESET DEFAULT</button>
          <button onClick={save} className="btn-red" style={{padding:"12px 32px",fontSize:12}}>
            {saved?"✓ CONFIGURAZIONE SALVATA":"SALVA CONFIGURAZIONE"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── ADMIN PANEL ───────────────────────────────────────────────────────────────
const DEFAULT_ADMIN="evora2025";
const DEFAULT_MANAGER="evora_smm";

function AdminPanel({onBack}){
  const [role,setRole]=useState(null);
  const [pw,setPw]=useState("");
  const [pwError,setPwError]=useState(false);
  const [activeTab,setActiveTab]=useState("candidature");
  const [checking,setChecking]=useState(false);

  const login=async()=>{
    setChecking(true);
    try{
      const settings=await FB.getSettings();
      const adminPass=settings.adminPass||DEFAULT_ADMIN;
      const managerPass=settings.managerPass||DEFAULT_MANAGER;
      if(pw===adminPass){setRole("admin");setPwError(false);}
      else if(pw===managerPass){setRole("manager");setPwError(false);}
      else{setPwError(true);}
    }catch(e){
      // Se Firebase non risponde, usa default
      if(pw===DEFAULT_ADMIN)setRole("admin");
      else if(pw===DEFAULT_MANAGER)setRole("manager");
      else setPwError(true);
    }finally{setChecking(false);}
  };

  if(!role)return(
    <div style={{minHeight:"100vh",background:"var(--black)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:380,animation:"fadeUp .6s ease both"}}>
        <Logo size={22}/>
        <h2 style={{fontFamily:"var(--fd)",fontSize:38,color:"#fff",margin:"24px 0 4px"}}>AREA RISERVATA</h2>
        <p style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",marginBottom:28,lineHeight:1.7}}>Accesso esclusivo team EVORΛ.<br/>Inserisci la tua password.</p>
        <input type="password" placeholder="Password..." style={{marginBottom:10,borderColor:pwError?"var(--red)":"#333"}}
          value={pw} onChange={e=>{setPw(e.target.value);setPwError(false);}}
          onKeyDown={e=>e.key==="Enter"&&login()}/>
        {pwError&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--red)",letterSpacing:"0.15em",marginBottom:10}}>⚠ PASSWORD ERRATA</div>}
        <button className="btn-red" onClick={login} style={{width:"100%",padding:"14px"}} disabled={checking}>
          {checking?"VERIFICA...":"ACCEDI"}
        </button>
        <button className="btn-ghost" onClick={onBack} style={{width:"100%",marginTop:8,padding:"14px"}}>← TORNA AL SITO</button>
        <div style={{marginTop:20,padding:"16px",background:"#0a0a0a",border:"1px solid #1e1e1e"}}>
          <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.25em",marginBottom:10}}>ACCESSI DISPONIBILI</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--t3)"}}>🔐 Admin — accesso completo</span><Tag color="var(--red)">OWNER</Tag></div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--t3)"}}>👤 Manager — candidature only</span><Tag color="var(--gold)">SMM</Tag></div>
          </div>
        </div>
      </div>
    </div>
  );

  return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{height:52,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",borderBottom:"1px solid var(--brd)",background:"var(--deep)",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <Logo size={16}/>
          <Tag color={role==="admin"?"var(--red)":"var(--gold)"}>{role==="admin"?"ADMIN":"MANAGER"}</Tag>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button className="btn-ghost" onClick={()=>{setRole(null);setPw("");}} style={{padding:"6px 14px",fontSize:10}}>ESCI</button>
          <button className="btn-ghost" onClick={onBack} style={{padding:"6px 14px",fontSize:10}}>← SITO</button>
        </div>
      </div>
      <div className="tab-bar">
        <button className={`tab${activeTab==="candidature"?" active":""}`} onClick={()=>setActiveTab("candidature")}>📋 Candidature</button>
        {role==="admin"&&<button className={`tab${activeTab==="scoring"?" active":""}`} onClick={()=>setActiveTab("scoring")}>🎯 Scoring</button>}
        {role==="admin"&&<button className={`tab${activeTab==="settings"?" active":""}`} onClick={()=>setActiveTab("settings")}>⚙️ Impostazioni</button>}
      </div>
      {activeTab==="candidature"&&<CandidaturePanel role={role}/>}
      {activeTab==="scoring"&&role==="admin"&&<ScoringPanel/>}
      {activeTab==="settings"&&role==="admin"&&<SettingsPanel/>}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [view,setView]=useState("landing");
  return(
    <>
      {view==="landing"&&<Landing onApply={()=>setView("apply")} onAdmin={()=>setView("admin")}/>}
      {view==="apply"&&<ApplicationForm onBack={()=>setView("landing")} onAdmin={()=>setView("admin")}/>}
      {view==="admin"&&<AdminPanel onBack={()=>setView("landing")}/>}
    </>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
