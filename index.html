  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const scoreCandidate = (data) => {
      let score = 0;
      const reasons = [];
      const followers = parseInt(data.followers) || 0;
      const views = parseInt(data.views) || 0;
      const interactions = parseInt(data.interactions) || 0;
      const newFollowers = parseInt(data.newFollowers) || 0;

      // 1. FOLLOWER BASE (max 20pt)
      if (followers >= 100000) { score += 20; reasons.push("100K+ follower"); }
      else if (followers >= 50000) { score += 17; reasons.push("50K+ follower"); }
      else if (followers >= 30000) { score += 14; reasons.push("30K+ follower"); }
      else if (followers >= 10000) { score += 10; reasons.push("10K+ follower"); }
      else if (followers >= 5000)  { score += 6;  reasons.push("5K+ follower"); }
      else if (followers >= 1000)  { score += 3;  reasons.push("1K+ follower"); }

      // 2. REACH RATE (max 15pt)
      const reachRate = followers > 0 ? views / followers : 0;
      if (followers < 10000) {
        if (reachRate >= 1.5) { score += 15; reasons.push("Reach virale"); }
        else if (reachRate >= 1) { score += 12; reasons.push("Reach ottima"); }
        else if (reachRate >= 0.5) { score += 8; reasons.push("Reach buona"); }
        else if (reachRate >= 0.2) score += 4;
      } else if (followers < 50000) {
        if (reachRate >= 1.2) { score += 15; reasons.push("Reach virale"); }
        else if (reachRate >= 0.8) { score += 12; reasons.push("Reach ottima"); }
        else if (reachRate >= 0.4) { score += 8; reasons.push("Reach buona"); }
        else if (reachRate >= 0.2) score += 4;
      } else {
        if (reachRate >= 0.8) { score += 15; reasons.push("Reach eccellente"); }
        else if (reachRate >= 0.5) { score += 12; reasons.push("Reach ottima"); }
        else if (reachRate >= 0.3) { score += 8; reasons.push("Reach buona"); }
        else if (reachRate >= 0.1) score += 4;
      }

      // 3. ER SU REACH (max 25pt)
      const erReach = views > 0 ? (interactions / views) * 100 : 0;
      if (erReach >= 5) { score += 25; reasons.push("ER eccezionale"); }
      else if (erReach >= 3) { score += 20; reasons.push("ER ottimo"); }
      else if (erReach >= 2) { score += 15; reasons.push("ER buono"); }
      else if (erReach >= 1) { score += 10; reasons.push("ER nella media"); }
      else if (erReach >= 0.5) score += 5;

      // 4. GROWTH RATE (max 15pt)
      const growthRate = followers > 0 ? (newFollowers / followers) * 100 : 0;
      if (followers < 10000) {
        if (growthRate >= 2) { score += 15; reasons.push("Crescita forte"); }
        else if (growthRate >= 1) { score += 10; reasons.push("Crescita buona"); }
        else if (growthRate >= 0.5) score += 6;
      } else if (followers < 50000) {
        if (growthRate >= 1) { score += 15; reasons.push("Crescita forte"); }
        else if (growthRate >= 0.5) { score += 10; reasons.push("Crescita buona"); }
        else if (growthRate >= 0.2) score += 6;
      } else {
        if (growthRate >= 0.5) { score += 15; reasons.push("Crescita forte"); }
        else if (growthRate >= 0.2) { score += 10; reasons.push("Crescita buona"); }
        else if (growthRate >= 0.1) score += 6;
      }

      // 5. QUALITÀ RISPOSTE (max 25pt)
      const keyFields = [data.motivation, data.contentIntegration, data.brandMeaning, data.qualityVsSell];
      let qs = 0;
      keyFields.forEach(f => {
        const len = (f||"").length;
        if (len > 300) qs += 5;
        else if (len > 150) qs += 3;
        else if (len > 50) qs += 1;
      });
      const kws = ["identità","rappresentare","costruire","disciplina","autenticità","valori","reale","genuino","evoluz"];
      const allText = keyFields.join(" ").toLowerCase();
      let kwScore = 0;
      kws.forEach(k => { if (allText.includes(k)) kwScore++; });
      qs = Math.min(qs + Math.min(kwScore, 5), 25);
      if (qs >= 20) reasons.push("Risposte eccellenti");
      else if (qs >= 12) reasons.push("Risposte solide");
      score += qs;

      if (data.hasBrandCollabs === "yes") { score += 5; reasons.push("Exp. brand collabs"); }

      const finalScore = Math.min(score, 100);
      let tier, tierColor, tierLabel;
      if (finalScore >= 75)      { tier="ELITE";   tierColor="#b22222"; tierLabel="Priorità Assoluta"; }
      else if (finalScore >= 55) { tier="PRO";     tierColor="#c0a060"; tierLabel="Alta Priorità"; }
      else if (finalScore >= 35) { tier="RISING";  tierColor="#6a9a7a"; tierLabel="Da Monitorare"; }
      else                       { tier="PENDING"; tierColor="#555555"; tierLabel="In Attesa"; }

      return { score: finalScore, tier, tierColor, tierLabel, reasons, erReach: erReach.toFixed(2), reachRate: (reachRate*100).toFixed(1), growthRate: growthRate.toFixed(2) };
    };

    // ─── FORM ─────────────────────────────────────────────────────────────────
    const STEPS = ["CHI SEI","SOCIAL & NUMERI","POSIZIONAMENTO","FIT CON EVORΛ","MENTALITÀ","IMPEGNO & EXTRA"];
    const emptyForm = {
      fullName:"",age:"",city:"",email:"",
      instagram:"",followers:"",screenshotData:null,screenshotName:"",
      views:"",interactions:"",newFollowers:"",tiktok:"",hasBrandCollabs:"",brandCollabDetails:"",
      threeWords:"",contentType:"",whatToTransmit:"",

          </div>

          <div style={{display:"flex",flex:1,overflow:"hidden"}}>
            <div style={{width:340,borderRight:"1px solid var(--brd)",display:"flex",flexDirection:"column",overflow:"hidden"}}>
              <div style={{padding:"12px 14px",borderBottom:"1px solid var(--brd)",background:"var(--black)"}}>
                <input placeholder="Cerca nome, @handle, email..." style={{marginBottom:9,fontSize:12}} value={search} onChange={e=>setSearch(e.target.value)}/>
                <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                  {["ALL","NEW","ELITE","PRO","RISING","PENDING"].map(f=>(
                    <button key={f} onClick={()=>setFilter(f)}
                      style={{padding:"4px 9px",fontFamily:"var(--fu)",fontSize:8,letterSpacing:"0.1em",textTransform:"uppercase",cursor:"pointer",background:filter===f?"var(--red)":"#0d0d0d",border:`1px solid ${filter===f?"var(--red)":"#1a1a1a"}`,color:filter===f?"white":"#3a3a3a",transition:"all .2s"}}>{f}</button>
                  ))}
                </div>
              </div>
              <div style={{overflow:"auto",flex:1}}>
                {list.length===0&&<div style={{padding:28,textAlign:"center",fontFamily:"var(--fu)",fontSize:10,color:"#1e1e1e",letterSpacing:"0.2em"}}>NESSUNA CANDIDATURA</div>}
                {list.map(a=>(
                  <div key={a.id} onClick={()=>{setSel(a);setNote(a.notes||"");setCode(a.creatorCode||"");}}
                    style={{padding:"13px 16px",borderBottom:"1px solid var(--brd)",cursor:"pointer",background:sel?.id===a.id?"#0e0e0e":"transparent",borderLeft:`2px solid ${sel?.id===a.id?"var(--red)":"transparent"}`,transition:"all .15s"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}}>
                      <div>
                        <div style={{fontFamily:"var(--fu)",fontSize:13,color:"white",letterSpacing:"0.03em"}}>{a.fullName||"—"}</div>
                        <div style={{fontFamily:"var(--fb)",fontSize:11,color:"#3a3a3a",marginTop:2}}>{a.instagram} · {a.city}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                        <Tag color={a.tierColor}>{a.tier}</Tag>
                        {a.status==="new"&&<Tag color="var(--red)">NEW</Tag>}
                        {a.status==="approved"&&<Tag color="#6a9a7a">✓</Tag>}
                        {a.status==="rejected"&&<Tag color="#5a2a2a">✗</Tag>}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <span style={{fontFamily:"var(--fu)",fontSize:10,color:"#3a3a3a"}}>👥 {parseInt(a.followers||0).toLocaleString()}</span>
                      <span style={{fontFamily:"var(--fu)",fontSize:10,color:"#3a3a3a"}}>ER {a.erReach}%</span>
                      <span style={{fontFamily:"var(--fd)",fontSize:19,color:a.tierColor,marginLeft:"auto"}}>{a.score}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {sel ? (
              <div style={{flex:1,overflow:"auto",padding:28}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>
                  <div>
                    <h2 style={{fontFamily:"var(--fd)",fontSize:42,color:"white",lineHeight:1}}>{sel.fullName}</h2>
                    <div style={{fontFamily:"var(--fb)",fontSize:13,color:"#4a4a4a",marginTop:3}}>{sel.email} · {sel.city} · {sel.age} anni</div>
                    <div style={{display:"flex",gap:7,marginTop:10,flexWrap:"wrap"}}>
                      <Tag color={sel.tierColor}>{sel.tier}</Tag>
                      <Tag color="#2a2a2a">{sel.tierLabel}</Tag>
                      <span style={{fontFamily:"var(--fu)",fontSize:9,color:"#222",padding:"3px 8px",letterSpacing:"0.1em"}}>{new Date(sel.date).toLocaleDateString("it-IT")}</span>
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontFamily:"var(--fd)",fontSize:68,color:sel.tierColor,lineHeight:1}}>{sel.score}</div>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.2em"}}>SCORE / 100</div>
                  </div>
                </div>

                <div style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:16,marginBottom:18}}>
                  <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.3em",marginBottom:9}}>ANALISI PROFILO</div>
                  <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
                    {sel.reasons?.map(r=><Tag key={r} color="#2a2a2a">{r}</Tag>)}
                  </div>
                  <div style={{display:"flex",gap:24}}>
                    {[["ER REACH",`${sel.erReach}%`,"var(--red)"],["REACH RATE",`${sel.reachRate}%`,"var(--gold)"],["GROWTH",`${sel.growthRate}%`,"#6a9a7a"]].map(([l,v,c])=>(
                      <div key={l}>
                        <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.2em"}}>{l}</div>
                        <div style={{fontFamily:"var(--fd)",fontSize:22,color:c}}>{v}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{display:"grid",gridTemplateColumns:sel.screenshotData?"1fr 1fr":"1fr",gap:14,marginBottom:18}}>
                  {sel.screenshotData&&(
                    <div style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:14}}>
                      <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.3em",marginBottom:10}}>SCREENSHOT INSIGHTS</div>
                      <img src={sel.screenshotData} alt="Insights" style={{width:"100%",objectFit:"contain",maxHeight:280}}/>
                    </div>
                  )}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:2,alignContent:"start"}}>
                    {[["Instagram",sel.instagram],["TikTok",sel.tiktok||"—"],["Follower",parseInt(sel.followers||0).toLocaleString()],["Visualizzazioni",parseInt(sel.views||0).toLocaleString()],["Interazioni",parseInt(sel.interactions||0).toLocaleString()],["+Follower 30gg",`+${sel.newFollowers||0}`],["Brand collabs",sel.hasBrandCollabs==="yes"?"Sì":"No"],["Età",sel.age]].map(([k,v])=>(
                      <div key={k} style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:"11px 14px"}}>
                        <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.2em",marginBottom:3}}>{k}</div>
                        <div style={{fontFamily:"var(--fu)",fontSize:13,color:"white"}}>{v}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {[["3 PAROLE COME CREATOR",sel.threeWords],["TIPO DI CONTENUTI",sel.contentType],["COSA TRASMETTE",sel.whatToTransmit],["PERCHÉ EVORΛ",sel.motivation],["COSA GLI PIACE DI EVORΛ",sel.brandLike],["COME INTEGREREBBE EVORΛ",sel.contentIntegration],["IMMAGINE ATLETA EVORΛ",sel.athleteImage],["QUALITÀ VS VENDERE",sel.qualityVsSell],["COSTRUIRE SENZA GUADAGNO IMMEDIATO",sel.buildWithoutEarnings],["REAZIONE CONTENUTO NON PERFORMA",sel.badContentReaction],["SIGNIFICATO RAPPRESENTARE UN BRAND",sel.brandMeaning],["CONTENUTI/MESE",sel.contentPerMonth],["ROUTINE",sel.hasRoutine],["LINEE GUIDA",sel.followsGuidelines],["PRODOTTI ACQUISTATI",sel.boughtProducts],["MIGLIORAMENTI",sel.improvements],["NOTA EXTRA",sel.extra],["DETTAGLI COLLABORAZIONI",sel.brandCollabDetails]].filter(([,v])=>v).map(([k,v])=>(
                  <div key={k} style={{background:"#0a0a0a",border:"1px solid var(--brd)",padding:16,marginBottom:6}}>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.3em",marginBottom:7}}>{k}</div>
                    <p style={{fontFamily:"var(--fb)",fontSize:13,color:"#777",lineHeight:1.8}}>{v}</p>
                  </div>
                ))}

                <div style={{borderTop:"1px solid var(--brd)",paddingTop:22,marginTop:20,display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                  <div>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.3em",marginBottom:7}}>CODICE CREATOR</div>
                    <div style={{display:"flex",gap:7}}>
                      <input value={code} onChange={e=>setCode(e.target.value)} placeholder="es. MARIO10" style={{fontSize:13}}/>
                      <button onClick={()=>upd(sel.id,{creatorCode:code})} style={{background:"#111",border:"1px solid #2a2a2a",color:"#555",padding:"10px 14px",fontFamily:"var(--fu)",fontSize:10,letterSpacing:"0.1em",cursor:"pointer",whiteSpace:"nowrap"}}>SALVA</button>
                    </div>
                    {sel.creatorCode&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"#6a9a7a",marginTop:5,letterSpacing:"0.12em"}}>✓ {sel.creatorCode}</div>}
                  </div>
                  <div>
                    <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.3em",marginBottom:7}}>STATO</div>
                    <div style={{display:"flex",gap:3}}>
                      {[["new","NUOVA","#2a2a2a"],["review","REVIEW","var(--gold)"],["approved","OK","#1a4a1a"],["rejected","NO","#4a1a1a"]].map(([s,l,c])=>(
                        <button key={s} onClick={()=>upd(sel.id,{status:s})} style={{flex:1,padding:"9px 4px",fontFamily:"var(--fu)",fontSize:8,letterSpacing:"0.08em",textTransform:"uppercase",cursor:"pointer",background:sel.status===s?c:"#0d0d0d",border:`1px solid ${sel.status===s?c:"#1a1a1a"}`,color:sel.status===s?"white":"#3a3a3a",transition:"all .2s"}}>{l}</button>
                      ))}
                    </div>
                  </div>
                </div>

                <div style={{marginTop:14}}>
                  <div style={{fontFamily:"var(--fu)",fontSize:9,color:"#2a2a2a",letterSpacing:"0.3em",marginBottom:7}}>NOTE INTERNE</div>
                  <textarea value={note} onChange={e=>setNote(e.target.value)} rows={4} placeholder="Note riservate al team EVORΛ..." style={{fontSize:13}}/>
                  <div style={{display:"flex",justifyContent:"space-between",marginTop:9}}>
                    <Btn onClick={()=>upd(sel.id,{notes:note})} style={{padding:"10px 22px",fontSize:11}}>SALVA NOTE</Btn>
                    <button onClick={()=>del(sel.id)} style={{background:"transparent",border:"1px solid #3a1010",color:"#5a2020",padding:"10px 22px",fontFamily:"var(--fu)",fontSize:10,letterSpacing:"0.18em",textTransform:"uppercase",cursor:"pointer"}}>ELIMINA</button>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10}}>
                <div style={{fontFamily:"var(--fd)",fontSize:44,color:"#141414"}}>EVORΛ</div>
                <div style={{fontFamily:"var(--fu)",fontSize:10,color:"#1e1e1e",letterSpacing:"0.3em"}}>SELEZIONA UNA CANDIDATURA</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [view,setView]=useState("landing");
      return(
        <>
          <style>{CSS}</style>
          {view==="landing"&&<Landing onApply={()=>setView("apply")} onAdmin={()=>setView("admin")}/>}
          {view==="apply"&&<ApplicationForm onBack={()=>setView("landing")}/>}
          {view==="admin"&&<AdminPanel onBack={()=>setView("landing")}/>}
        </>
      );
    }
    ReactDOM.render(<App/>,document.getElementById("root"));
  </script>
</body>
</html>
