<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0E">
<meta name="description" content="EVORΛ COLLECTIVE — il Partner Program EVORΛ dedicato a creator, coach e personalità del mondo fitness.">
<title>EVORΛ COLLECTIVE — Partner Program</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Questrial&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --red:#B22222; --red-hi:#cc2a2a; --red-dim:#7d1818;
  --bg:#0E0E0E; --bg-2:#141414; --surf:#191919; --surf-2:#1F1F1F;
  --brd:#2C2C2C; --brd-hi:#3D3D3D;
  --t1:#EFF0F5; --t2:#C4C5CB; --t3:#8E8F96; --t4:#63646B;
  --ok:#27AE60; --warn:#E67E22; --info:#3A7BD5; --bad:#C0392B;
  --fh:'Archivo',system-ui,sans-serif; --fb:'Questrial',system-ui,sans-serif;
  --max:1080px; --maxpanel:1120px;
}

html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--t2);font-family:var(--fb);font-size:16px;line-height:1.6;overflow-x:hidden;width:100%;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;}
::selection{background:var(--red);color:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--brd-hi);border-radius:4px;}

:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- TIPOGRAFIA ---------- */
.h-xl{font-family:var(--fh);font-weight:800;font-size:clamp(32px,7vw,64px);line-height:1.02;letter-spacing:-0.02em;color:var(--t1);}
.h-lg{font-family:var(--fh);font-weight:800;font-size:clamp(26px,4.4vw,40px);line-height:1.08;letter-spacing:-0.015em;color:var(--t1);}
.h-md{font-family:var(--fh);font-weight:700;font-size:clamp(20px,3vw,26px);line-height:1.15;color:var(--t1);}
.h-sm{font-family:var(--fh);font-weight:700;font-size:16px;line-height:1.25;color:var(--t1);}
.eyebrow{font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--red);}
.label-xs{font-family:var(--fh);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);}
.body{font-family:var(--fb);font-size:16px;line-height:1.75;color:var(--t2);}
.body-sm{font-family:var(--fb);font-size:14px;line-height:1.7;color:var(--t3);}
.rule{width:44px;height:2px;background:var(--red);}

/* ---------- LAYOUT ---------- */
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 20px;}
.wrap-narrow{width:100%;max-width:720px;margin:0 auto;padding:0 20px;}
.wrap-panel{width:100%;max-width:var(--maxpanel);margin:0 auto;padding:0 16px;}
.section{padding:72px 0;}
.section-tight{padding:48px 0;}
.divider{height:1px;background:var(--brd);}

/* ---------- NAV ---------- */
.nav{position:sticky;top:0;z-index:900;background:rgba(14,14,14,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd);}
.nav-link{font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);text-decoration:none;transition:color .18s;background:none;border:none;cursor:pointer;padding:6px 2px;}
.nav-link:hover,.nav-link:focus-visible{color:var(--t1);}

/* Header pubblico desktop: logo centrato sopra, sezioni sotto */
.hd{display:none;}
@media(min-width:861px){
  .hd{display:block;padding:16px 0 0;}
  .hd-logo{display:flex;justify-content:center;margin-bottom:12px;}
  .hd-nav{display:flex;justify-content:center;align-items:center;gap:32px;padding-bottom:12px;}
}

/* Header pubblico mobile: logo centrato + hamburger */
.hm{display:flex;align-items:center;justify-content:center;height:58px;position:relative;}
@media(min-width:861px){.hm{display:none;}}
.hm-burger{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:none;border:none;cursor:pointer;}
.hm-burger span{display:block;width:20px;height:2px;background:var(--t2);transition:transform .25s,opacity .2s;}
.hm-burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hm-burger[aria-expanded="true"] span:nth-child(2){opacity:0;}
.hm-burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.hm-panel{border-top:1px solid var(--brd);background:var(--bg);overflow:hidden;max-height:0;transition:max-height .28s ease;}
.hm-panel.open{max-height:340px;}
.hm-item{display:block;width:100%;text-align:left;padding:16px 20px;border-bottom:1px solid var(--brd);background:none;border-left:none;border-right:none;border-top:none;color:var(--t2);font-family:var(--fh);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.hm-item:active{background:var(--surf);}

/* Compensa l'header fisso quando si salta a una sezione */
section[id]{scroll-margin-top:120px;}
@media(max-width:860px){section[id]{scroll-margin-top:72px;}}

/* ---------- BOTTONI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fh);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:16px 30px;border:1px solid transparent;cursor:pointer;transition:all .18s;text-decoration:none;min-height:48px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--red-hi);}
.btn-ghost{background:transparent;border-color:var(--brd-hi);color:var(--t2);}
.btn-ghost:hover:not(:disabled){border-color:var(--t3);color:var(--t1);}
.btn-sm{padding:9px 16px;font-size:10px;letter-spacing:.14em;min-height:36px;}
.btn-danger{background:transparent;border-color:var(--red-dim);color:#D46A6A;}
.btn-danger:hover{background:rgba(178,34,34,.12);}

/* ---------- CARD ---------- */
.card{background:var(--surf);border:1px solid var(--brd);padding:22px;}
.card-hover{transition:border-color .25s;}
.card-hover:hover{border-color:var(--brd-hi);}
.panel{background:var(--surf);border:1px solid var(--brd);}

/* ---------- FORM ---------- */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.field-label{font-family:var(--fh);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);line-height:1.4;}
.field-req{color:var(--red);}
.field-hint{font-family:var(--fb);font-size:13px;color:var(--t4);line-height:1.5;}
.field-err{font-family:var(--fb);font-size:13px;color:#E06666;}
input,textarea,select{width:100%;background:var(--bg-2);border:1px solid var(--brd);color:var(--t1);padding:14px 15px;font-size:16px;font-family:var(--fb);outline:none;transition:border-color .18s;border-radius:0;}
input:focus,textarea:focus,select:focus{border-color:var(--red);}
input::placeholder,textarea::placeholder{color:var(--t4);}
input[aria-invalid="true"],textarea[aria-invalid="true"],select[aria-invalid="true"]{border-color:#B03A3A;}
textarea{resize:vertical;min-height:110px;line-height:1.65;}
select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px;}
select option{background:var(--surf-2);color:var(--t1);}
.counter{font-family:var(--fh);font-size:11px;letter-spacing:.08em;color:var(--t4);text-align:right;}

.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-family:var(--fh);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;background:var(--bg-2);border:1px solid var(--brd);color:var(--t3);cursor:pointer;transition:all .16s;min-height:44px;}
.chip:hover{border-color:var(--brd-hi);color:var(--t2);}
.chip-on{background:var(--red);border-color:var(--red);color:#fff;}

.check{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:14px;border:1px solid var(--brd);background:var(--bg-2);transition:border-color .18s;}
.check:hover{border-color:var(--brd-hi);}
.check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--red);margin-top:1px;cursor:pointer;}
.check span{font-family:var(--fb);font-size:14px;line-height:1.6;color:var(--t2);}

/* ---------- STEPS ---------- */
.steps{display:flex;gap:4px;margin-bottom:8px;}
.step-seg{flex:1;height:3px;background:var(--brd);transition:background .3s;}
.step-seg.done{background:var(--red);}
.step-meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:26px;}

/* ---------- UPLOAD ---------- */
.drop{border:2px dashed var(--brd-hi);background:var(--bg-2);padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;transition:border-color .2s,background .2s;}
.drop.over{border-color:var(--red);background:rgba(178,34,34,.06);}
.drop.err{border-color:#B03A3A;}
.file-btn{display:block;width:100%;text-align:center;padding:14px;background:var(--surf-2);border:1px solid var(--brd);color:var(--t2);font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .18s;min-height:48px;}
.file-btn:hover{border-color:var(--brd-hi);color:var(--t1);}
.status-box{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--brd);background:var(--bg-2);}
.spinner{width:16px;height:16px;border:2px solid var(--brd-hi);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;margin-top:2px;}

/* ---------- BADGE ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--fh);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border:1px solid;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ---------- ADMIN ---------- */
.admin-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.admin-bar{border-bottom:1px solid var(--brd);background:var(--bg-2);flex-shrink:0;}
.admin-bar-in{display:flex;align-items:center;justify-content:space-between;height:56px;gap:10px;}
.tabs{display:flex;border-bottom:1px solid var(--brd);background:var(--bg-2);overflow-x:auto;}
.tab{padding:13px 18px;font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;color:var(--t4);cursor:pointer;white-space:nowrap;transition:all .18s;}
.tab:hover{color:var(--t2);}
.tab-on{color:var(--t1);border-bottom-color:var(--red);}

.stat{padding:12px 10px;border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);text-align:center;cursor:pointer;transition:background .18s;background:none;}
.stat:hover{background:var(--surf);}
.stat-on{background:var(--surf-2);}
.stat-n{font-family:var(--fh);font-weight:800;font-size:22px;line-height:1;}
.stat-l{font-family:var(--fh);font-weight:500;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t4);margin-top:4px;line-height:1.3;}

.row{border-bottom:1px solid var(--brd);cursor:pointer;transition:background .15s;background:none;width:100%;text-align:left;display:block;border-left:3px solid transparent;}
.row:hover{background:var(--surf);}
.metric-cell{text-align:center;min-width:0;}
.metric-v{font-family:var(--fh);font-weight:700;font-size:14px;line-height:1.1;}
.metric-l{font-family:var(--fh);font-weight:500;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--t4);margin-bottom:3px;}

.detail-block{background:var(--bg-2);border:1px solid var(--brd);padding:16px;margin-bottom:8px;}
.detail-q{font-family:var(--fh);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;}
.detail-a{font-family:var(--fb);font-size:15px;line-height:1.8;color:var(--t2);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;}
.kv{background:var(--surf);border:1px solid var(--brd);padding:11px 14px;min-width:0;}
.kv-k{font-family:var(--fh);font-weight:500;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t4);margin-bottom:4px;}
.kv-v{font-family:var(--fh);font-weight:700;font-size:14px;color:var(--t1);word-break:break-word;}

.rate-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--brd);flex-wrap:wrap;}
.rate-btns{display:flex;gap:4px;}
.rate-b{width:36px;height:36px;background:var(--bg-2);border:1px solid var(--brd);color:var(--t4);font-family:var(--fh);font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;}
.rate-b:hover{border-color:var(--brd-hi);color:var(--t2);}
.rate-on{background:var(--red);border-color:var(--red);color:#fff;}

.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid var(--brd-hi);border-radius:50%;color:var(--t4);font-family:var(--fh);font-size:10px;font-weight:700;cursor:help;flex-shrink:0;}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:2px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.g2-gap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3-gap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:720px){
  .g2,.g3,.g2-gap,.g3-gap{grid-template-columns:1fr;}
  .g3-gap{grid-template-columns:1fr;gap:8px;}
  .section{padding:52px 0;}
}
.g3-keep{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}

.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:520px){.pick-grid{grid-template-columns:1fr;}}
.pick{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--brd);cursor:pointer;transition:border-color .18s,background .18s;min-height:48px;}
.pick:hover{border-color:var(--brd-hi);}
.pick.on{background:rgba(178,34,34,.10);border-color:var(--red);}
.pick input{width:18px;height:18px;flex-shrink:0;accent-color:var(--red);cursor:pointer;margin:0;}
.pick span{font-family:var(--fh);font-weight:600;font-size:13px;color:var(--t2);line-height:1.35;}
.pick.on span{color:var(--t1);}
.kv a{color:var(--info);text-decoration:none;word-break:break-word;}
.kv a:hover{text-decoration:underline;}
.modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .2s ease both;}
.modal{background:var(--bg);border:1px solid var(--brd-hi);width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:28px 24px;position:relative;animation:fadeUp .25s ease both;}
.modal-close{position:absolute;top:12px;right:12px;width:36px;height:36px;background:none;border:1px solid var(--brd);color:var(--t3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .18s,color .18s;}
.modal-close:hover{border-color:var(--t3);color:var(--t1);}
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--brd-hi);color:var(--t3);font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:14px;font-weight:400;line-height:1;background:none;transition:all .18s;flex-shrink:0;}
.info-trigger{display:inline-flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--brd-hi);color:var(--t2);cursor:pointer;padding:11px 16px;font-family:var(--fh);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:all .18s;min-height:44px;text-decoration:none;}
.info-trigger:hover,.info-trigger:focus-visible{color:var(--t1);border-color:var(--red);background:var(--surf);}
.info-trigger:hover .info-btn,.info-trigger:focus-visible .info-btn{border-color:var(--red);color:var(--red);}
.info-trigger:active{background:var(--surf-2);}

/* Upload compatto: riga cliccabile con anteprima piccola */
.upload-compact{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--brd);background:var(--bg-2);cursor:pointer;transition:border-color .18s,background .18s;min-height:64px;}
.upload-compact:hover,.upload-compact.over{border-color:var(--brd-hi);background:var(--surf);}
.upload-compact.done{border-color:var(--brd-hi);}
.upload-compact.err{border-color:#B03A3A;}
.upload-compact .u-thumb{width:44px;height:44px;background:var(--bg);border:1px solid var(--brd);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.upload-compact .u-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.upload-compact .u-plus{width:44px;height:44px;border:1px dashed var(--brd-hi);color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:24px;font-family:var(--fh);font-weight:300;flex-shrink:0;line-height:1;transition:all .18s;}
.upload-compact:hover .u-plus{border-color:var(--red);color:var(--red);}
.upload-compact .u-info{flex:1;min-width:0;}
.upload-compact .u-title{font-family:var(--fh);font-weight:700;font-size:13px;color:var(--t1);letter-spacing:.02em;line-height:1.3;}
.upload-compact .u-sub{font-family:var(--fb);font-size:12px;color:var(--t3);margin-top:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upload-compact .u-check{color:var(--ok);font-size:16px;flex-shrink:0;}
.upload-actions{display:flex;gap:6px;margin-top:6px;}
.upload-actions button{flex:1;}
@media(max-width:520px){.modal{padding:22px 18px;max-height:90vh;}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================================
   1. CONFIGURAZIONE GLOBALE
   Tutto ciò che è brandizzato o soggetto a cambiamento vive qui.
   ========================================================================== */
const BRAND = {
  program:      "EVORΛ COLLECTIVE",
  subtitle:     "Il Partner Program EVORΛ dedicato a creator, coach e personalità del mondo fitness.",

/* ============================================================================
   2. FIRESTORE — collezioni e campi invariati
   ========================================================================== */
const FB = {
  async getApps(){
    const snap = await db.collection("candidature").orderBy("date","desc").get();
    return snap.docs.map(d=>({ id:d.id, ...d.data() }));
  },
  async saveApp(app){
    const {id, ...data} = app;
    await db.collection("candidature").doc(String(id)).set(data);
  },
  async updateApp(id, patch){
    await db.collection("candidature").doc(String(id)).update({ ...patch, updatedAt:new Date().toISOString() });
  },
  async deleteApp(id){
    await db.collection("candidature").doc(String(id)).delete();
  },
  async getSettings(){
    const doc = await db.collection("settings").doc("config").get();
    return doc.exists ? doc.data() : {};
  },
  async saveSettings(data){
    await db.collection("settings").doc("config").set(data, {merge:true});
  },
  async getScoring(){
    const doc = await db.collection("settings").doc("scoring").get();
    return doc.exists ? doc.data() : null;
  },
  async saveScoring(cfg){
    await db.collection("settings").doc("scoring").set(cfg);
  }
};

/* ============================================================================
   2b. AUTENTICAZIONE STAFF
   Il codice viaggia verso il Worker, che lo confronta con i propri secret e
   restituisce un token Firebase contenente il ruolo. Il ruolo arriva quindi
   firmato dal server: modificarlo dal browser non produce alcun effetto,
   perché le regole Firestore leggono il claim del token, non lo stato React.
   ========================================================================== */
const AUTH = {
  async login(code){
    let res;
    try{
      res = await fetch(AUTH_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ code })
      });
    }catch(e){ throw new Error("Servizio di accesso non raggiungibile."); }

    let data = {};
    try{ data = await res.json(); }catch(e){}

    if(res.status===401) throw new Error("Codice non riconosciuto.");
    if(res.status===429) throw new Error("Troppi tentativi. Riprova tra qualche minuto.");
    if(!res.ok || !data.token) throw new Error(data.error || "Accesso non riuscito.");

    await auth.signInWithCustomToken(data.token);
    const t = await auth.currentUser.getIdTokenResult(true);
    const role = t.claims.role;
    if(role!=="admin" && role!=="manager"){
      await auth.signOut();
      throw new Error("Ruolo non valido.");
    }
    localStorage.setItem("evora_login_at", String(Date.now()));
    sessionStorage.setItem("evora_last_role", role);
    return role;
  },

  /** Ruolo corrente letto dal token firmato, mai da uno stato locale. */
  async currentRole(){
    const u = auth.currentUser;
    if(!u) return null;
    const started = parseInt(localStorage.getItem("evora_login_at")||"0",10);
    if(!started || Date.now()-started > SESSION_HOURS*3600*1000){
      await AUTH.logout();
      return null;
    }
    try{
      const t = await u.getIdTokenResult();
      const r = t.claims.role;
      return (r==="admin"||r==="manager") ? r : null;
    }catch(e){
      // Errore di rete o refresh: non sloggo. Il claim precedente resta valido finché il timer non scade.
      console.warn("Verifica ruolo non riuscita, mantengo la sessione:", e);
      return sessionStorage.getItem("evora_last_role") || null;
    }
  },

  async logout(){
    localStorage.removeItem("evora_login_at");
    sessionStorage.removeItem("evora_last_role");
    try{ await auth.signOut(); }catch(e){}
  }
};

/* ============================================================================
   3. OCR — lettura automatica Insights.
   Formato richiesta identico all'originale: NON modificare senza aggiornare
   il Cloudflare Worker.
   ========================================================================== */
const extractInsights = async (base64Image) => {
  const parts = base64Image.split(",");
  const base64Data = parts[1];
  const mediaType = parts[0].split(":")[1].split(";")[0];

  let res;
  try{
    res = await fetch(OCR_PROXY, {
      method:"POST",
      // La chiave Anthropic resta nei secret del Worker: il browser non la vede mai.
      headers:{
        "Content-Type":"application/json",
        "anthropic-version":"2023-06-01"
      },
      body: JSON.stringify({
        model: OCR_MODEL,
        max_tokens: 200,
        messages:[{
          role:"user",
          content:[
            { type:"image", source:{ type:"base64", media_type:mediaType, data:base64Data } },
            { type:"text", text:"Analizza questo screenshot Instagram e classificalo. Rispondi SOLO con questo JSON, senza altro testo:\n{\"screen_type\":\"insights_ok\",\"views\":{\"value\":null,\"visibility\":\"not_visible\"},\"netFollowers\":{\"value\":null,\"visibility\":\"not_visible\"},\"interactions\":{\"value\":null,\"visibility\":\"not_visible\"},\"accountsReached\":{\"value\":null,\"visibility\":\"not_visible\"}}\n\nscreen_type deve essere uno dei tre valori:\n- \"insights_ok\" se la schermata mostra i marker della pagina Insight corretta: titolo \"Insight\" con tabs \"Generale/Contenuti/Pubblico\", oppure \"Tutti i contenuti\", oppure box con \"Follower netti\" e \"Interazioni\", oppure \"Account raggiunti\" o \"Visualizzazioni per tipo di contenuto\". Basta uno o più di questi marker in combinazione coerente.\n- \"dashboard_wrong\" se la schermata mostra il titolo \"Dashboard per professionisti\" insieme a marker come \"Nuovi follower\", \"Contenuti che hai condiviso\", \"I tuoi strumenti\", \"Best practice\", \"Riepilogo mensile\". Questa è la Dashboard iniziale, NON gli Insight dettagliati.\n- \"uncertain\" solo se non ci sono marker sufficienti per decidere (es. schermata generica, ritaglio troppo piccolo).\n\nBasati esclusivamente sul testo che leggi, non sul colore di sfondo (l'app può essere in light o dark mode).\n\nPer i quattro valori numerici — Visualizzazioni, Follower netti, Interazioni, Account raggiunti — value = numero esatto come appare (con separatori e segno +/-), null se non visibile. visibility = \"complete\" se la casella è interamente visibile, \"partial\" se è tagliata, \"not_visible\" se il dato non compare o se screen_type è dashboard_wrong." }
          ]
        }]
      })
    });
  }catch(e){ throw new Error("Connessione non riuscita"); }

  if(!res.ok){
    let msg="Servizio non disponibile";
    try{ const e=await res.json(); msg=(e.error&&e.error.message)||msg; }catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  const raw = data.content[0].text.trim();
  const match = raw.match(/\{[\s\S]*\}/);
  if(!match) throw new Error("Immagine non leggibile: controlla che i quattro dati siano visibili.");
  let parsed;
  try{ parsed = JSON.parse(match[0]); }
  catch(e){ throw new Error("Immagine non leggibile: controlla che i quattro dati siano visibili."); }
  const field = raw_val => {
    if(raw_val===null || raw_val===undefined) return { value:null, visibility:"not_visible" };
    // Il modello potrebbe restituire un oggetto {value, visibility} o un semplice numero/stringa.
    if(typeof raw_val === "object" && raw_val !== null){
      const s = String(raw_val.value===undefined?"":raw_val.value).trim().toLowerCase();
      const vis = String(raw_val.visibility||"complete").toLowerCase();
      if(!s || s==="null" || s==="n/a") return { value:null, visibility:"not_visible" };
      return { value:toNum(raw_val.value), visibility: vis==="partial"?"partial" : vis==="not_visible"?"not_visible":"complete" };
    }
    const s = String(raw_val).trim().toLowerCase();
    if(s==="" || s==="null" || s==="n/a" || s==="-") return { value:null, visibility:"not_visible" };
    return { value:toNum(raw_val), visibility:"complete" };
  };
  const st = String(parsed.screen_type||"").toLowerCase();
  const screenType = (st==="insights_ok" || st==="dashboard_wrong" || st==="uncertain") ? st : "uncertain";
  return {
    screenType:      screenType,
    views:           field(parsed.views),
    netFollowers:    field(parsed.netFollowers),
    interactions:    field(parsed.interactions),
    accountsReached: field(parsed.accountsReached)
  };
};

/* ============================================================================
   5. SOCIAL PERFORMANCE SCORE
   Valuta ESCLUSIVAMENTE i dati numerici Instagram.
   Nessuna analisi delle risposte, nessuna keyword, nessun giudizio automatico.
   ========================================================================== */
const SCORING_VERSION = 2;   // incrementare quando cambiano formule o benchmark predefiniti

const DEFAULT_SCORING = {
  version: SCORING_VERSION,
  // Le visualizzazioni vengono salvate e mostrate ma non entrano nel punteggio.
  weights: { er:45, reach:35, growth:20 },
  levels: [
    {v:"HIGH",    l:"Performance numerica alta",  min:75, c:"#3A7BD5"},
    {v:"GOOD",    l:"Performance numerica buona", min:55, c:"#27AE60"},
    {v:"AVERAGE", l:"Performance numerica media", min:35, c:"#E67E22"},
    {v:"LOW",     l:"Performance numerica bassa", min:0,  c:"#C0392B"}
  ],
  bands: [
    { label:"0–1K",     max:1000,
      er:{avg:3,good:6,excellent:10},    reach:{avg:60,good:120,excellent:250}, growth:{avg:1,good:3,excellent:7} },
    { label:"1K–5K",    max:5000,
      er:{avg:2.5,good:5,excellent:8},   reach:{avg:40,good:80,excellent:160},  growth:{avg:0.5,good:1.5,excellent:4} },
    { label:"5K–20K",   max:20000,
      er:{avg:2,good:4,excellent:7},     reach:{avg:30,good:60,excellent:120},  growth:{avg:0.3,good:1,excellent:3} },
    { label:"20K–100K", max:100000,
      er:{avg:1.5,good:3,excellent:5},   reach:{avg:20,good:40,excellent:80},   growth:{avg:0.15,good:0.5,excellent:1.5} },
    { label:"100K+",    max:Infinity,
      er:{avg:1,good:2,excellent:4},     reach:{avg:15,good:30,excellent:60},   growth:{avg:0.08,good:0.25,excellent:0.8} }
  ]
};

// Normalizza config salvate con lo schema precedente (tiers ELITE/PRO/...).
const normalizeScoring = (cfg) => {
  // Una configurazione salvata con lo schema precedente (formule e benchmark diversi)
  // non viene applicata: si riparte dai valori predefiniti aggiornati.
  // Il documento su Firestore resta invariato finché l'admin non salva di nuovo.
  if(!cfg || cfg.version !== SCORING_VERSION) return JSON.parse(JSON.stringify(DEFAULT_SCORING));
  const out = JSON.parse(JSON.stringify(DEFAULT_SCORING));
  if(cfg.weights) out.weights = { ...out.weights, ...cfg.weights };
  if(Array.isArray(cfg.bands) && cfg.bands.length){
    out.bands = cfg.bands.map((b,i)=>({
      label: b.label || out.bands[i] && out.bands[i].label || ("Fascia "+(i+1)),
      max:   (b.max===null || b.max===undefined) ? Infinity : b.max,
      er:    { ...out.bands[i] ? out.bands[i].er : {},     ...(b.er||{}) },
      reach: { ...out.bands[i] ? out.bands[i].reach : {},  ...(b.reach||{}) },
      growth:{ ...out.bands[i] ? out.bands[i].growth : {}, ...(b.growth||{}) }
    }));
    // Vecchio schema: soglia "poor" invece di "excellent"
    out.bands.forEach(b=>["er","reach","growth"].forEach(m=>{
      if(b[m].excellent===undefined && b[m].good!==undefined) b[m].excellent = b[m].good*2;
      if(b[m].avg===undefined) b[m].avg = (b[m].poor!==undefined ? b[m].poor : 0);
    }));
  }
  if(Array.isArray(cfg.levels) && cfg.levels.length) out.levels = cfg.levels;
  else if(Array.isArray(cfg.tiers) && cfg.tiers.length){
    const byMin = [...cfg.tiers].sort((a,b)=>b.min-a.min);
    out.levels = out.levels.map((lv,i)=> byMin[i] ? { ...lv, min:byMin[i].min } : lv);
  }
  return out;
};

const bandFor = (followers, cfg) =>
  cfg.bands.find(b => followers <= (b.max===null?Infinity:b.max)) || cfg.bands[cfg.bands.length-1];

// 4 livelli: <avg Scarso(0-25) · avg→good Medio(25-50) · good→excellent Buono(50-75) · >excellent Eccellente(75-100)
const normalizeMetric = (value, th) => {
  if(!th || value<=0) return 0;
  const {avg,good,excellent} = th;
  if(value >= excellent) return Math.min(100, 75 + ((value-excellent)/Math.max(excellent,0.01))*25);
  if(value >= good)      return 50 + ((value-good)/Math.max(excellent-good,0.01))*25;
  if(value >= avg)       return 25 + ((value-avg)/Math.max(good-avg,0.01))*25;
  return Math.max(0, (value/Math.max(avg,0.01))*25);
};

const METRIC_GRADES = [
  {min:75, l:"Eccellente", c:"#3A7BD5", bg:"rgba(58,123,213,.12)"},
  {min:50, l:"Buono",      c:"#27AE60", bg:"rgba(39,174,96,.12)"},
  {min:25, l:"Medio",      c:"#E67E22", bg:"rgba(230,126,34,.12)"},
  {min:0,  l:"Scarso",     c:"#C0392B", bg:"rgba(192,57,43,.12)"}
];
const gradeOf = s => METRIC_GRADES.find(g=>s>=g.min) || METRIC_GRADES[3];

/**
 * Calcola il Social Performance Score.
 * Ricalcolato a ogni lettura: modificare i benchmark aggiorna anche i profili storici.
 */
const computeSocial = (data, cfgRaw) => {
  const cfg = cfgRaw || DEFAULT_SCORING;
  const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
  const has = v => !(v===undefined || v===null || v==="");

  const followers    = n(data.followers);
  const views        = n(data.views);
  const interactions = n(data.interactions);
  // Compatibilità con le candidature precedenti:
  // se manca accountsReached si usano le visualizzazioni, se manca netFollowers si usa newFollowers.
  const reached = has(data.accountsReached) ? n(data.accountsReached) : views;
  const net     = has(data.netFollowers)    ? n(data.netFollowers)    : n(data.newFollowers);

  const band   = bandFor(followers, cfg);
  const er     = reached>0   ? (interactions/reached)*100 : 0;   // interazioni / account raggiunti
  const reach  = followers>0 ? (reached/followers)*100    : 0;   // account raggiunti / follower
  const growth = followers>0 ? (net/followers)*100        : 0;   // follower netti / follower

  const erScore     = normalizeMetric(er, band.er);
  const reachScore  = normalizeMetric(reach, band.reach);
  const growthScore = normalizeMetric(Math.max(growth,0), band.growth);

  const w  = cfg.weights;
  const tw = (+w.er||0)+(+w.reach||0)+(+w.growth||0) || 100;
  const socialScore = Math.round((erScore*(+w.er||0) + reachScore*(+w.reach||0) + growthScore*(+w.growth||0)) / tw);

  const level = [...cfg.levels].sort((a,b)=>b.min-a.min).find(l=>socialScore>=l.min) || cfg.levels[cfg.levels.length-1];

  return {
    socialScore,
    erScore:Math.round(erScore), reachScore:Math.round(reachScore), growthScore:Math.round(growthScore),
    er, reach, growth,
    views, reached, net, interactions, followers,
    erGrade:gradeOf(erScore), reachGrade:gradeOf(reachScore), growthGrade:gradeOf(growthScore),
    bandLabel:band.label, band,
    perfLevel:level.v, perfLabel:level.l, perfColor:level.c
  };
};

/**
 * Normalizza qualunque cosa scriva il candidato in { handle, url }.
 * Accetta @nome, nome, URL con o senza https, con o senza www, con o senza slash finali.
 * Se il valore non riconduce a un handle valido restituisce {handle:"", url:""}.
 */
const parseSocial = (raw, network) => {
  let s = String(raw||"").trim();
  if(!s) return { handle:"", url:"" };
  try{
    if(/^https?:\/\//i.test(s) || /^(www\.)?(instagram|tiktok)\.com/i.test(s)){
      if(!/^https?:\/\//i.test(s)) s = "https://" + s;
      const u = new URL(s);
      const first = u.pathname.split("/").filter(Boolean)[0] || "";
      s = first.replace(/^@+/,"");
    }
  }catch(e){ /* non è un URL, va bene */ }
  const h = s.replace(/^@+/,"").replace(/[^A-Za-z0-9._]/g,"");
  if(!h) return { handle:"", url:"" };
  const url = network==="tiktok"
    ? "https://www.tiktok.com/@"+h
    : "https://www.instagram.com/"+h+"/";
  return { handle:h, url:url };
};

/** Sfugge < > & per non spezzare Telegram in HTML mode. */
const escTg = v => String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/**
 * Converte un valore letto dallo screenshot in numero intero.
 * Gestisce: 3.648 · 3,648 · 1.234.567 · +5 · -3 · 1,2K · 3,6 Mln
 */
const toNum = (raw) => {
  if(raw===null || raw===undefined) return 0;
  if(typeof raw==="number") return Number.isFinite(raw) ? Math.round(raw) : 0;
  let s = String(raw).trim().toLowerCase().replace(/\s+/g,"");
  if(!s) return 0;
  const sign = s.charAt(0)==="-" ? -1 : 1;
  s = s.replace(/^[+-]/,"");
  let mult = 1;
  if(/(mln|mio|m)$/.test(s)){ mult = 1e6; s = s.replace(/(mln|mio|m)$/,""); }
  else if(/(mila|k)$/.test(s)){ mult = 1e3; s = s.replace(/(mila|k)$/,""); }
  s = s.replace(/[^0-9.,]/g,"");
  if(!s) return 0;
  let value;
  if(mult>1){
    value = parseFloat(s.replace(",",".")) || 0;
  }else{
    const parts = s.split(/[.,]/);
    if(parts.length===1) value = parseFloat(parts[0]) || 0;
    else if(parts[parts.length-1].length===3) value = parseFloat(parts.join("")) || 0;
    else if(parts.length===2) value = parseFloat(parts[0]+"."+parts[1]) || 0;
    else value = parseFloat(parts.join("")) || 0;
  }
  return Math.round(sign * value * mult);
};

/**
 * Unisce i dati letti da due screenshot.
 * - Ogni campo è null quando non è visibile: null non sovrascrive un numero valido.
 * - Se entrambi gli screenshot forniscono un valore, si tiene quello del primo
 *   e si segnala il conflitto per una verifica manuale.
 * - Nessun campo viene sommato: le due immagini mostrano finestre diverse dello stesso dato.
 */
/**
 * Unisce i dati letti da due screenshot con logica di priorità:
 * 1. Un valore "complete" ha la precedenza su uno "partial"
 * 2. Se il valore più corto è l'inizio o la fine del più lungo → lettura parziale, usa il più lungo
 * 3. Se entrambi sono "complete" e diversi → vero conflitto, segnalato all'utente
 * 4. null non sovrascrive mai un numero valido
 */
const isPartialOf = (shorter, longer) => {
  // Controlla se il numero più corto è un prefisso o suffisso del più lungo,
  // come accade quando una casella dello screenshot è tagliata.
  // Esclude i casi in cui i due numeri sono vicini e la differenza di cifre è solo 1
  // con un valore corto di 2+ cifre: 14→145 potrebbe essere un dato reale diverso.
  if(shorter===null || longer===null) return false;
  const s = String(Math.abs(shorter));
  const l = String(Math.abs(longer));
  if(s.length >= l.length) return false;
  const match = l.startsWith(s) || l.endsWith(s);
  if(!match) return false;
  // Singola cifra troncata (1→14, 4→48): sempre plausibile
  if(s.length === 1) return true;
  // Differenza di 2+ cifre (14→1440): chiaramente parziale
  if(l.length - s.length >= 2) return true;
  // Differenza di esattamente 1 cifra con s.length >= 2 (14→144, 82→823):
  // plausibile come taglio ma potrebbe essere ambiguo — accettiamolo
  // perché il caso "diversi di una cifra, non correlati" (tipo 14→145) è raro
  // e comunque in quel caso isPartialOf sarebbe true solo se 14 è prefisso di 145,
  // che è vero: 145 inizia con 14. Ma 14 partial + 145 complete → merge usa 145,
  // che è il comportamento corretto.
  return true;
};

const mergeInsights = (a, b) => {
  a = a || {}; b = b || {};
  const merged = {};
  const conflicts = [];
  const KEYS = ["views","netFollowers","interactions","accountsReached"];

  KEYS.forEach(k => {
    const fa = a[k] || { value:null, visibility:"not_visible" };
    const fb = b[k] || { value:null, visibility:"not_visible" };
    const va = fa.value, vb = fb.value;
    const visA = fa.visibility || "not_visible";
    const visB = fb.visibility || "not_visible";
    const okA = va !== null && va !== undefined;
    const okB = vb !== null && vb !== undefined;

    if(!okA && !okB){
      merged[k] = { value:null, visibility:"not_visible" };
    } else if(okA && !okB){
      merged[k] = fa;
    } else if(!okA && okB){
      merged[k] = fb;
    } else if(Number(va) === Number(vb)){
      // Stesso valore: usa quello con visibility migliore
      merged[k] = visA === "complete" ? fa : fb;
    } else {
      // Valori diversi: applica la logica partial
      const shorter = Math.abs(va) < Math.abs(vb) ? va : vb;
      const longer  = Math.abs(va) < Math.abs(vb) ? vb : va;
      const shorterVis = Math.abs(va) < Math.abs(vb) ? visA : visB;
      const longerVis  = Math.abs(va) < Math.abs(vb) ? visB : visA;
      const longerField = Math.abs(va) < Math.abs(vb) ? fb : fa;

      if(isPartialOf(shorter, longer)){
        // Il più corto è una lettura parziale del più lungo → usa il completo
        merged[k] = longerField;
      } else if(visA === "partial" && visB === "complete"){
        merged[k] = fb;
      } else if(visB === "partial" && visA === "complete"){
        merged[k] = fa;
      } else {
        // Vero conflitto: entrambi complete o impossibile decidere
        merged[k] = fa; // terreno neutro: tiene il primo, ma segnala
        conflicts.push({ key:k, valueA:va, visA, valueB:vb, visB });
      }
    }
  });

  return { merged, conflicts };
};

const readFileAsDataURL = file => new Promise((resolve,reject)=>{
  const r = new FileReader();
  r.onload  = e => resolve(e.target.result);
  r.onerror = () => reject(new Error("Impossibile leggere il file."));
  r.readAsDataURL(file);
});

/**
 * Ridimensiona e comprime lo screenshot prima del salvataggio.
 * Senza questo passaggio un'immagine da telefono supera il limite di 1 MiB
 * previsto da Firestore per singolo documento e il salvataggio viene rifiutato.
 */
const compressImage = dataUrl => new Promise((resolve,reject)=>{
  const img = new Image();
  img.onerror = () => reject(new Error("Immagine non valida."));
  img.onload  = () => {
    let w = img.naturalWidth, h = img.naturalHeight;
    if(!w || !h) return reject(new Error("Immagine non valida."));
    const scale = w > IMG_MAX_WIDTH ? IMG_MAX_WIDTH/w : 1;
    w = Math.round(w*scale); h = Math.round(h*scale);
    const draw = (cw,ch,q) => {
      const c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#0E0E0E"; ctx.fillRect(0,0,cw,ch);
      ctx.drawImage(img,0,0,cw,ch);
      return c.toDataURL("image/jpeg", q);
    };
    let q = 0.82, out = draw(w,h,q);
    while(out.length > MAX_STORED_BYTES && q > 0.4){ q -= 0.1; out = draw(w,h,q); }
    while(out.length > MAX_STORED_BYTES && w > 640){
      w = Math.round(w*0.85); h = Math.round(h*0.85); out = draw(w,h,q);
    }
    if(out.length > MAX_STORED_BYTES) return reject(new Error("Immagine troppo grande: riprova con uno screenshot più leggero."));
    resolve(out);
  };
  img.src = dataUrl;
});
