// ── OCR ───────────────────────────────────────────────────────────────────────
const extractInsights = async (base64Image, apiKey) => {
  if (!apiKey) throw new Error("API key non configurata — vai in Impostazioni");
  const parts = base64Image.split(",");
  const base64Data = parts[1];
  const mediaType = parts[0].split(":")[1].split(";")[0];

  const PROXY = "https://throbbing-feather-957f.francesco87-mazzeo.workers.dev";

  let res;
  try {
    res = await fetch(PROXY, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 200,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
            { type: "text", text: "Guarda questo screenshot Instagram Insights. Estrai i numeri. Rispondi SOLO con questo JSON: {\"views\":NUMERO,\"interactions\":NUMERO,\"newFollowers\":NUMERO}. Usa 0 se non visibile. SOLO JSON nient'altro." }
          ]
        }]
      })
    });
  } catch(e) { throw new Error("Errore di rete: " + e.message); }

  if (!res.ok) {
    let msg = "Errore API";
    try { const e = await res.json(); msg = e.error?.message || msg; } catch(e) {}
    throw new Error(msg);
  }
  const data = await res.json();
  const raw = data.content[0].text.trim();
  const match = raw.match(/\{[^}]+\}/);
  if (!match) throw new Error("Risposta non valida");
  return JSON.parse(match[0]);
};

// ── DEFAULT SCORING CONFIG (modificabile dall'admin) ─────────────────────────
const DEFAULT_SCORING = {
  // Pesi metriche (devono sommare 100)
  weights: { er: 40, reach: 35, growth: 25 },

  // Tier label
  tiers: [
    { name:"ELITE",   min:75, color:"#B22222", label:"Priorità Assoluta" },
    { name:"PRO",     min:55, color:"#c0a060", label:"Alta Priorità" },
    { name:"RISING",  min:35, color:"#6a9a7a", label:"Da Monitorare" },
    { name:"PENDING", min:0,  color:"#666666", label:"In Attesa" }
  ],

  // Benchmark per fascia follower
  // avg = min per MEDIO, good = min per BUONO, excellent = min per ECCELLENTE
  // Sotto avg = SCARSO · avg→good = MEDIO · good→excellent = BUONO · sopra excellent = ECCELLENTE
  bands: [
    {
      label:"0–1K", max:1000,
      er:    { avg:3,   good:6,   excellent:10  },
      reach: { avg:50,  good:100, excellent:200 },
      growth:{ avg:1,   good:3,   excellent:8   }
    },
    {
      label:"1K–5K", max:5000,
      er:    { avg:2.5, good:5,   excellent:8   },
      reach: { avg:40,  good:80,  excellent:150 },
      growth:{ avg:0.8, good:2,   excellent:5   }
    },
    {
      label:"5K–20K", max:20000,
      er:    { avg:2,   good:4,   excellent:7   },
      reach: { avg:30,  good:60,  excellent:120 },
      growth:{ avg:0.5, good:1.5, excellent:4   }
    },
    {
      label:"20K–100K", max:100000,
      er:    { avg:1.5, good:3,   excellent:5   },
      reach: { avg:20,  good:40,  excellent:80  },
      growth:{ avg:0.3, good:1,   excellent:2.5 }
    },
    {
      label:"100K+", max:Infinity,
      er:    { avg:1,   good:2,   excellent:4   },
      reach: { avg:15,  good:30,  excellent:60  },
      growth:{ avg:0.2, good:0.5, excellent:1.5 }
    }
  ]
};

// Carica config da Firebase (con fallback a default)
let _scoringConfig = null;
const getScoringConfig = async () => {
  if (_scoringConfig) return _scoringConfig;
  try {
    const doc = await db.collection("settings").doc("scoring").get();
    _scoringConfig = doc.exists ? doc.data() : DEFAULT_SCORING;
  } catch(e) {
    _scoringConfig = DEFAULT_SCORING;
  }
  return _scoringConfig;
};
const invalidateScoringCache = () => { _scoringConfig = null; };

// Normalizza metrica 0-100
// < avg=Scarso(0-25) · avg→good=Medio(25-50) · good→excellent=Buono(50-75) · >excellent=Eccellente(75-100)
const normalizeMetric = (value, band, metric) => {
  const b = band[metric];
  if (value <= 0) return 0;
  if (value >= b.excellent) return 75 + Math.min(((value - b.excellent) / Math.max(b.excellent, 1)) * 25, 25);
  if (value >= b.good)      return 50 + ((value - b.good)      / (b.excellent - b.good))      * 25;
  if (value >= b.avg)       return 25 + ((value - b.avg)       / (b.good      - b.avg))       * 25;
  return Math.max(0, (value / Math.max(b.avg, 0.01)) * 25);
};

// Scoring sincrono (usa config passata come parametro)
const scoreCandidate = (data, config = DEFAULT_SCORING) => {
  const followers    = parseInt(data.followers)    || 0;
  const views        = parseInt(data.views)        || 0;
  const interactions = parseInt(data.interactions) || 0;
  const newFollowers = parseInt(data.newFollowers) || 0;

  // 1. Trova la fascia follower
  const band = config.bands.find(b => followers <= b.max) || config.bands[config.bands.length - 1];

  // 2. Calcola le metriche
  const er     = views > 0        ? (interactions / views)       * 100 : 0;
  const reach  = followers > 0    ? (views / followers)          * 100 : 0;
  const growth = followers > 0    ? (newFollowers / followers)   * 100 : 0;

  // 3. Normalizza 0-100 per fascia
  const erScore     = normalizeMetric(er,     band, "er");
  const reachScore  = normalizeMetric(reach,  band, "reach");
  const growthScore = normalizeMetric(growth, band, "growth");

  // 4. Score numerico pesato (metriche)
  const w = config.weights;
  const numericScore = (erScore * w.er + reachScore * w.reach + growthScore * w.growth) / 100;

  // 5. Score qualitativo risposte (max 30 punti — peso separato)
  const kf = [data.motivation, data.contentIntegration, data.brandMeaning, data.qualityVsSell];
  let qs = 0;
  kf.forEach(f => { const l=(f||"").length; if(l>300)qs+=6; else if(l>150)qs+=4; else if(l>50)qs+=1; });
  ["identità","rappresentare","costruire","disciplina","autenticità","valori","reale","genuino","evoluz","brand"].forEach(k => { if(kf.join(" ").toLowerCase().includes(k)) qs++; });
  const qualScore = Math.min(qs, 30);

  // 6. Score finale: 70% metriche + 30% qualità risposte
  const finalScore = Math.min(Math.round(numericScore * 0.7 + qualScore), 100);

  // 7. Label metriche
  const getLabel = (score) => score >= 75 ? "Eccellente" : score >= 50 ? "Buono" : score >= 25 ? "Medio" : "Scarso";

  // 8. Reasons
  const reasons = [
    `Fascia: ${band.label}`,
    `ER ${er.toFixed(1)}% — ${getLabel(erScore)}`,
    `Reach ${reach.toFixed(0)}% — ${getLabel(reachScore)}`,
    `Growth ${growth.toFixed(2)}% — ${getLabel(growthScore)}`,
  ];
  if (data.hasBrandCollabs === "yes") reasons.push("Exp. brand collabs");
  if (qualScore >= 22) reasons.push("Risposte eccellenti");
  else if (qualScore >= 14) reasons.push("Risposte solide");

  // 9. Tier
  const tierDef = [...config.tiers].sort((a,b) => b.min - a.min).find(t => finalScore >= t.min) || config.tiers[config.tiers.length - 1];

  return {
    score: finalScore,
    tier: tierDef.name,
    tierColor: tierDef.color,
    tierLabel: tierDef.label,
    reasons,
    erScore: Math.round(erScore),
    reachScore: Math.round(reachScore),
    growthScore: Math.round(growthScore),
    qualScore,
    bandLabel: band.label,
    erReach: er.toFixed(2),
    reachRate: reach.toFixed(1),
    growthRate: growth.toFixed(2)
  };
};

            {[["<5%","Tasso di accettazione"],["3","Livelli di partnership"],["0 DM","Solo candidature formali"]].map(([n,l])=>(
              <div key={n} style={{textAlign:"center"}}><div style={{fontFamily:"'Archivo',sans-serif",fontSize:38,color:"var(--red)",lineHeight:1,fontWeight:900}}>{n}</div><div style={{fontFamily:"'Questrial',sans-serif",fontSize:12,color:"var(--t3)",letterSpacing:"0.1em",textTransform:"uppercase",marginTop:4}}>{l}</div></div>
            ))}
          </div>
        </div>
      </section>

      <section id="filosofia" className="section">
        <div className="inner"><div className="g2">
          <div>
            <span className="sec-tag">Filosofia del Programma</span>
            <h2 className="sec-title" style={{fontSize:"clamp(34px,5vw,60px)"}}>NON VENDIAMO.<br/><span style={{color:"#333"}}>RAPPRESENTIAMO.</span></h2>
            <div className="redline"/>
            <p className="body-text" style={{marginBottom:12}}>EVORΛ è nata dalla disciplina, non dal marketing. Il nostro programma non è un canale pubblicitario — è una rete di persone che condividono una visione.</p>
            <p className="body-text">Cerchiamo atleti e creator che amplificano un messaggio genuino: evoluzione continua, performance reale, mentalità costruita ogni giorno.</p>
          </div>
          <div className="g22">
            {[["DISCIPLINA","Non si tratta di quanto sei grande oggi, ma di quanto lavori ogni giorno."],["AUTENTICITÀ","Il pubblico sente quando parli di un prodotto che non usi davvero."],["CRESCITA","Cresciamo insieme. Il tuo successo potenzia il brand."],["STANDARD","Lavoriamo con chi tiene alta la qualità. Sempre."]].map(([t,d])=>(
              <div key={t} className="card"><div className="card-title">{t}</div><div className="card-body">{d}</div></div>
            ))}
          </div>
        </div></div>
      </section>

      <section id="livelli" className="section" style={{background:"var(--deep)"}}>
        <div className="inner">
          <div style={{textAlign:"center",marginBottom:48}}><span className="sec-tag">Struttura del Programma</span><h2 className="sec-title" style={{fontSize:"clamp(30px,5vw,52px)"}}>TRE LIVELLI. UN SISTEMA.</h2></div>
          <div className="g3">
            {[{tier:"AFFILIATO",n:"01",color:"#888",desc:"Primo ingresso nel network EVORΛ. Codici sconto personalizzati e commissioni sulle vendite.",perks:["Codice creator dedicato","Commissione 10%","Kit digitale EVORΛ","Accesso contenuti B2B","Newsletter interna"]},{tier:"AMBASSADOR",n:"02",color:"var(--gold)",desc:"Profili selezionati con audience consolidata e alta coerenza con i valori EVORΛ.",perks:["Tutto da Affiliato +","Prodotti mensili","Commissione 15%","Co-creazione contenuti","Early access drop"]},{tier:"ELITE",n:"03",color:"var(--red)",desc:"Il livello più alto. Facce del brand EVORΛ. Collaborazione strategica e contratti formali.",perks:["Tutto da Ambassador +","Contratto formale","Campagne dedicate","Revenue sharing","Advisory role"]}].map((l,i)=>(
              <div key={l.tier} style={{background:i===1?"#0e0e0e":"var(--surf)",border:`1px solid ${i===1?l.color+"55":"var(--brd)"}`,padding:28,position:"relative",overflow:"hidden"}}>
                {i===1&&<div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(to right,transparent,var(--gold),transparent)`}}/>}
                <div style={{fontFamily:"var(--fd)",fontSize:56,color:l.color+"15",position:"absolute",right:8,top:-2,lineHeight:1,pointerEvents:"none"}}>{l.n}</div>
                <Tag color={l.color}>{l.tier}</Tag>
                <p style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",lineHeight:1.8,margin:"14px 0 18px"}}>{l.desc}</p>
                <div style={{borderTop:"1px solid var(--brd)",paddingTop:14}}>
                  {l.perks.map(p=><div key={p} style={{display:"flex",alignItems:"center",gap:9,marginBottom:7}}><div style={{width:3,height:3,background:l.color,flexShrink:0,borderRadius:"50%"}}/><span style={{fontFamily:"var(--fu)",fontSize:12,color:"var(--t2)"}}>{p}</span></div>)}
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section id="requisiti" className="section">
        <div className="inner"><div className="g2">
          <div>
            <span className="sec-tag">Criteri di Selezione</span>
            <h2 className="sec-title" style={{fontSize:"clamp(30px,4vw,50px)"}}>COSA<br/>VALUTIAMO.</h2>
            <div className="redline"/>
            <p className="body-text">Ogni candidatura viene analizzata manualmente. Non esistono criteri automatici che garantiscono l'accesso.</p>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:2}}>
            {[["Audience reale","Non contano i follower comprati. Contiamo chi ti ascolta davvero."],["Coerenza verticale","Il tuo contenuto deve essere radicato in fitness, performance, lifestyle."],["Qualità produzione","Non serve uno studio. Serve uno standard."],["Identità personale","Chi sei fuori dal telefono è più importante di quante stories fai."],["Mentalità costruttiva","Cerchiamo chi pensa in termini di brand building, non di guadagno immediato."]].map(([t,d])=>(
              <div key={t} style={{padding:"16px 20px",border:"1px solid var(--brd)",display:"flex",gap:14,transition:"all .3s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor="#444";e.currentTarget.style.background="#0c0c0c";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--brd)";e.currentTarget.style.background="transparent";}}>
                <div style={{width:2,background:"var(--red)",flexShrink:0,alignSelf:"stretch"}}/>
                <div><div style={{fontFamily:"var(--fu)",fontSize:13,color:"var(--t1)",marginBottom:4}}>{t}</div><div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t2)",lineHeight:1.75}}>{d}</div></div>
              </div>
            ))}
          </div>
        </div></div>
      </section>

      <section id="apply" className="section" style={{textAlign:"center",background:"linear-gradient(to bottom,var(--black),#130303,var(--black))"}}>
        <div className="inner">
          <span className="sec-tag">Application Aperta</span>
          <h2 className="sec-title" style={{fontSize:"clamp(40px,8vw,90px)",margin:"20px 0 24px"}}>SEI PRONTO<br/><span style={{color:"var(--red)"}}>A PROVARTI?</span></h2>
          <p style={{fontFamily:"var(--fb)",fontSize:15,color:"var(--t2)",maxWidth:420,margin:"0 auto 36px",lineHeight:1.9}}>La candidatura è aperta. La selezione è continuativa.<br/>Compila il form con precisione — è la tua unica prima impressione.</p>
          <button className="btn-red" onClick={onApply} style={{padding:"18px 52px",fontSize:13,letterSpacing:"0.4em"}}>INVIA CANDIDATURA</button>
        </div>
      </section>

      <footer style={{padding:"36px 20px",borderTop:"1px solid var(--brd)",display:"flex",flexDirection:"column",alignItems:"center",gap:12,textAlign:"center"}}>
        <Logo size={20}/>
        <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.18em"}}>© 2025 EVORΛ · ATHLETES PROGRAM</div>
      </footer>

  );
}

// ── FORM ──────────────────────────────────────────────────────────────────────
const STEPS=["CHI SEI","SOCIAL & NUMERI","POSIZIONAMENTO","FIT CON EVORΛ","MENTALITÀ","IMPEGNO & EXTRA"];
const emptyForm={fullName:"",age:"",city:"",email:"",instagram:"",followers:"",tiktokFollowers:"",screenshotData:null,screenshotName:"",views:"",interactions:"",newFollowers:"",tiktok:"",hasBrandCollabs:"",brandCollabDetails:"",threeWords:"",contentType:"",whatToTransmit:"",motivation:"",brandLike:"",contentIntegration:"",athleteImage:"",qualityVsSell:"",buildWithoutEarnings:"",badContentReaction:"",brandMeaning:"",contentPerMonth:"",hasRoutine:"",followsGuidelines:"",boughtProducts:"",improvements:"",extra:""};

function ApplicationForm({onBack,onAdmin}){
  const [step,setStep]=useState(0);
  const [form,setForm]=useState(emptyForm);
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);
  const [savedId,setSavedId]=useState(null);
  const [ocrStatus,setOcrStatus]=useState("idle");
  const [ocrError,setOcrError]=useState("");
  const [errors,setErrors]=useState({});
  const u=(k,v)=>{ setForm(p=>({...p,[k]:v})); setErrors(p=>({...p,[k]:undefined})); };

  const handleFile=async(e)=>{
    const f=e.target.files?.[0]||e.dataTransfer?.files?.[0];
    if(!f||!f.type.startsWith("image/"))return;
    const r=new FileReader();
    r.onload=async(ev)=>{
      const img=ev.target.result;
      u("screenshotData",img); u("screenshotName",f.name);
      setOcrStatus("analyzing"); setOcrError("");
      try{
        const settings=await FB.getSettings();
        const d=await extractInsights(img, settings.apiKey);
        if(d.views)u("views",String(d.views));
        if(d.interactions)u("interactions",String(d.interactions));
        if(d.newFollowers)u("newFollowers",String(d.newFollowers));
        setOcrStatus("done");
      }catch(err){
        setOcrStatus("error");
        setOcrError(err.message||"Errore sconosciuto");
      }
    };
    r.readAsDataURL(f);
  };

  // Validazione per step
  const validateStep=(s)=>{
    const errs={};
    const req=(k,label)=>{ if(!(form[k]||"").trim()) errs[k]=`${label} è obbligatorio`; };
    const emailOk=(v)=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

    if(s===0){
      req("fullName","Nome e cognome");
      req("age","Età");
      req("city","Città");
      if(!form.email.trim()) errs.email="Email è obbligatoria";
      else if(!emailOk(form.email)) errs.email="Inserisci un indirizzo email valido";
    }
    if(s===1){
      req("instagram","Handle Instagram");
      req("followers","Follower Instagram");
      if(!form.screenshotData) errs.screenshotData="Carica lo screenshot Insights";
      req("views","Visualizzazioni");
      req("interactions","Interazioni");
      req("newFollowers","Nuovi follower");
    }
    if(s===2){
      req("threeWords","3 parole");
      req("contentType","Tipo di contenuti");
      req("whatToTransmit","Cosa trasmetti");
      req("hasBrandCollabs","Collaborazioni brand");
      if(form.hasBrandCollabs==="yes") req("brandCollabDetails","Dettagli collaborazioni");
    }
    if(s===3){
      req("motivation","Perché EVORΛ");
      req("brandLike","Cosa ti piace del brand");
      req("contentIntegration","Come integreresti EVORΛ");
      req("athleteImage","Immagine atleta EVORΛ");
    }
    if(s===4){
      req("qualityVsSell","Qualità vs vendere");
      req("buildWithoutEarnings","Lavoro senza guadagno immediato");
      req("badContentReaction","Reazione a contenuto che non performa");
      req("brandMeaning","Cosa significa rappresentare un brand");
    }
    if(s===5){
      req("contentPerMonth","Contenuti al mese");
      req("hasRoutine","Routine di pubblicazione");
      req("followsGuidelines","Linee guida creative");
    }
    return errs;
  };

  const goNext=()=>{
    const errs=validateStep(step);
    if(Object.keys(errs).length>0){ setErrors(errs); window.scrollTo(0,0); return; }
    setErrors({});
    setStep(step+1);
    window.scrollTo(0,0);
  };

  const [saveError,setSaveError]=useState(false);

  const submit=async()=>{
    const errs=validateStep(5);
    if(Object.keys(errs).length>0){ setErrors(errs); return; }
    setSaving(true);
    setSaveError(false);
    try{
      const sc=scoreCandidate(form);
      const id=Date.now();
      const app={...form,...sc,id,date:new Date().toISOString(),status:"new",notes:"",creatorCode:""};
      await FB.saveApp(app);
      setSavedId(id);
      setDone(true);
    }catch(err){
      setSaveError(true);
    }finally{
      setSaving(false);
    }
  };

  // Pagina errore salvataggio
  if(saveError) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--black)",textAlign:"center",padding:24}}>
      <div style={{animation:"fadeUp .6s ease both",maxWidth:460}}>
        <div style={{fontFamily:"var(--fd)",fontSize:72,color:"var(--red)",lineHeight:1,marginBottom:12}}>✗</div>
        <h2 style={{fontFamily:"var(--fd)",fontSize:36,color:"#fff",marginBottom:16,fontWeight:900}}>ERRORE DI INVIO</h2>
        <p style={{fontFamily:"var(--fb)",fontSize:15,color:"var(--t2)",lineHeight:1.9,marginBottom:32}}>
          Non è stato possibile salvare la candidatura.<br/>
          Controlla la connessione e riprova.
        </p>
        <button className="btn-red" onClick={()=>setSaveError(false)} style={{padding:"14px 36px",fontSize:12,marginBottom:12}}>RIPROVA</button>
        <br/>
        <button className="btn-ghost" onClick={onBack} style={{padding:"12px 28px",fontSize:11}}>← TORNA AL SITO</button>
      </div>
    </div>
  );

  // Schermata conferma
  if(done) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--black)",textAlign:"center",padding:24}}>
      <div style={{animation:"fadeUp .8s ease both",maxWidth:480}}>
        <div style={{fontFamily:"var(--fd)",fontSize:72,color:"var(--red)",lineHeight:1,marginBottom:12}}>✓</div>
        <h2 style={{fontFamily:"var(--fd)",fontSize:40,color:"#fff",marginBottom:16,fontWeight:900}}>CANDIDATURA RICEVUTA.</h2>
        <p style={{fontFamily:"var(--fb)",fontSize:15,color:"var(--t2)",lineHeight:1.9,marginBottom:36}}>
          I tuoi dati sono stati registrati correttamente.<br/>
          Il team EVORΛ analizzerà il tuo profilo e ti contatterà entro <strong style={{color:"#fff"}}>7 giorni lavorativi</strong> se sei in linea con i nostri standard.<br/>
          <br/>
          <span style={{fontSize:13,color:"var(--t3)"}}>Non mandare DM — rispettiamo chi rispetta il processo.</span>
        </p>
        <button className="btn-ghost" onClick={onBack}>← TORNA AL SITO</button>
      </div>
    </div>
  );

  const ErrMsg=({k})=>errors[k]?<span style={{fontFamily:"var(--fb)",fontSize:11,color:"var(--red)",marginTop:4,display:"block"}}>⚠ {errors[k]}</span>:null;

  return(
    <div className="form-page">
      <Nav onAdmin={onAdmin} links={false} onBack={onBack}/>
      <div className="form-inner">
        <h1 style={{fontFamily:"var(--fd)",fontSize:"clamp(26px,5vw,44px)",color:"#fff",lineHeight:1,marginBottom:8,fontWeight:900}}>
          ATHLETES APPLICATION
        </h1>
        <div className="steps-bar" style={{marginBottom:32}}>
          {STEPS.map((s,i)=><div key={s} className="step-item">
            <div className="step-line" style={{background:i<=step?"var(--red)":"#222"}}/>
            <div className="step-lbl" style={{color:i===step?"#fff":"#444"}}>{s}</div>
          </div>)}
        </div>

        {/* Nessun banner in alto — errori solo sui singoli campi */}

        {/* ── STEP 0: CHI SEI ── */}
        {step===0&&<div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff",fontWeight:900}}>CHI SEI</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <div>
              <Field label="Nome e cognome" required><input value={form.fullName} onChange={e=>u("fullName",e.target.value)} placeholder="Mario Rossi" style={{borderColor:errors.fullName?"var(--red)":"#333"}}/></Field>
              <ErrMsg k="fullName"/>
            </div>
            <div>
              <Field label="Età" required><input type="number" value={form.age} onChange={e=>u("age",e.target.value)} placeholder="24" style={{borderColor:errors.age?"var(--red)":"#333"}}/></Field>
              <ErrMsg k="age"/>
            </div>
          </div>
          <div>
            <Field label="Città / Paese" required><input value={form.city} onChange={e=>u("city",e.target.value)} placeholder="Milano, Italia" style={{borderColor:errors.city?"var(--red)":"#333"}}/></Field>
            <ErrMsg k="city"/>
          </div>
          <div>
            <Field label="Email" required><input type="email" value={form.email} onChange={e=>u("email",e.target.value)} placeholder="nome@email.com" style={{borderColor:errors.email?"var(--red)":"#333"}}/></Field>
            <ErrMsg k="email"/>
          </div>
        </div>}

        {/* ── STEP 1: SOCIAL & NUMERI ── */}
        {step===1&&<div style={{display:"flex",flexDirection:"column",gap:24,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff",fontWeight:900}}>SOCIAL & NUMERI</h3>

          <div>
            <div style={{fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.4em",color:"var(--red)",textTransform:"uppercase",marginBottom:14,paddingBottom:10,borderBottom:"1px solid #1e1e1e"}}>▸ INSTAGRAM</div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                <div>
                  <Field label="Handle (@username)" required><input value={form.instagram} onChange={e=>u("instagram",e.target.value)} placeholder="@username" style={{borderColor:errors.instagram?"var(--red)":"#333"}}/></Field>
                  <ErrMsg k="instagram"/>
                </div>
                <div>
                  <Field label="Follower" required><input type="number" value={form.followers} onChange={e=>u("followers",e.target.value)} placeholder="es. 25000" style={{borderColor:errors.followers?"var(--red)":"#333"}}/></Field>
                  <ErrMsg k="followers"/>
                </div>
              </div>

              <div>
                <Field label="Screenshot Insights — ultimi 30 giorni" required hint="Trascina l'immagine oppure clicca il pulsante">
                  <div onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor="var(--red)";}}
                    onDragLeave={e=>{e.currentTarget.style.borderColor=errors.screenshotData?"var(--red)":"#333";}}
                    onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor="#333";handleFile(e);}}
                    style={{border:`2px dashed ${errors.screenshotData?"var(--red)":"#333"}`,padding:"24px 20px",textAlign:"center",background:"#090909",transition:"border-color .2s",minHeight:120,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8}}>
                    {form.screenshotData?(
                      <>
                        <img src={form.screenshotData} alt="Insights" style={{maxHeight:160,maxWidth:"100%",objectFit:"contain"}}/>
                        {ocrStatus==="analyzing"&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--gold)"}}>⏳ Lettura automatica in corso...</div>}
                        {ocrStatus==="done"&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"#6a9a7a"}}>✓ Dati estratti automaticamente</div>}
                        {ocrStatus==="error"&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--red)"}}>⚠ {ocrError} — i dati verranno inseriti manualmente</div>}
                      </>
                    ):(
                      <>
                        <div style={{fontSize:32}}>📊</div>
                        <div style={{fontFamily:"var(--fu)",fontSize:12,color:"var(--t2)",letterSpacing:"0.15em"}}>TRASCINA LO SCREENSHOT QUI</div>
                        <div style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t3)"}}>I numeri verranno letti automaticamente</div>
                      </>
                    )}
                  </div>
                  <label style={{display:"block",marginTop:8,padding:"11px",background:"#111",border:"1px solid #333",color:"var(--t2)",fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.2em",textTransform:"uppercase",cursor:"pointer",textAlign:"center"}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor="#555";}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor="#333";}}>
                    {form.screenshotData?"📁 CAMBIA IMMAGINE":"📁 SCEGLI DAL DISPOSITIVO"}
                    <input type="file" accept="image/*" style={{display:"none"}} onChange={handleFile}/>
                  </label>
                </Field>
                <ErrMsg k="screenshotData"/>
              </div>

              {ocrStatus==="analyzing"&&<div className="ocr-box"><div className="spinner"/><div><div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--gold)",letterSpacing:"0.15em"}}>ANALISI IN CORSO...</div></div></div>}

              {/* Dati OCR — nascosti, salvati in background */}
              <div style={{display:"none"}}>
                <input type="number" value={form.views} readOnly/>
                <input type="number" value={form.interactions} readOnly/>
                <input type="number" value={form.newFollowers} readOnly/>
              </div>

              {/* Messaggio errore validazione dati insights */}
              {(errors.views||errors.interactions||errors.newFollowers)&&(
                <div style={{padding:"10px 14px",background:"#1a0808",border:"1px solid var(--red)"}}>
                  <div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--red)",letterSpacing:"0.1em"}}>⚠ Lo screenshot non è stato letto correttamente — ricarica l'immagine o contatta il supporto</div>
                </div>
              )}
            </div>
          </div>

          <div>
            <div style={{fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.4em",color:"var(--t3)",textTransform:"uppercase",marginBottom:14,paddingBottom:10,borderBottom:"1px solid #1e1e1e"}}>▸ TIKTOK <span style={{fontSize:9,color:"var(--t4)"}}>(OPZIONALE)</span></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              <Field label="Handle (@username)"><input value={form.tiktok} onChange={e=>u("tiktok",e.target.value)} placeholder="@username"/></Field>
              <Field label="Follower"><input type="number" value={form.tiktokFollowers} onChange={e=>u("tiktokFollowers",e.target.value)} placeholder="es. 10000"/></Field>
            </div>
          </div>
        </div>}

        {/* ── STEP 2: POSIZIONAMENTO ── */}
        {step===2&&<div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease both"}}>
          <h3 style={{fontFamily:"var(--fd)",fontSize:28,color:"#fff",fontWeight:900}}>POSIZIONAMENTO</h3>
          <div>
            <Field label="Come ti descriveresti in 3 parole come creator?" required>
              <input value={form.threeWords} onChange={e=>u("threeWords",e.target.value)} placeholder="es. Autentico, Diretto, Consistente" style={{borderColor:errors.threeWords?"var(--red)":"#333"}}/>
            </Field><ErrMsg k="threeWords"/>
          </div>
          <div>
            <Field label="Che tipo di contenuti pubblichi principalmente?" required>
              <textarea value={form.contentType} onChange={e=>u("contentType",e.target.value)} rows={4} placeholder="Formato, temi, approccio, frequenza..." style={{borderColor:errors.contentType?"var(--red)":"#333"}}/>
            </Field><ErrMsg k="contentType"/>
          </div>
          <div>
            <Field label="Cosa vuoi trasmettere alle persone che ti seguono?" required>
              <textarea value={form.whatToTransmit} onChange={e=>u("whatToTransmit",e.target.value)} rows={4} placeholder="Qual è il messaggio centrale che porti avanti?" style={{borderColor:errors.whatToTransmit?"var(--red)":"#333"}}/>
            </Field><ErrMsg k="whatToTransmit"/>
          </div>
          <div>
            <Field label="Hai già collaborato con brand fitness?" required>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

  const handleFile=async(e)=>{
    const f=e.target.files?.[0]||e.dataTransfer?.files?.[0];
    if(!f||!f.type.startsWith("image/"))return;
    const r=new FileReader();
    r.onload=async(ev)=>{
      const img=ev.target.result;
      u("screenshotData",img); u("screenshotName",f.name);
      setOcrStatus("analyzing"); setOcrError("");
      try{
        const settings=await FB.getSettings();
        const d=await extractInsights(img, settings.apiKey);
        if(d.views)u("views",String(d.views));
        if(d.interactions)u("interactions",String(d.interactions));
        if(d.newFollowers)u("newFollowers",String(d.newFollowers));
        setOcrStatus("done");
      }catch(err){
        setOcrStatus("error");
        setOcrError(err.message||"Errore sconosciuto");
      }
    };
}


// ── SCORE CIRCLE ──────────────────────────────────────────────────────────────
function ScoreCircle({score,color,size=52}){
  const r=(size/2)-5; const circ=2*Math.PI*r;
  const dash=circ*((score||0)/100);
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#2a2a2a" strokeWidth={4}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={4}
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <span style={{fontFamily:"'Archivo',sans-serif",fontSize:size*.3,fontWeight:900,color,lineHeight:1}}>{score||0}</span>
        <span style={{fontFamily:"'Archivo',sans-serif",fontSize:size*.14,color,opacity:.6,letterSpacing:"0.05em"}}>SCORE</span>
      </div>
    </div>
  );
}

function CandidaturePanel({role}){

    window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);
  },[]);

  const [apps,setApps]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [filter,setFilter]=useState("ALL");
  const [search,setSearch]=useState("");
  const searchRef = React.useRef(null);
  const handleSearch = (val) => {
    setSearch(val);
    setPage(1);
    // Mantieni focus sull'input dopo il re-render
    setTimeout(()=>{ if(searchRef.current) searchRef.current.focus(); }, 0);
  };
  const [sortBy,setSortBy]=useState("date");
  const perPage=10;
  const [page,setPage]=useState(1);
  const [note,setNote]=useState("");
  const [code,setCode]=useState("");
  const [showDetail,setShowDetail]=useState(false);
  const [saving,setSaving]=useState(false);
  const [scoringCfg,setScoringCfg]=useState(DEFAULT_SCORING);

  useEffect(()=>{
    FB.getApps().then(a=>{setApps(a);setLoading(false);}).catch(()=>setLoading(false));
    db.collection("settings").doc("scoring").get()
      .then(doc=>{ if(doc.exists) setScoringCfg(doc.data()); }).catch(()=>{});
  },[]);

  const upd=async(id,patch)=>{
    setSaving(true);
    try{
      await FB.updateApp(id,patch);
      const updated=apps.map(a=>a.id==id?{...a,...patch}:a);
      setApps(updated);
      if(sel?.id==id)setSel(p=>({...p,...patch}));
    }finally{setSaving(false);}
  };

  const del=async(id)=>{
    if(role!=="admin")return;
    if(!window.confirm("Eliminare questa candidatura?"))return;
    await FB.deleteApp(id);
    setApps(apps.filter(a=>a.id!=id));
    setSel(null); setShowDetail(false);
  };

  const selectApp=a=>{ setSel(a); setNote(a.notes||""); setCode(a.creatorCode||""); setShowDetail(true); };

  const getBand=(followers)=>{
    const cfg=scoringCfg||DEFAULT_SCORING;
    return cfg.bands.find(b=>followers<=b.max)||cfg.bands[cfg.bands.length-1];
  };

  const getMetricColor=(value,benchmarks)=>{
    if(!benchmarks) return "#888";
    if(value>=benchmarks.excellent) return "#3a7bd5";
    if(value>=benchmarks.good)      return "#27ae60";
    if(value>=benchmarks.avg)       return "#e67e22";
    return "#c0392b";
  };

  const getMetricLabel=(value,benchmarks)=>{
    if(!benchmarks) return "—";
    if(value>=benchmarks.excellent) return "ECCELLENTE";
    if(value>=benchmarks.good)      return "BUONO";
    if(value>=benchmarks.avg)       return "MEDIO";
    return "SCARSO";
  };

  // Filter
  const filtered=apps.filter(a=>{
    const mt=filter==="ALL"?true:filter==="NEW"?a.status==="new":a.tier===filter;
    const q=search.toLowerCase();
    const ms=!search||(a.fullName||"").toLowerCase().includes(q)||(a.instagram||"").toLowerCase().includes(q)||(a.city||"").toLowerCase().includes(q);
    return mt&&ms;
  });

  // Sort
  const sorted=[...filtered].sort((a,b)=>{
    if(sortBy==="score")    return (b.score||0)-(a.score||0);
    if(sortBy==="followers")return (parseInt(b.followers)||0)-(parseInt(a.followers)||0);
    if(sortBy==="er")       return (parseFloat(b.erReach)||0)-(parseFloat(a.erReach)||0);
    if(sortBy==="reach")    return (parseFloat(b.reachRate)||0)-(parseFloat(a.reachRate)||0);
    if(sortBy==="growth")   return (parseFloat(b.growthRate)||0)-(parseFloat(a.growthRate)||0);
    return new Date(b.date||0)-new Date(a.date||0);
  });

  const totalPages=Math.max(1,Math.ceil(sorted.length/perPage));
  const paginated=sorted.slice((page-1)*perPage,page*perPage);

  const st={
    total:apps.length,
    nw:apps.filter(a=>a.status==="new").length,
    el:apps.filter(a=>a.tier==="ELITE").length,
    pr:apps.filter(a=>a.tier==="PRO").length,
    ri:apps.filter(a=>a.tier==="RISING").length,
    pe:apps.filter(a=>a.tier==="PENDING").length,
    ap:apps.filter(a=>a.status==="approved").length
  };

  const statItems=[
    {key:"ALL",  label:"Totali candidature",  val:st.total, color:"#EFF0F5", icon:"📋"},
    {key:"NEW",  label:"Nuove candidature",    val:st.nw,    color:"var(--red)", icon:"🔔"},
    {key:"ELITE",label:"Livello Elite",        val:st.el,    color:"var(--red)", icon:"👑"},
    {key:"PRO",  label:"Livello Pro",          val:st.pr,    color:"var(--gold)",icon:"💎"},
    {key:"RISING",label:"Livello Rising",      val:st.ri,    color:"#6a9a7a",   icon:"📈"},
    {key:"PENDING",label:"Da valutare",        val:st.pe,    color:"#3a7bd5",   icon:"🕐"},
    {key:"OK",   label:"Approvate",            val:st.ap,    color:"#27ae60",   icon:"✅"}
  ];

    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div className="spinner" style={{width:32,height:32,borderWidth:3}}/>
      <div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--t4)",letterSpacing:"0.2em"}}>CARICAMENTO...</div>
    </div>
  );

    const fmtN=n=>n>=1000?(n/1000).toFixed(1)+"K":String(n||"—");

    const InfoCard=({label,value,color="var(--t1)",size=13})=>(

                  style={{background:"transparent",border:"1px solid #5a1010",color:"#cc4444",padding:"11px 18px",fontFamily:"var(--fu)",fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",cursor:"pointer"}}>
                  ELIMINA
                </button>}
              </div>

        </div>

  }

  // ── LIST VIEW ────────────────────────────────────────────────────────────────

  const DW = ({children, style={}}) => (
    <div style={{width:"100%", maxWidth: isMobile?"100%":"900px", margin:"0 auto", ...style}}>{children}</div>
  );

  return(

        <DW>
          <div style={{display:"flex",flexWrap:"wrap"}}>
            {statItems.map((s)=>(
              <div key={s.key} onClick={()=>{setFilter(s.key==="OK"?"ALL":s.key);setPage(1);}}

              ref={searchRef}
              placeholder="Cerca nome, @handle, città..."

                <option value="NEW">Nuovi</option>
                <option value="ELITE">Elite</option>
                <option value="PRO">Pro</option>
                <option value="RISING">Rising</option>
                <option value="PENDING">Pending</option>

              <select value={sortBy} onChange={e=>{setSortBy(e.target.value);setPage(1);}}
                style={{flex:1,background:"#141414",border:"1px solid #333",color:"var(--t1)",padding:"8px 10px",fontSize:12,fontFamily:"var(--fu)",outline:"none",cursor:"pointer"}}>

                <option value="score">Score ↓</option>
                <option value="followers">Follower ↓</option>
                <option value="er">ER ↓</option>
                <option value="reach">Reach ↓</option>
                <option value="growth">Growth ↓</option>
              </select>
            </div>
          ) : (
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {["ALL","NEW","ELITE","PRO","RISING","PENDING"].map(f=>(
                <button key={f} onClick={()=>{setFilter(f);setPage(1);}}
                  style={{padding:"6px 12px",fontFamily:"var(--fu)",fontSize:10,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:700,cursor:"pointer",
                    background:filter===f?"var(--red)":"#141414",border:`1px solid ${filter===f?"var(--red)":"#333"}`,
                    color:filter===f?"#fff":"var(--t3)",transition:"all .2s"}}>{f}</button>
              ))}
              <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.1em"}}>ORDINA</span>
                <select value={sortBy} onChange={e=>{setSortBy(e.target.value);setPage(1);}}
                  style={{background:"#141414",border:"1px solid #333",color:"var(--t1)",padding:"6px 10px",fontSize:11,fontFamily:"var(--fu)",outline:"none",cursor:"pointer"}}>
                  <option value="date">Recenti</option>
                  <option value="score">Score ↓</option>
                  <option value="followers">Follower ↓</option>
                  <option value="er">ER ↓</option>
                  <option value="reach">Reach ↓</option>
                  <option value="growth">Growth ↓</option>
                </select>
              </div>
            </div>
          )}
        </DW>
      </div>

      {/* LIST */}
      <div style={{overflow:"auto",flex:1}}>
        <DW>
          {paginated.length===0&&<div style={{padding:40,textAlign:"center",fontFamily:"var(--fu)",fontSize:12,color:"var(--t4)",letterSpacing:"0.2em"}}>NESSUNA CANDIDATURA</div>}

          {paginated.map((a)=>{
            const followers=parseInt(a.followers)||0;
            const band=getBand(followers);
            const er=parseFloat(a.erReach)||0;
            const reach=parseFloat(a.reachRate)||0;
            const growth=parseFloat(a.growthRate)||0;
            const erColor=getMetricColor(er,band.er);
            const reachColor=getMetricColor(reach,band.reach);
            const growthColor=getMetricColor(growth,band.growth);
            const fmtNum=n=>n>=1000?(n/1000).toFixed(1)+"K":String(n);

            return(
              <div key={a.id} onClick={()=>selectApp(a)}
                style={{borderBottom:"1px solid var(--brd)",cursor:"pointer",
                  borderLeft:`3px solid ${a.tierColor}`,transition:"background .15s"}}
                onMouseEnter={e=>e.currentTarget.style.background="#111"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>

                {isMobile ? (
                  // ── MOBILE: 2 righe ──
                  <>
                    <div style={{display:"flex",alignItems:"center",padding:"10px 12px",gap:10}}>
                      <div style={{display:"flex",flexDirection:"column",gap:3,flexShrink:0,width:62}}>
                        <Tag color={a.tierColor}>{a.tier}</Tag>
                        {a.status==="new"&&<Tag color="var(--red)">NEW</Tag>}
                        {a.status==="approved"&&<Tag color="#27ae60">OK</Tag>}
                        {a.status==="review"&&<Tag color="var(--gold)">REV</Tag>}
                        {a.status==="rejected"&&<Tag color="#c0392b">NO</Tag>}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontFamily:"'Archivo',sans-serif",fontSize:13,color:"#fff",fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.fullName||"—"}</div>
                        <div style={{fontFamily:"var(--fb)",fontSize:11,color:"var(--t3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.instagram}{a.city?` · ${a.city}`:""}</div>
                      </div>
                      <ScoreCircle score={a.score} color={a.tierColor} size={42}/>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",borderTop:"1px solid #1a1a1a",margin:"0 12px 10px"}}>
                      {[["FOLLOWER",fmtNum(followers),"var(--t2)"],["ER",er.toFixed(1)+"%",erColor],["REACH",reach.toFixed(1)+"%",reachColor],["GROWTH",growth.toFixed(2)+"%",growthColor]].map(([l,v,c])=>(
                        <div key={l} style={{padding:"6px 4px",textAlign:"center"}}>
                          <div style={{fontFamily:"var(--fu)",fontSize:8,color:"var(--t4)",letterSpacing:"0.1em",marginBottom:2}}>{l}</div>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:3}}>
                            {l!=="FOLLOWER"&&<div style={{width:5,height:5,borderRadius:"50%",background:c,flexShrink:0}}/>}
                            <span style={{fontFamily:"'Archivo',sans-serif",fontSize:12,color:c,fontWeight:700}}>{v}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                ) : (
                  // ── DESKTOP: 1 riga compatta ──
                  <div style={{display:"flex",alignItems:"center",padding:"12px 16px",gap:12}}>
                    <div style={{display:"flex",flexDirection:"column",gap:3,flexShrink:0,width:68}}>
                      <Tag color={a.tierColor}>{a.tier}</Tag>
                      {a.status==="new"&&<Tag color="var(--red)">NEW</Tag>}
                      {a.status==="approved"&&<Tag color="#27ae60">OK</Tag>}
                      {a.status==="review"&&<Tag color="var(--gold)">REV</Tag>}
                      {a.status==="rejected"&&<Tag color="#c0392b">NO</Tag>}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontFamily:"'Archivo',sans-serif",fontSize:13,color:"#fff",fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.fullName||"—"}</div>
                      <div style={{fontFamily:"var(--fb)",fontSize:11,color:"var(--t3)"}}>{a.instagram}{a.city?` · ${a.city}`:""}</div>
                    </div>
                    {[["FOLLOWER",fmtNum(followers),"var(--t2)"],["ER",er.toFixed(1)+"%",erColor],["REACH",reach.toFixed(1)+"%",reachColor],["GROWTH",growth.toFixed(2)+"%",growthColor]].map(([l,v,c])=>(
                      <div key={l} style={{textAlign:"center",minWidth:64,flexShrink:0}}>
                        <div style={{fontFamily:"var(--fu)",fontSize:8,color:"var(--t4)",letterSpacing:"0.1em",marginBottom:3}}>{l}</div>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                          {l!=="FOLLOWER"&&<div style={{width:5,height:5,borderRadius:"50%",background:c,flexShrink:0}}/>}
                          <span style={{fontFamily:"'Archivo',sans-serif",fontSize:13,color:c,fontWeight:700}}>{v}</span>
                        </div>
                      </div>
                    ))}
                    <ScoreCircle score={a.score} color={a.tierColor} size={46}/>
                  </div>
                )}
              </div>
            );
          })}
        </DW>
      </div>

      {/* PAGINAZIONE */}
      <div style={{borderTop:"1px solid var(--brd)",flexShrink:0}}>
        <DW style={{padding:"10px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
          <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.08em"}}>
            Pag. {page}/{totalPages} · {sorted.length} risultati
          </div>
          <div style={{display:"flex",gap:3}}>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}
              style={{background:"#141414",border:"1px solid #333",color:page===1?"var(--t4)":"var(--t1)",padding:"6px 11px",fontFamily:"var(--fu)",fontSize:12,cursor:page===1?"default":"pointer"}}>‹</button>
            {Array.from({length:Math.min(5,totalPages)},(_,i)=>{
              let p;
              if(totalPages<=5) p=i+1;
              else if(page<=3) p=i+1;
              else if(page>=totalPages-2) p=totalPages-4+i;
              else p=page-2+i;
              return(
                <button key={p} onClick={()=>setPage(p)}
                  style={{background:page===p?"var(--red)":"#141414",border:`1px solid ${page===p?"var(--red)":"#333"}`,
                    color:page===p?"#fff":"var(--t2)",padding:"6px 10px",fontFamily:"var(--fu)",fontSize:11,cursor:"pointer",minWidth:30,fontWeight:page===p?700:400}}>
                  {p}
                </button>
              );
            })}
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages}
              style={{background:"#141414",border:"1px solid #333",color:page===totalPages?"var(--t4)":"var(--t1)",padding:"6px 11px",fontFamily:"var(--fu)",fontSize:12,cursor:page===totalPages?"default":"pointer"}}>›</button>
          </div>
        </DW>
      </div>
    </div>
  );
}

// ── SETTINGS PANEL ────────────────────────────────────────────────────────────
function SettingsPanel(){
  const [settings,setSettings]=useState({});
  const [loading,setLoading]=useState(true);
  const [saved,setSaved]=useState("");
  const [showKey,setShowKey]=useState(false);

  useEffect(()=>{
    FB.getSettings().then(s=>{setSettings(s);setLoading(false);});
  },[]);

  const save=async(patch)=>{
    const ns={...settings,...patch};
    setSettings(ns);
    await FB.saveSettings(patch);
    setSaved(Object.keys(patch)[0]);
    setTimeout(()=>setSaved(""),2000);
  };

  if(loading)return<div style={{padding:32,textAlign:"center",fontFamily:"var(--fu)",fontSize:11,color:"var(--t4)",letterSpacing:"0.2em"}}>CARICAMENTO...</div>;

  return(
    <div style={{overflow:"auto",flex:1}}>
      <div className="settings-inner">
        <h2 style={{fontFamily:"var(--fd)",fontSize:32,color:"#fff",marginBottom:24}}>IMPOSTAZIONI</h2>

        <div className="settings-section">
          <div className="settings-title">🔑 API Key Anthropic</div>
          <div className="settings-desc">Necessaria per la lettura automatica degli screenshot Insights. Salvata su Firebase — funziona su tutti i dispositivi.</div>
          <Field label="API Key">
            <div style={{display:"flex",gap:8}}>
              <input type={showKey?"text":"password"} value={settings.apiKey||""} onChange={e=>setSettings(p=>({...p,apiKey:e.target.value}))} placeholder="sk-ant-api03-..."/>
              <button onClick={()=>setShowKey(!showKey)} style={{background:"#111",border:"1px solid #333",color:"var(--t2)",padding:"10px 14px",fontFamily:"var(--fu)",fontSize:10,cursor:"pointer",whiteSpace:"nowrap"}}>{showKey?"NASCONDI":"MOSTRA"}</button>
            </div>
          </Field>
          <button className="btn-red" onClick={()=>save({apiKey:settings.apiKey})} style={{marginTop:14,padding:"11px 28px",fontSize:11}}>
            {saved==="apiKey"?"✓ SALVATA":"SALVA API KEY"}
          </button>
          {settings.apiKey&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"#6a9a7a",marginTop:10,letterSpacing:"0.12em"}}>✓ API Key configurata — OCR attivo su tutti i dispositivi</div>}
        </div>

        <div className="settings-section">
          <div className="settings-title">🔐 Password Admin</div>
          <div className="settings-desc">Accesso completo — solo per te.</div>
          <Field label="Nuova password admin">
            <input type="password" value={settings.adminPass||""} onChange={e=>setSettings(p=>({...p,adminPass:e.target.value}))} placeholder="Nuova password..."/>
          </Field>
          <button className="btn-red" onClick={()=>save({adminPass:settings.adminPass})} style={{marginTop:14,padding:"11px 28px",fontSize:11}}>
            {saved==="adminPass"?"✓ AGGIORNATA":"AGGIORNA PASSWORD"}
          </button>
        </div>

        <div className="settings-section">
          <div className="settings-title">👤 Password Manager (SMM)</div>
          <div className="settings-desc">Per la tua social media manager — accesso candidature senza impostazioni e senza eliminazione.</div>
          <Field label="Nuova password manager">
            <input type="password" value={settings.managerPass||""} onChange={e=>setSettings(p=>({...p,managerPass:e.target.value}))} placeholder="Nuova password..."/>
          </Field>
          <button className="btn-red" onClick={()=>save({managerPass:settings.managerPass})} style={{marginTop:14,padding:"11px 28px",fontSize:11}}>
            {saved==="managerPass"?"✓ AGGIORNATA":"AGGIORNA PASSWORD"}
          </button>
          {settings.managerPass&&(
            <div style={{fontFamily:"var(--fb)",fontSize:12,color:"var(--t3)",marginTop:14,padding:"12px 14px",background:"#0a0a0a",border:"1px solid #2a2a2a",lineHeight:1.7}}>
              Password attuale manager: <strong style={{color:"var(--t1)",fontFamily:"var(--fu)",letterSpacing:"0.1em"}}>{settings.managerPass}</strong><br/>
              <span style={{fontSize:11,color:"var(--t4)"}}>Condividi questa con la SMM — mai quella admin.</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── SCORING PANEL ─────────────────────────────────────────────────────────────
function BenchmarkEditor({cfg, updateBand}){
  const [metricTab, setMetricTab] = useState("er");
  const metrics = [
    { key:"er",     label:"Engagement Rate", unit:"%", step:"0.1", desc:"ER = interazioni / visualizzazioni × 100" },
    { key:"reach",  label:"Reach Rate",       unit:"%", step:"1",   desc:"Reach = visualizzazioni / follower × 100" },
    { key:"growth", label:"Growth Rate",      unit:"%", step:"0.1", desc:"Growth = nuovi follower / follower × 100" }
  ];
  const cur = metrics.find(m=>m.key===metricTab);
  const levels = [
    { key:"avg",       label:"MEDIO DA",      color:"#e67e22", bg:"#2a1a08", desc:(b)=>`Sotto ${b.avg}% → SCARSO` },
    { key:"good",      label:"BUONO DA",      color:"#27ae60", bg:"#0a2a14", desc:(b)=>`Da ${b.avg}% a ${b.good-0.01}% → MEDIO` },
    { key:"excellent", label:"ECCELLENTE DA", color:"#3a7bd5", bg:"#0a1428", desc:(b)=>`Da ${b.good}% a ${b.excellent-0.01}% → BUONO · Da ${b.excellent}% in su → ECCELLENTE` }
  ];
  return(
    <div>
      {/* Metric tabs */}
      <div style={{display:"flex",gap:2,marginBottom:20}}>
        {metrics.map(m=>(
          <button key={m.key} onClick={()=>setMetricTab(m.key)}
            style={{flex:1,padding:"10px 8px",fontFamily:"var(--fu)",fontSize:11,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:700,cursor:"pointer",transition:"all .2s",
              background:metricTab===m.key?"var(--red)":"#141414",
              border:`1px solid ${metricTab===m.key?"var(--red)":"#333"}`,
              color:metricTab===m.key?"#fff":"var(--t3)"}}>
            {m.label}
          </button>
        ))}
      </div>
      {/* Formula */}
      <div style={{fontFamily:"var(--fb)",fontSize:12,color:"var(--t4)",marginBottom:20,padding:"10px 14px",background:"#141414",border:"1px solid #333"}}>
        💡 {cur.desc}
      </div>
      {/* Legenda */}
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {[
          {color:"#c0392b",bg:"#2a1010",label:"SCARSO"},
          {color:"#e67e22",bg:"#2a1a08",label:"MEDIO"},
          {color:"#27ae60",bg:"#0a2a14",label:"BUONO"},
          {color:"#3a7bd5",bg:"#0a1428",label:"ECCELLENTE"}
        ].map(l=>(
          <div key={l.label} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 12px",background:l.bg,border:`1px solid ${l.color}40`}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:l.color}}/>
            <span style={{fontFamily:"var(--fu)",fontSize:10,color:l.color,letterSpacing:"0.12em",fontWeight:700}}>{l.label}</span>
          </div>
        ))}
      </div>
      {/* Fasce */}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {cfg.bands.map((band,bi)=>(
          <div key={bi} style={{background:"#141414",border:"1px solid #2a2a2a",padding:16}}>
            <div style={{fontFamily:"var(--fu)",fontSize:12,color:"var(--t1)",fontWeight:700,marginBottom:14,letterSpacing:"0.1em"}}>
              Fascia {band.label}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
              {levels.map(l=>(
                <div key={l.key} style={{background:l.bg,border:`1px solid ${l.color}50`,padding:14}}>
                  <div style={{fontFamily:"var(--fu)",fontSize:9,color:l.color,letterSpacing:"0.2em",fontWeight:700,marginBottom:8}}>{l.label}</div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <input type="number" step={cur.step} min="0"
                      style={{background:"#0a0a0a",border:`1px solid ${l.color}60`,color:"#fff",padding:"8px 10px",fontSize:14,fontFamily:"var(--fb)",outline:"none",width:"100%",fontWeight:600}}
                      value={band[metricTab][l.key]}
                      onChange={e=>updateBand(bi,metricTab,l.key,e.target.value)}/>
                    <span style={{fontFamily:"var(--fu)",fontSize:12,color:l.color,fontWeight:700}}>{cur.unit}</span>
                  </div>
                  <div style={{fontFamily:"var(--fb)",fontSize:11,color:l.color,marginTop:8,opacity:.85,lineHeight:1.6}}>
                    {l.desc(band[metricTab])}
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ScoringPanel(){
  const [cfg, setCfg] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saved, setSaved] = useState(false);

  useEffect(()=>{
    db.collection("settings").doc("scoring").get().then(doc=>{
      setCfg(doc.exists ? doc.data() : JSON.parse(JSON.stringify(DEFAULT_SCORING)));
      setLoading(false);
    }).catch(()=>{ setCfg(JSON.parse(JSON.stringify(DEFAULT_SCORING))); setLoading(false); });
  },[]);

  const save = async () => {
    await db.collection("settings").doc("scoring").set(cfg);
    invalidateScoringCache();
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  const resetDefault = () => { setCfg(JSON.parse(JSON.stringify(DEFAULT_SCORING))); };

  const updateWeight = (key, val) => {
    setCfg(p=>({...p, weights:{...p.weights, [key]: parseFloat(val)||0}}));
  };

  const updateBand = (bi, metric, level, val) => {
    const bands = JSON.parse(JSON.stringify(cfg.bands));
    bands[bi][metric][level] = parseFloat(val)||0;
    setCfg(p=>({...p, bands}));
  };

  const updateTier = (ti, field, val) => {
    const tiers = JSON.parse(JSON.stringify(cfg.tiers));
    tiers[ti][field] = field==="min" ? parseInt(val)||0 : val;
    setCfg(p=>({...p, tiers}));
  };

  if(loading) return <div style={{padding:32,textAlign:"center",fontFamily:"var(--fu)",fontSize:11,color:"var(--t4)"}}>CARICAMENTO...</div>;

  const iStyle = {background:"#141414",border:"1px solid #3a3a3a",color:"var(--t1)",padding:"8px 10px",fontSize:13,fontFamily:"var(--fb)",outline:"none",width:"100%"};
  const totalW = (cfg.weights.er||0)+(cfg.weights.reach||0)+(cfg.weights.growth||0);

  return(
    <div style={{overflow:"auto",flex:1}}>
      <div style={{maxWidth:900,margin:"0 auto",padding:"32px 20px 80px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28,flexWrap:"wrap",gap:12}}>
          <h2 style={{fontFamily:"var(--fd)",fontSize:32,color:"var(--t1)",fontWeight:900}}>SCORING ENGINE</h2>
          <div style={{display:"flex",gap:8}}>
            <button onClick={resetDefault} className="btn-ghost" style={{padding:"9px 20px",fontSize:11}}>RESET DEFAULT</button>
            <button onClick={save} className="btn-red" style={{padding:"9px 24px",fontSize:11}}>
              {saved?"✓ SALVATO":"SALVA CONFIGURAZIONE"}
            </button>
          </div>
        </div>

        {/* PESI METRICHE */}
        <div style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:24,marginBottom:16}}>
          <div style={{fontFamily:"var(--fd)",fontSize:18,color:"var(--t1)",marginBottom:4,fontWeight:700}}>⚖️ Pesi delle Metriche</div>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",marginBottom:20,lineHeight:1.7}}>La somma deve essere 100. Attualmente: <strong style={{color:totalW===100?"#6a9a7a":"var(--red)"}}>{totalW}</strong></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16}}>
            {[["er","Engagement Rate","40% consigliato"],["reach","Reach Rate","35% consigliato"],["growth","Growth Rate","25% consigliato"]].map(([k,l,hint])=>(
              <div key={k}>
                <label style={{fontFamily:"var(--fu)",fontSize:10,color:"var(--t3)",letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:6,display:"block",fontWeight:600}}>{l}</label>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <input type="number" min="0" max="100" style={iStyle} value={cfg.weights[k]} onChange={e=>updateWeight(k,e.target.value)}/>
                  <span style={{fontFamily:"var(--fd)",fontSize:22,color:"var(--red)",fontWeight:700}}>%</span>
                </div>
                <div style={{fontFamily:"var(--fb)",fontSize:11,color:"var(--t4)",marginTop:4}}>{hint}</div>
              </div>
            ))}
          </div>
        </div>

        {/* TIER SOGLIE */}
        <div style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:24,marginBottom:16}}>
          <div style={{fontFamily:"var(--fd)",fontSize:18,color:"var(--t1)",marginBottom:4,fontWeight:700}}>🏆 Soglie Tier</div>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",marginBottom:20}}>Punteggio minimo per accedere a ogni tier.</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
            {cfg.tiers.map((t,i)=>(
              <div key={t.name} style={{background:"#141414",border:`1px solid ${t.color}40`,padding:16}}>
                <div style={{fontFamily:"var(--fu)",fontSize:11,color:t.color,letterSpacing:"0.2em",fontWeight:700,marginBottom:10}}>{t.name}</div>
                <label style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.15em",display:"block",marginBottom:4}}>PUNTEGGIO MIN</label>
                <input type="number" min="0" max="100" style={iStyle} value={t.min} onChange={e=>updateTier(i,"min",e.target.value)}/>
                <label style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.15em",display:"block",margin:"10px 0 4px"}}>LABEL</label>
                <input type="text" style={iStyle} value={t.label} onChange={e=>updateTier(i,"label",e.target.value)}/>
              </div>
            ))}
          </div>
        </div>

        {/* BENCHMARK PER FASCIA */}
        <div style={{background:"var(--surf)",border:"1px solid var(--brd)",padding:24}}>
          <div style={{fontFamily:"var(--fd)",fontSize:18,color:"var(--t1)",marginBottom:4,fontWeight:700}}>📊 Benchmark per Fascia Follower</div>
          <div style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",marginBottom:20,lineHeight:1.7}}>
            Definisci le soglie per ogni fascia. Il sistema interpola automaticamente i valori intermedi.
          </div>
          <BenchmarkEditor cfg={cfg} updateBand={updateBand}/>
        </div>

        <div style={{marginTop:20,display:"flex",justifyContent:"flex-end",gap:8}}>
          <button onClick={resetDefault} className="btn-ghost" style={{padding:"12px 24px",fontSize:11}}>RESET DEFAULT</button>
          <button onClick={save} className="btn-red" style={{padding:"12px 32px",fontSize:12}}>
            {saved?"✓ CONFIGURAZIONE SALVATA":"SALVA CONFIGURAZIONE"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── ADMIN PANEL ───────────────────────────────────────────────────────────────
const DEFAULT_ADMIN="evora2025";
const DEFAULT_MANAGER="evora_smm";

function AdminPanel({onBack}){
  const [role,setRole]=useState(null);
  const [pw,setPw]=useState("");
  const [pwError,setPwError]=useState(false);
  const [activeTab,setActiveTab]=useState("candidature");
  const [checking,setChecking]=useState(false);

  const login=async()=>{
    setChecking(true);
    try{
      const settings=await FB.getSettings();
      const adminPass=settings.adminPass||DEFAULT_ADMIN;
      const managerPass=settings.managerPass||DEFAULT_MANAGER;
      if(pw===adminPass){setRole("admin");setPwError(false);}
      else if(pw===managerPass){setRole("manager");setPwError(false);}
      else{setPwError(true);}
    }catch(e){
      // Se Firebase non risponde, usa default
      if(pw===DEFAULT_ADMIN)setRole("admin");
      else if(pw===DEFAULT_MANAGER)setRole("manager");
      else setPwError(true);
    }finally{setChecking(false);}
  };

  if(!role)return(
    <div style={{minHeight:"100vh",background:"var(--black)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:380,animation:"fadeUp .6s ease both"}}>
        <Logo size={22}/>
        <h2 style={{fontFamily:"var(--fd)",fontSize:38,color:"#fff",margin:"24px 0 4px"}}>AREA RISERVATA</h2>
        <p style={{fontFamily:"var(--fb)",fontSize:13,color:"var(--t3)",marginBottom:28,lineHeight:1.7}}>Accesso esclusivo team EVORΛ.<br/>Inserisci la tua password.</p>
        <input type="password" placeholder="Password..." style={{marginBottom:10,borderColor:pwError?"var(--red)":"#333"}}
          value={pw} onChange={e=>{setPw(e.target.value);setPwError(false);}}
          onKeyDown={e=>e.key==="Enter"&&login()}/>
        {pwError&&<div style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--red)",letterSpacing:"0.15em",marginBottom:10}}>⚠ PASSWORD ERRATA</div>}
        <button className="btn-red" onClick={login} style={{width:"100%",padding:"14px"}} disabled={checking}>
          {checking?"VERIFICA...":"ACCEDI"}
        </button>
        <button className="btn-ghost" onClick={onBack} style={{width:"100%",marginTop:8,padding:"14px"}}>← TORNA AL SITO</button>
        <div style={{marginTop:20,padding:"16px",background:"#0a0a0a",border:"1px solid #1e1e1e"}}>
          <div style={{fontFamily:"var(--fu)",fontSize:9,color:"var(--t4)",letterSpacing:"0.25em",marginBottom:10}}>ACCESSI DISPONIBILI</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--t3)"}}>🔐 Admin — accesso completo</span><Tag color="var(--red)">OWNER</Tag></div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:"var(--fu)",fontSize:11,color:"var(--t3)"}}>👤 Manager — candidature only</span><Tag color="var(--gold)">SMM</Tag></div>
          </div>
        </div>
      </div>
    </div>
  );

  return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* HEADER — centrato su desktop */}
      <div style={{height:52,borderBottom:"1px solid var(--brd)",background:"var(--deep)",flexShrink:0,position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{maxWidth:900,width:"100%",margin:"0 auto",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Logo size={16}/>
            <Tag color={role==="admin"?"var(--red)":"var(--gold)"}>{role==="admin"?"ADMIN":"MANAGER"}</Tag>
          </div>
          <button className="btn-ghost" onClick={()=>{setRole(null);setPw("");}} style={{padding:"5px 14px",fontSize:10,position:"absolute",right:20}}>ESCI</button>
        </div>
      </div>
      {/* TAB BAR — centrata su desktop */}
      <div style={{borderBottom:"1px solid var(--brd)",background:"var(--deep)",flexShrink:0}}>
        <div style={{maxWidth:900,margin:"0 auto",display:"flex"}}>
          <button className={`tab${activeTab==="candidature"?" active":""}`} onClick={()=>setActiveTab("candidature")}>📋 Candidature</button>
          {role==="admin"&&<button className={`tab${activeTab==="scoring"?" active":""}`} onClick={()=>setActiveTab("scoring")}>🎯 Scoring</button>}
          {role==="admin"&&<button className={`tab${activeTab==="settings"?" active":""}`} onClick={()=>setActiveTab("settings")}>⚙️ Impostazioni</button>}
        </div>
      </div>
      {activeTab==="candidature"&&<CandidaturePanel role={role}/>}
      {activeTab==="scoring"&&role==="admin"&&<ScoringPanel/>}
      {activeTab==="settings"&&role==="admin"&&<SettingsPanel/>}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [view,setView]=useState("landing");
  return(
    <>
      {view==="landing"&&<Landing onApply={()=>setView("apply")} onAdmin={()=>setView("admin")}/>}
      {view==="apply"&&<ApplicationForm onBack={()=>setView("landing")} onAdmin={()=>setView("admin")}/>}
      {view==="admin"&&<AdminPanel onBack={()=>setView("landing")}/>}
    </>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
