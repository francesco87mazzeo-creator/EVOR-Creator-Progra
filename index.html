    // ─── DATA & SCORING ENGINE ───────────────────────────────────────────────────
    const scoreCandidate = (data) => {
      let score = 0;
      const reasons = [];
 
      const followers = parseInt(data.followers) || 0;
      if (followers >= 100000) { score += 30; reasons.push("100K+ follower"); }
      else if (followers >= 30000) { score += 22; reasons.push("30K+ follower"); }
      else if (followers >= 10000) { score += 14; reasons.push("10K+ follower"); }
      else if (followers >= 3000) { score += 6; reasons.push("3K+ follower"); }
      else { reasons.push("Micro audience"); }
 
      const er = parseFloat(data.engagementRate) || 0;
      if (er >= 6) { score += 25; reasons.push("ER eccellente"); }
      else if (er >= 4) { score += 18; reasons.push("ER solido"); }
      else if (er >= 2) { score += 10; reasons.push("ER nella media"); }
      else { reasons.push("ER basso"); }
 
      if (data.niche === "fitness" || data.niche === "bodybuilding") { score += 20; reasons.push("Nicchia core"); }
      else if (data.niche === "lifestyle" || data.niche === "nutrition") { score += 12; reasons.push("Nicchia affine"); }
      else { score += 4; }
 
      if (data.hasCollaborations === "yes") { score += 10; reasons.push("Exp. collaborazioni"); }
      if (data.contentFrequency === "daily") { score += 8; reasons.push("Content daily"); }
      else if (data.contentFrequency === "3-5week") { score += 5; }
 
      const motivation = (data.motivation || "").length;
      if (motivation > 300) { score += 7; reasons.push("Motivazione elaborata"); }
      else if (motivation > 150) { score += 3; }
 
      if (data.platforms && data.platforms.length >= 3) { score += 5; reasons.push("Multi-platform"); }
 
      let tier, tierColor, tierLabel;
      if (score >= 75) { tier = "ELITE"; tierColor = "#b22222"; tierLabel = "Priorità Assoluta"; }
      else if (score >= 55) { tier = "PRO"; tierColor = "#c0a060"; tierLabel = "Alta Priorità"; }
      else if (score >= 35) { tier = "RISING"; tierColor = "#6a9a7a"; tierLabel = "Da Monitorare"; }
      else { tier = "PENDING"; tierColor = "#555"; tierLabel = "In Attesa"; }
 
      return { score, tier, tierColor, tierLabel, reasons };
    };
 
    // ─── STORAGE ─────────────────────────────────────────────────────────────────

      try { return JSON.parse(localStorage.getItem("evora_apps") || "[]"); } catch { return []; }

                    background: selected?.id === a.id ? "#111" : "transparent",
                    borderLeft: selected?.id === a.id ? "2px solid var(--red)" : "2px solid transparent",
                    transition: "all 0.2s"
                  }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                    <div>
                      <div style={{ fontFamily: "var(--font-ui)", fontSize: 14, color: "white", letterSpacing: "0.05em" }}>{a.name}</div>
                      <div style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "#555" }}>{a.instagram}</div>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                      <Tag color={a.tierColor}>{a.tier}</Tag>
                      {a.status === "new" && <Tag color="var(--red)">NEW</Tag>}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 16 }}>
                    <div style={{ fontFamily: "var(--font-ui)", fontSize: 11, color: "#555" }}>
                      👥 {parseInt(a.followers || 0).toLocaleString()}
                    </div>
                    <div style={{ fontFamily: "var(--font-ui)", fontSize: 11, color: "#555" }}>
                      ER {a.engagementRate}%
                    </div>
                    <div style={{ fontFamily: "var(--font-display)", fontSize: 18, color: a.tierColor, marginLeft: "auto" }}>
                      {a.score}
                    </div>
                  </div>
                </div>
              ))}
            </div>
 
            {selected ? (
              <div style={{ flex: 1, overflow: "auto", padding: 32 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 32 }}>
                  <div>
                    <h2 style={{ fontFamily: "var(--font-display)", fontSize: 42, color: "white", lineHeight: 1 }}>{selected.name}</h2>
                    <div style={{ fontFamily: "var(--font-body)", fontSize: 14, color: "#666", marginTop: 4 }}>{selected.email}</div>
                    <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                      <Tag color={selected.tierColor}>{selected.tier}</Tag>
                      <Tag color="#555">{selected.tierLabel}</Tag>
                      <span style={{ fontFamily: "var(--font-ui)", fontSize: 11, color: "#333", letterSpacing: "0.1em", padding: "2px 8px" }}>
                        {new Date(selected.date).toLocaleDateString("it-IT")}
                      </span>
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: "var(--font-display)", fontSize: 72, color: selected.tierColor, lineHeight: 1 }}>{selected.score}</div>
                    <div style={{ fontFamily: "var(--font-ui)", fontSize: 10, color: "#444", letterSpacing: "0.2em" }}>SCORE</div>
                  </div>
                </div>
 
                <div style={{ background: "#0d0d0d", border: "1px solid var(--border)", padding: 20, marginBottom: 24 }}>
                  <div style={{ fontFamily: "var(--font-ui)", fontSize: 10, color: "#444", letterSpacing: "0.3em", marginBottom: 12 }}>MOTIVAZIONI SCORE</div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {selected.reasons?.map(r => <Tag key={r} color="#555">{r}</Tag>)}
                  </div>
                </div>
 
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 2, marginBottom: 24 }}>
                  {[
                    ["Instagram", selected.instagram],
                    ["TikTok", selected.tiktok || "—"],
                    ["YouTube", selected.youtube || "—"],
                    ["Follower", parseInt(selected.followers || 0).toLocaleString()],
                    ["Engagement", `${selected.engagementRate}%`],
                    ["Nicchia", selected.niche],
                    ["Frequenza", selected.contentFrequency],
                    ["Collaborazioni", selected.hasCollaborations === "yes" ? "Sì" : "No"],
                    ["Esclusività", selected.exclusivity || "—"],
                  ].map(([k, v]) => (
                    <div key={k} style={{ background: "var(--surface)", border: "1px solid var(--border)", padding: 16 }}>
                      <div style={{ fontFamily: "var(--font-ui)", fontSize: 9, color: "#444", letterSpacing: "0.25em", textTransform: "uppercase", marginBottom: 6 }}>{k}</div>
                      <div style={{ fontFamily: "var(--font-ui)", fontSize: 14, color: "white" }}>{v}</div>
                    </div>
                  ))}
                </div>
 
                {selected.platforms?.length > 0 && (
                  <div style={{ marginBottom: 24 }}>
                    <div style={{ fontFamily: "var(--font-ui)", fontSize: 10, color: "#444", letterSpacing: "0.3em", marginBottom: 10 }}>PIATTAFORME</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      {selected.platforms.map(p => <Tag key={p} color="#555">{p}</Tag>)}
                    </div>
                  </div>
                )}
 
                {selected.motivation && (
                  <div style={{ marginBottom: 20, background: "#0d0d0d", border: "1px solid var(--border)", padding: 20 }}>
                    <div style={{ fontFamily: "var(--font-ui)", fontSize: 10, color: "#444", letterSpacing: "0.3em", marginBottom: 10 }}>MOTIVAZIONE</div>
                    <p style={{ fontFamily: "var(--font-body)", fontSize: 14, color: "#888", lineHeight: 1.8 }}>{selected.motivation}</p>
                  </div>
                )}
                {selected.goal && (
                  <div style={{ marginBottom: 20, background: "#0d0d0d", border: "1px solid var(--border)", padding: 20 }}>
                    <div style={{ fontFamily: "var(--font-ui)", fontSize: 10, color: "#444", letterSpacing: "0.3em", marginBottom: 10 }}>OBIETTIVO</div>
                    <p style={{ fontFamily: "var(--font-body)", fontSize: 14, color: "#888", lineHeight: 1.8 }}>{selected.goal}</p>
                  </div>
                )}
 
                <div style={{ borderTop: "1px solid var(--border)", paddingTop: 24, marginTop: 24, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                  <div>
                    <div style={{ fontFamily: "var(--font-ui)", fontSize: 10, color: "#444", letterSpacing: "0.3em", marginBottom: 8 }}>CODICE CREATOR</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <input style={{
                        flex: 1, background: "#0d0d0d", border: "1px solid #222",
                        color: "white", padding: "10px 14px", fontSize: 13, fontFamily: "var(--font-body)", outline: "none"
                      }}
                        placeholder="es. NOME10" value={editCode} onChange={e => setEditCode(e.target.value)} />
                      <button onClick={() => updateApp(selected.id, { creatorCode: editCode })}
                        style={{
                          background: "#111", border: "1px solid #333", color: "#888",
                          padding: "10px 16px", fontFamily: "var(--font-ui)", fontSize: 11,
                          letterSpacing: "0.1em", cursor: "pointer"
                        }}>SALVA</button>
                    </div>
                  </div>
                  <div>
                    <div style={{ fontFamily: "var(--font-ui)", fontSize: 10, color: "#444", letterSpacing: "0.3em", marginBottom: 8 }}>STATO</div>
                    <div style={{ display: "flex", gap: 4 }}>
                      {["new", "review", "approved", "rejected"].map(s => (
                        <button key={s} onClick={() => updateApp(selected.id, { status: s })}
                          style={{
                            flex: 1, padding: "10px 4px", fontFamily: "var(--font-ui)", fontSize: 9,
                            letterSpacing: "0.1em", textTransform: "uppercase", cursor: "pointer",
                            background: selected.status === s ? (s === "approved" ? "#1a4a1a" : s === "rejected" ? "#4a1a1a" : "var(--red)") : "#0d0d0d",
                            border: `1px solid ${selected.status === s ? (s === "approved" ? "#2a7a2a" : s === "rejected" ? "#7a2a2a" : "var(--red)") : "#1e1e1e"}`,
                            color: selected.status === s ? "white" : "#555", transition: "all 0.2s"
                          }}>{s}</button>
                      ))}
                    </div>
                  </div>
                </div>
 
                <div style={{ marginTop: 16 }}>
                  <div style={{ fontFamily: "var(--font-ui)", fontSize: 10, color: "#444", letterSpacing: "0.3em", marginBottom: 8 }}>NOTE INTERNE</div>
                  <textarea style={{
                    width: "100%", background: "#0d0d0d", border: "1px solid #222",
                    color: "white", padding: "12px 16px", fontSize: 13,
                    fontFamily: "var(--font-body)", outline: "none", height: 90, resize: "vertical"
                  }}
                    value={editNote} onChange={e => setEditNote(e.target.value)} />
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
                    <button onClick={() => updateApp(selected.id, { notes: editNote })}
                      style={{
                        background: "var(--red)", border: "none", color: "white",
                        padding: "10px 24px", fontFamily: "var(--font-ui)", fontSize: 11,
                        letterSpacing: "0.2em", textTransform: "uppercase", cursor: "pointer"
                      }}>SALVA NOTE</button>
                    <button onClick={() => { if (window.confirm("Eliminare questa candidatura?")) deleteApp(selected.id); }}
                      style={{
                        background: "transparent", border: "1px solid #3a1010", color: "#7a3030",
                        padding: "10px 24px", fontFamily: "var(--font-ui)", fontSize: 11,
                        letterSpacing: "0.2em", textTransform: "uppercase", cursor: "pointer"
                      }}>ELIMINA</button>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{
                flex: 1, display: "flex", alignItems: "center", justifyContent: "center",
                fontFamily: "var(--font-ui)", fontSize: 12, color: "#222", letterSpacing: "0.3em"
              }}>
                SELEZIONA UNA CANDIDATURA
              </div>
            )}
          </div>
        </div>
      );
    }
 
    // ─── APP ROOT ─────────────────────────────────────────────────────────────────
    function App() {
      const [view, setView] = useState("landing");
 
      return (
        <>
          <style>{FONTS}</style>
          {view === "landing" && (
            <Landing
              onApply={() => setView("apply")}
              onAdmin={() => setView("admin")}
            />
          )}
          {view === "apply" && (
            <ApplicationForm
              onBack={() => setView("landing")}
              onSubmit={() => {}}
            />
          )}
          {view === "admin" && (
            <AdminPanel onBack={() => setView("landing")} />
          )}
        </>
      );
    }
 
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
