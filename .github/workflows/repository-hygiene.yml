# Igiene del repository: percorsi compatibili con Windows e nessuna password amministrativa nel codice.
# Solo lettura: nessun secret, nessun deploy, nessuna richiesta a Firebase o al Worker.
name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main, feature/configurable-score-levels, feature/instagram-benchmark-editor, fix/benchmark-persistence-curves]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: node --test test/repository/*.test.mjs
