# Test di frontend, validatore, Worker, browser e Firestore Rules su ogni pull request e su main.
# Solo lettura: nessun secret, nessun deploy, nessuna richiesta a Firebase o al Worker reali
# (il browser gira con la risoluzione DNS bloccata e tutte le richieste intercettate).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Frontend
        run: node --test $(ls test/frontend/*.test.mjs | grep -v browser)
      - name: Validatore server/collective
        run: node --test server/collective/test/*.test.mjs
      - name: Contratto Firestore
        run: node --test security/firestore/test/frontend-contract.test.mjs security/firestore/test/emulator-diagnostics.test.mjs
      - name: Worker
        working-directory: worker
        run: node --test --test-concurrency=1 "test/*.test.mjs"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Dipendenze dei test, fuori dal repository (stesse versioni fissate nelle pagine)
        run: |
          mkdir -p "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          echo '{"name":"browser-test-assets","private":true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts --save-exact playwright@1.64.1 react@18.3.1 react-dom@18.3.1 @babel/standalone@8.0.9
          npx playwright install --with-deps chromium
          echo "EVORA_CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Test browser
        env:
          NODE_PATH: ${{ runner.temp }}/assets/node_modules
          EVORA_BROWSER_ASSETS: ${{ runner.temp }}/assets
        run: node --test --test-concurrency=1 test/frontend/browser.test.mjs

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Emulator, Rules in produzione (profilo migration)
        working-directory: security/firestore
        env:
          EVORA_RULES_PROFILE: migration
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
